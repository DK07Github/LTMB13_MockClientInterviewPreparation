{ id: "SCN001", section: "Scenario-Based", topic: "Performance", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "A dashboard query that ran in 5 s now takes 3 minutes. Nothing in the SQL changed. Walk me through your investigation.",
  answer: `<strong>Approach:</strong><br>1. Pull both runs from QUERY_HISTORY: compare queued_overload_time, compilation_time, execution_time, bytes_scanned, partitions_scanned/total, spill columns.<br>2. Queued time up = warehouse concurrency problem (scale out / separate warehouse). Compilation up = view layering or object changes.<br>3. Partitions scanned jumped = clustering degradation or new data pattern; check SYSTEM$CLUSTERING_INFORMATION.<br>4. Spill to remote = data volume outgrew the warehouse.<br>5. Join output rows &gt;&gt; input = a dimension now has duplicate keys.<br>6. Check if the earlier run was a result-cache hit (0 s compute) - the '5 s' may have been cached.<br>7. Fix the cause, change one thing at a time, re-measure with USE_CACHED_RESULT = FALSE.`,
  tricky: "The 'fast' baseline may have been served from result cache, so nothing regressed in compute at all.", clientApp: "Standard first-week production support triage.", docLink: "https://docs.snowflake.com/en/user-guide/ui-query-profile" },
{ id: "SCN002", section: "Scenario-Based", topic: "Cost", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Credits doubled this month. Nobody admits to launching anything new. How do you find the cause?",
  answer: `<pre class="code-block">SELECT DATE_TRUNC('day', start_time) d, warehouse_name, SUM(credits_used) c
FROM snowflake.account_usage.warehouse_metering_history
WHERE start_time &gt;= DATEADD(day,-60,CURRENT_TIMESTAMP())
GROUP BY 1,2 ORDER BY 1,3 DESC;</pre>Then: (1) find the day/warehouse where the jump began; (2) top queries that day by elapsed time and bytes; (3) check serverless views (AUTOMATIC_CLUSTERING_HISTORY, MATERIALIZED_VIEW_REFRESH_HISTORY, SERVERLESS_TASK_HISTORY, PIPE_USAGE_HISTORY, SEARCH_OPTIMIZATION_HISTORY, CORTEX usage); (4) check AUTO_SUSPEND changes (ALTER WAREHOUSE in QUERY_HISTORY); (5) check a BI tool polling every few seconds keeping a warehouse awake.`,
  tricky: "Warehouse credits are only one bucket; serverless features are not covered by resource monitors.", clientApp: "FinOps review deliverable.", docLink: "https://docs.snowflake.com/en/user-guide/cost-optimize" },
{ id: "SCN003", section: "Scenario-Based", topic: "Data Loading", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "A vendor re-sends the same CSV with corrected rows under the SAME file name. COPY INTO skips it. How do you design the load so corrections land exactly once?",
  answer: `COPY tracks file name + ETag/checksum for 64 days. A modified file has a new checksum, so it may reload, which duplicates the unchanged rows. Do not rely on FORCE.<br><br><strong>Design:</strong> land every file into a RAW table with METADATA$FILENAME, METADATA$FILE_LAST_MODIFIED and a load id; then MERGE into CORE on the business key, picking the latest by file_last_modified. Optionally ask the vendor to add a version suffix. Track loaded files in your own audit table (file name + checksum) because Snowflake's memory expires.`,
  tricky: "A corrected file can both reload and double-count if you append-only; MERGE on business key makes it idempotent.", clientApp: "Vendor feeds with restatements.", docLink: "https://docs.snowflake.com/en/user-guide/data-load-considerations-load" },
{ id: "SCN004", section: "Scenario-Based", topic: "Data Loading", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "COPY INTO with ON_ERROR = CONTINUE finished 'successfully' but 4% of rows are missing and nobody noticed for a week. What controls do you add?",
  answer: `1. Capture the COPY result (rows_parsed, rows_loaded, errors_seen, first_error) into an audit table every run.<br>2. Use ON_ERROR = SKIP_FILE_n% or ABORT_STATEMENT for critical tables so thresholds fail loudly.<br>3. Persist rejects: <code>SELECT * FROM TABLE(VALIDATE(tbl, JOB_ID=&gt;'_last'))</code> into an error table.<br>4. Reconcile row counts and control totals against the file trailer/source.<br>5. Alert (Snowflake ALERT or orchestrator) when errors_seen &gt; threshold.<br>6. Backfill: fix the rows and reload only rejects.`,
  tricky: "SUCCESS status only means the statement ran, not that every row loaded.", clientApp: "Silent data loss root-cause review.", docLink: "https://docs.snowflake.com/en/sql-reference/sql/copy-into-table" },
{ id: "SCN005", section: "Scenario-Based", topic: "Snowpipe", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Snowpipe auto-ingest worked in dev but loads nothing in prod. SYSTEM$PIPE_STATUS shows RUNNING with 0 pending files. What now?",
  answer: `0 pending means notifications never reached the pipe. Check: (1) the bucket event notification points to the pipe's notification_channel from SHOW PIPES (SQS ARN/Event Grid/PubSub); (2) the event prefix/suffix filters match the file path; (3) files were added after pipe creation - older ones need ALTER PIPE ... REFRESH (7-day window); (4) the storage integration role/IAM trust is valid for prod bucket; (5) the pipe's stage path matches; (6) cross-region bucket/notification setup.<br>Prove it with a manual REFRESH: if files load, ingestion logic is fine and only notifications are broken.`,
  tricky: "REFRESH only sees files from the last 7 days.", clientApp: "Environment-promotion defect.", docLink: "https://docs.snowflake.com/en/user-guide/data-load-snowpipe-ts" },
{ id: "SCN006", section: "Scenario-Based", topic: "Streams", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Your MERGE task consumes a stream, but it fails every night at 02:10 and the stream grows. Will data be lost? How do you recover?",
  answer: `A failed MERGE rolls back, so the stream offset does NOT advance; changes are retained and will be picked up next successful run, as long as the stream does not go stale (offset older than retention, extended up to MAX_DATA_EXTENSION_TIME_IN_DAYS).<br><br><strong>Recover:</strong> read TASK_HISTORY error_message, fix root cause, run EXECUTE TASK. Monitor <code>SHOW STREAMS</code> stale_after, and alert if stale_after is within days. If it went stale, recreate the stream and backfill the gap from the base table (compare by updated_at or full reconcile).`,
  tricky: "Stale streams lose unconsumed history permanently; backfill is a manual reconcile.", clientApp: "Operational runbook.", docLink: "https://docs.snowflake.com/en/user-guide/streams-intro" },
{ id: "SCN007", section: "Scenario-Based", topic: "Streams", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Two downstream pipelines need the same change data from one table. Can they share a stream?",
  answer: `No. A stream has a single offset; whichever consumer commits first advances it, and the other sees nothing. Options: (1) create one stream per consumer on the same table (cheap, each has its own offset); (2) consume once into a change-log table (append) and let both read from it; (3) consume both in the same transaction (repeatable-read inside a transaction); (4) switch one consumer to a dynamic table. Option 1 or 2 is the usual answer.`,
  tricky: "Multiple streams on one table are fine; a shared stream is the bug.", clientApp: "Multi-consumer CDC design.", docLink: "https://docs.snowflake.com/en/user-guide/streams-intro" },
{ id: "SCN008", section: "Scenario-Based", topic: "Tasks", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A nightly task graph occasionally runs twice, producing duplicates. Why, and how do you make it safe?",
  answer: `Possible causes: manual EXECUTE TASK plus schedule; a retry (TASK_AUTO_RETRY_ATTEMPTS) after partial progress; ALLOW_OVERLAPPING_EXECUTION=TRUE; two environments cloned with the same schedule; cron/DST edge.<br><br><strong>Make it safe:</strong> keep ALLOW_OVERLAPPING_EXECUTION FALSE, make each step idempotent (MERGE or delete+insert by batch id in one transaction), store a batch id via SYSTEM$SET_RETURN_VALUE, and write watermarks only after commit. Check TASK_HISTORY for the run group ids.`,
  tricky: "Idempotent steps beat trying to guarantee 'exactly one run'.", clientApp: "Duplicate incident RCA.", docLink: "https://docs.snowflake.com/en/user-guide/tasks-graphs" },
{ id: "SCN009", section: "Scenario-Based", topic: "Dynamic Tables", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A dynamic table with TARGET_LAG = 1 minute is always 20 minutes behind and cost is high. What do you check?",
  answer: `1. Refresh history: refresh_action. If FULL each time, the query is not incremental-friendly (non-deterministic functions, unsupported constructs, big DISTINCT/outer joins).<br>2. Refresh duration vs lag: lag cannot be met if a refresh takes longer than 1 minute.<br>3. Warehouse size/queuing.<br>4. Upstream chain lag (DOWNSTREAM settings).<br>5. Change volume per refresh.<br><br><strong>Fix:</strong> rewrite for incremental mode, simplify joins, relax lag to match business need, right-size the warehouse, or switch the heavy part to scheduled batch.`,
  tricky: "Shorter lag multiplies refresh count and cost; target lag is a goal, not an SLA.", clientApp: "Cost/latency trade-off conversation.", docLink: "https://docs.snowflake.com/en/user-guide/dynamic-tables-monitor" },
{ id: "SCN010", section: "Scenario-Based", topic: "Security", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "An analyst says: 'I can SELECT the table in the UI but my BI tool user gets Object does not exist.' Same user name. Why?",
  answer: `Different <strong>active role</strong> (and/or warehouse/database context). The UI default role differs from the role in the BI connection, so grants differ. Check <code>SELECT CURRENT_ROLE()</code> in both, <code>SHOW GRANTS TO USER</code>, DEFAULT_ROLE, secondary roles (USE SECONDARY ROLES ALL), and that the BI role has USAGE on database, schema and SELECT on the table (and future grants for new tables). Also check masking/row policies and network policy differences.`,
  tricky: "'Does not exist' often means 'not authorized' in Snowflake error text.", clientApp: "Most common access ticket.", docLink: "https://docs.snowflake.com/en/user-guide/security-access-control-overview" },
{ id: "SCN011", section: "Scenario-Based", topic: "Security", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "New tables created by the ETL role are invisible to analysts until someone runs grants manually. Fix this permanently.",
  answer: `Use <strong>future grants</strong> plus schema design: <pre class="code-block">GRANT SELECT ON FUTURE TABLES IN SCHEMA mart TO ROLE analyst;
GRANT SELECT ON FUTURE VIEWS  IN SCHEMA mart TO ROLE analyst;</pre>Better: grant to an access role (MART_R) and roll that to business roles; use a managed access schema so grants are centralized. Remember: future grants do not apply to existing objects (run ALL grants once), and schema-level future grants override database-level ones for the same type. Consider CREATE OR REPLACE with COPY GRANTS in deployments.`,
  tricky: "CREATE OR REPLACE drops grants unless COPY GRANTS is used.", clientApp: "RBAC hygiene.", docLink: "https://docs.snowflake.com/en/sql-reference/sql/grant-privilege" },
{ id: "SCN012", section: "Scenario-Based", topic: "Security", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Compliance asks: 'Who queried customer SSN in the last 90 days?' How do you answer?",
  answer: `Use ACCESS_HISTORY (Enterprise+): <pre class="code-block">SELECT query_start_time, user_name, query_id
FROM snowflake.account_usage.access_history,
     LATERAL FLATTEN(base_objects_accessed) f,
     LATERAL FLATTEN(f.value:columns) c
WHERE f.value:objectName::STRING = 'SALES_DB.RAW.CUSTOMERS'
  AND c.value:columnName::STRING = 'SSN'
  AND query_start_time &gt;= DATEADD(day,-90,CURRENT_TIMESTAMP());</pre>Join QUERY_HISTORY for SQL text and role. Caveats: view/ACCOUNT_USAGE latency, retention 365 days, and it cannot show downstream BI exports.`,
  tricky: "Use base_objects_accessed to catch access through views.", clientApp: "Audit evidence.", docLink: "https://docs.snowflake.com/en/user-guide/access-history" },
{ id: "SCN013", section: "Scenario-Based", topic: "Governance", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "After a masking policy was added, a report that joins two tables on email suddenly returns fewer rows for analysts but not for admins. Why?",
  answer: `Masking is applied at query time per role, and the join key now sees the <strong>masked value</strong> for analysts (e.g. '*****@x.com'), so equality joins stop matching. Fixes: join on a surrogate/non-sensitive key; expose a deterministic hashed email for analysts (with governance approval); use a secure view that joins internally; or allow the join role to see the unmasked value via a conditional policy. Never expose PII just to keep a join working.`,
  tricky: "Aggregates and joins operate on masked values for unauthorized roles.", clientApp: "Policy rollout regression.", docLink: "https://docs.snowflake.com/en/user-guide/security-column-ddm-intro" },
{ id: "SCN014", section: "Scenario-Based", topic: "Time Travel", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Someone ran an UPDATE without WHERE on a prod table 40 minutes ago. Restore only the affected rows without losing 40 minutes of valid changes.",
  answer: `<pre class="code-block">-- 1. find the bad statement
SELECT query_id FROM TABLE(INFORMATION_SCHEMA.QUERY_HISTORY()) WHERE query_text ILIKE 'update orders%';
-- 2. clone the pre-update state
CREATE TABLE orders_pre CLONE orders BEFORE(STATEMENT =&gt; '&lt;bad_query_id&gt;');
-- 3. merge back only the damaged column for rows unchanged since
MERGE INTO orders t USING orders_pre p ON t.order_id = p.order_id
WHEN MATCHED AND t.updated_at = :bad_update_ts THEN UPDATE SET t.status = p.status;</pre>Do not simply restore the whole table; you would lose valid later changes. Validate counts, then drop the clone.`,
  tricky: "BEFORE(STATEMENT) lets you target the exact bad query.", clientApp: "Incident recovery.", docLink: "https://docs.snowflake.com/en/user-guide/data-time-travel" },
{ id: "SCN015", section: "Scenario-Based", topic: "Time Travel", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A schema with Time Travel 1 day was dropped; one table in it had 90-day retention. Can you recover that table after 3 days?",
  answer: `No via normal means. When a schema/database is dropped, the container's retention governs its children, so the table is not kept 90 days. After 1 day it is in Fail-safe (7 days, permanent tables) and only Snowflake Support may recover it, best effort. Prevention: set retention on containers appropriately, restrict DROP privileges, use replication/backups for critical data, and clone before risky changes.`,
  tricky: "Child retention does not outlive a dropped parent.", clientApp: "DR planning.", docLink: "https://docs.snowflake.com/en/user-guide/data-time-travel" },
{ id: "SCN016", section: "Scenario-Based", topic: "Cloning", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "You cloned prod to create dev. Dev tasks started running against real S3 data and emailing customers. What went wrong and how to prevent it?",
  answer: `Cloned pipes/tasks/integrations still reference the same external locations and notification integrations. Tasks clone as suspended, so someone resumed them; email integrations and external stages are account-level and unchanged.<br><br><strong>Prevent:</strong> post-clone runbook: keep tasks suspended, repoint stages/integrations to dev, mask PII (or use a masked share), disable notifications, use a dev role without access to prod storage integrations, and script the refresh so it is repeatable.`,
  tricky: "Cloning copies metadata; it does not isolate external side effects.", clientApp: "Dev/test refresh process.", docLink: "https://docs.snowflake.com/en/user-guide/object-clone" },
{ id: "SCN017", section: "Scenario-Based", topic: "Semi-Structured", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Orders arrive as JSON with line_items arrays. After FLATTEN, order counts in the report are lower than in the source. Diagnose.",
  answer: `FLATTEN on an empty array or missing key returns <strong>no rows</strong>, so orders without items vanish in an inner lateral join. Fix with <code>LATERAL FLATTEN(INPUT =&gt; v:line_items, OUTER =&gt; TRUE)</code>. Also check: multiple FLATTENs multiply rows; counting rows after flatten counts items not orders (use COUNT(DISTINCT order_id)); JSON null vs SQL NULL; key case-sensitivity (v:Items vs v:items).`,
  tricky: "Grain changes after FLATTEN; reconcile at the exploded grain.", clientApp: "Missing orders ticket.", docLink: "https://docs.snowflake.com/en/sql-reference/functions/flatten" },
{ id: "SCN018", section: "Scenario-Based", topic: "Semi-Structured", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "The source team adds new JSON attributes weekly and sometimes renames old ones. Design ingestion that does not break.",
  answer: `Land raw as VARIANT (plus file name, load time) so new fields never break loads; project agreed attributes into a typed layer (dynamic table or ELT) and keep the remaining payload as VARIANT. Add schema-drift detection (compare distinct key sets per day) and alert on renamed/missing keys. Use a data contract with versioned views for consumers. Avoid auto-promoting new columns into marts without review (PII risk).`,
  tricky: "Typed projections hide renames: the new key just becomes NULL.", clientApp: "Event/API payload ingestion.", docLink: "https://docs.snowflake.com/en/user-guide/semistructured-considerations" },
{ id: "SCN019", section: "Scenario-Based", topic: "SCD", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "The SCD2 customer dimension has two rows flagged is_current = TRUE for the same customer. How did it happen and how do you repair it?",
  answer: `Likely causes: close-old and insert-new ran as separate statements without a transaction; a retry inserted again; concurrent runs; source sent two changes for one key in the same batch without ordering; change detection used &lt;&gt; and mishandled NULLs.<br><br><strong>Repair:</strong> find keys with COUNT(*)&gt;1 where is_current; keep the latest eff_from, set others is_current=FALSE and eff_to to the next row's eff_from; verify fact FK usage. <strong>Prevent:</strong> single MERGE/transaction, dedup latest per key per batch, EQUAL_NULL comparisons, and a DQ check after each load.`,
  tricky: "Snowflake does not enforce uniqueness; you must test it.", clientApp: "Dimension integrity incident.", docLink: "https://docs.snowflake.com/en/sql-reference/functions/equal_null" },
{ id: "SCN020", section: "Scenario-Based", topic: "Modeling", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Fact rows arrive before their customer exists in the dimension. Rows are dropped by inner joins. How do you handle early-arriving facts?",
  answer: `Use <strong>inferred members</strong>: when the fact load finds no match, insert a placeholder dimension row (natural key, 'Unknown' attributes, inferred flag) and use its surrogate key. When the real customer arrives, update the inferred row (and start SCD2 history appropriately). Never map to a permanent 'Unknown' (-1) without a repair job. Add a DQ metric for the count of inferred members aging beyond SLA.`,
  tricky: "Permanent -1 mapping makes history wrong forever.", clientApp: "Cross-system timing gaps.", docLink: "" },
{ id: "SCN021", section: "Scenario-Based", topic: "Modeling", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Revenue by month is correct in the fact table but inflated in the BI dashboard after adding a Product Category filter. Why?",
  answer: `Likely a many-to-many (product belongs to multiple categories) or a duplicate dimension key causing fan-out: each fact row repeats per category and SUM inflates. Verify with COUNT(*) before and after the join. Fixes: model a bridge table with an allocation factor, pick a primary category, dedupe the dimension to one row per key, or aggregate before joining. Do not mask with DISTINCT.`,
  tricky: "Fan-out is silent; only reconciliation reveals it.", clientApp: "BI number mismatch.", docLink: "" },
{ id: "SCN022", section: "Scenario-Based", topic: "Migration", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "After migrating from Oracle, counts differ: WHERE col = '' and NULL handling return different rows. Explain.",
  answer: `Oracle treats an empty string as NULL; Snowflake treats '' as a real empty value, distinct from NULL. So filters, joins, uniqueness and COUNT(col) change. Other differences: case-sensitivity of strings, DATE vs TIMESTAMP (Oracle DATE has time), NUMBER precision, implicit conversions, ROWNUM, sequences/gaps. Normalise during load (NULLIF(col,'')), test with side-by-side reconciliation, and document rules.`,
  tricky: "Reconciliation rows 'missing' may just be NULL vs ''.", clientApp: "Migration validation.", docLink: "https://docs.snowflake.com/en/user-guide/migration" },
{ id: "SCN023", section: "Scenario-Based", topic: "Migration", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Teradata/Oracle indexes and partitions disappear in Snowflake. A migrated report is slower. What do you do?",
  answer: `Do not recreate indexes (none exist). Check Query Profile for pruning. Options in order: filter predicates that are sargable; clustering key on large tables for the main filter column (date, then region); search optimization for point lookups; materialized view/dynamic table for repeated aggregates; right-size warehouse; rewrite row-by-row procedures into set-based SQL; remove unnecessary DISTINCT/ORDER BY. Measure each change.`,
  tricky: "Clustering small tables only adds cost.", clientApp: "Post-migration tuning.", docLink: "https://docs.snowflake.com/en/user-guide/tables-clustering-keys" },
{ id: "SCN024", section: "Scenario-Based", topic: "Concurrency", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Two parallel jobs MERGE into the same target table; one waits for hours. Why and how do you redesign?",
  answer: `UPDATE/DELETE/MERGE take table-level locks, so concurrent writers on one table queue; LOCK_TIMEOUT default is 12 hours. Check SHOW LOCKS/TRANSACTION_BLOCKED_TIME. Redesign: serialize writers, load partitions into separate staging tables then one MERGE, use INSERT-only landing plus a single apply step, split targets by domain, and lower LOCK_TIMEOUT for fail-fast.`,
  tricky: "Parallelism on one target table does not speed anything up.", clientApp: "Orchestration design.", docLink: "https://docs.snowflake.com/en/sql-reference/transactions" },
{ id: "SCN025", section: "Scenario-Based", topic: "Warehouse", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Month-end close queries queue for 20 minutes while ad hoc users run on the same warehouse. Propose a design.",
  answer: `Separate workloads: dedicated warehouse for close/ELT (sized for the heavy step, auto-suspend), a multi-cluster warehouse for BI concurrency, and a small capped one for ad hoc (statement timeout, resource monitor). Use workload-specific roles so users default to the right warehouse. Consider Query Acceleration for outliers. Measure queued_overload_time before/after.`,
  tricky: "Bigger size does not fix queueing; separation or scale-out does.", clientApp: "Capacity planning.", docLink: "https://docs.snowflake.com/en/user-guide/warehouses-multicluster" },
{ id: "SCN026", section: "Scenario-Based", topic: "Storage", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Storage cost keeps rising though row counts are flat. Find out why.",
  answer: `Query TABLE_STORAGE_METRICS: split ACTIVE_BYTES, TIME_TRAVEL_BYTES, FAILSAFE_BYTES, RETAINED_FOR_CLONE_BYTES. Typical causes: truncate-and-reload tables with long retention (each reload keeps old versions), permanent staging tables paying 7 days Fail-safe, old clones pinning micro-partitions, and unreferenced stage files. Fix: transient staging tables with retention 0-1, lower retention on high-churn tables, drop old clones, PURGE/REMOVE stage files.`,
  tricky: "Dropping a table does not free storage until retention and Fail-safe pass.", clientApp: "Storage review.", docLink: "https://docs.snowflake.com/en/sql-reference/account-usage/table_storage_metrics" },
{ id: "SCN027", section: "Scenario-Based", topic: "Data Sharing", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A partner in another cloud region needs your data daily. What are the options and costs?",
  answer: `Same-region/cloud: direct share, no copy. Cross-region/cloud: replicate the database to an account in the partner's region (replication group or listing auto-fulfillment) then share there. Alternatives: reader account (provider pays compute), unload to partner's storage. Costs: replication compute, cross-region transfer, storage in the target; consumer pays query compute. Use secure views with entitlement mapping.`,
  tricky: "Direct sharing cannot cross region/cloud without replication.", clientApp: "Data-product delivery.", docLink: "https://docs.snowflake.com/en/user-guide/data-sharing-intro" },
{ id: "SCN028", section: "Scenario-Based", topic: "Security", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "You applied an account-level network policy and immediately everyone, including you, is locked out. How do you prevent and recover?",
  answer: `Recover: a user with an existing session can ALTER ACCOUNT UNSET NETWORK_POLICY; otherwise contact Snowflake Support. Prevent: test on a single test user first (user-level policy), include your own and service IPs, keep a break-glass admin allowed, use network rules with allowlists reviewed by two people, and stage in dev account.`,
  tricky: "User-level policies override account-level; test there first.", clientApp: "Security change control.", docLink: "https://docs.snowflake.com/en/user-guide/network-policies" },
{ id: "SCN029", section: "Scenario-Based", topic: "Security", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "IDMC loads started failing with 'JWT token is invalid' after the security team rotated keys. Explain the safe rotation procedure.",
  answer: `Use two key slots: add the new key to RSA_PUBLIC_KEY_2 (<code>ALTER USER svc SET RSA_PUBLIC_KEY_2='...'</code>), update the client/connection to the new private key, verify logins, then <code>UNSET RSA_PUBLIC_KEY</code>. Mistakes: pasting BEGIN/END lines, wrong account identifier format in the JWT iss claim, encrypted key passphrase mismatch, rotating the old key first. Update the IDMC connection and test it before cutover.`,
  tricky: "Rotate by adding slot 2, not replacing slot 1.", clientApp: "Service account lifecycle.", docLink: "https://docs.snowflake.com/en/user-guide/key-pair-auth" },
{ id: "SCN030", section: "Scenario-Based", topic: "Ingestion", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A source drops 200,000 tiny (50 KB) files per day. Snowpipe cost is high and latency inconsistent. What do you do?",
  answer: `Per-file overhead dominates. Compact upstream (batch small files into 100-250 MB compressed files), or ingest via Snowpipe Streaming/Kafka for event data, or batch COPY on a schedule with a warehouse. If files cannot change, stage them and COPY hourly instead of auto-ingest. Measure cost via PIPE_USAGE_HISTORY and compare options.`,
  tricky: "Faster ingest is not cheaper; file count drives Snowpipe cost.", clientApp: "Ingestion cost fix.", docLink: "https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro" },
{ id: "SCN031", section: "Scenario-Based", topic: "Clustering", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Auto-clustering credits are huge on a table that is truncated and reloaded nightly. Why, and what is the fix?",
  answer: `Every reload rewrites all micro-partitions so reclustering runs continuously. Options: cluster only if reads justify it; load pre-sorted by the clustering key (INSERT ... ORDER BY) so partitions arrive clustered; suspend reclustering during load (ALTER TABLE SUSPEND RECLUSTER) and resume; or drop the key. Prefer clustering on append-mostly tables.`,
  tricky: "High churn plus clustering equals runaway serverless cost.", clientApp: "Clustering cost-benefit.", docLink: "https://docs.snowflake.com/en/user-guide/tables-auto-reclustering" },
{ id: "SCN032", section: "Scenario-Based", topic: "Query Tuning", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A query with WHERE UPPER(city) = 'PUNE' scans all partitions. How do you fix without rewriting data?",
  answer: `Functions on the filter column defeat min/max pruning. Options: compare against normalised stored value (store city_upper at load), use case-insensitive collation (COLLATE 'en-ci') on the column, or add search optimization with substring/equality for lookups. Prove improvement via partitions scanned.`,
  tricky: "Pruning behaviour with functions can vary; always verify in Query Profile.", clientApp: "Easy tuning win.", docLink: "https://docs.snowflake.com/en/sql-reference/collation" },
{ id: "SCN033", section: "Scenario-Based", topic: "Query Tuning", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A report uses a view stack seven levels deep and compilation takes 40 s. What do you propose?",
  answer: `Compilation time is expanding every layer. Flatten logic into fewer layers, materialize intermediate results (dynamic table or table), remove SELECT * in views, avoid repeated references to heavy CTEs, and keep BI to a curated mart layer. Compare compilation_time in QUERY_HISTORY before and after.`,
  tricky: "A CTE referenced many times may be recomputed each time.", clientApp: "Semantic layer clean-up.", docLink: "https://docs.snowflake.com/en/user-guide/ui-query-profile" },
{ id: "SCN034", section: "Scenario-Based", topic: "Data Quality", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Finance says yesterday's revenue is 2% lower than the source system. Row counts match. Where do you look?",
  answer: `Equal counts can hide offsetting errors. Compare control totals by day/key: <code>SUM(amount)</code> per order_date and per source key; find mismatched keys. Check: currency conversion rounding, FLOAT vs NUMBER, late corrections not applied, timezone cut-off (UTC vs local day), cancelled/returned status filters, duplicates plus missing rows, truncation of decimals on load, and joins to dimensions dropping rows.`,
  tricky: "Always reconcile amounts, not only counts.", clientApp: "Finance sign-off.", docLink: "" },
{ id: "SCN035", section: "Scenario-Based", topic: "Date/Time", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Daily totals differ between Snowflake and the BI tool by a few percent around midnight. Why?",
  answer: `Time zone semantics. TIMESTAMP_NTZ has no zone; TIMESTAMP_LTZ renders in the session TIMEZONE; the BI tool may bucket in a different zone or week start (WEEK_START, WEEK_OF_YEAR_POLICY). Standardise: store UTC in NTZ, convert explicitly with CONVERT_TIMEZONE at reporting time, pin session parameters for the service user, and define the business day in the semantic layer.`,
  tricky: "CURRENT_TIMESTAMP() depends on session TIMEZONE.", clientApp: "Cross-region reporting.", docLink: "https://docs.snowflake.com/en/sql-reference/parameters" },
{ id: "SCN036", section: "Scenario-Based", topic: "Python", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A Python script loads a 5 GB DataFrame with a loop of cursor.execute inserts and takes hours. How do you fix it?",
  answer: `Use bulk paths: write Parquet/CSV to a stage and COPY INTO (or write_pandas which does PUT + COPY), or Snowpark so processing stays in Snowflake. Avoid row-by-row inserts; if you must, use executemany with bind arrays. Size files 100-250 MB, load in chunks, and verify with COPY_HISTORY.`,
  tricky: "write_pandas quotes lowercase column names; mismatch causes invalid identifier errors.", clientApp: "Python ingestion performance.", docLink: "https://docs.snowflake.com/en/developer-guide/python-connector/python-connector-api" },
{ id: "SCN037", section: "Scenario-Based", topic: "Snowpark", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A Snowpark job calls to_pandas() on a 2-billion-row DataFrame and the client crashes. What is the right design?",
  answer: `Keep processing server-side: filter/aggregate with DataFrame operations and write results with save_as_table; only bring small samples client-side. For Python logic use vectorized UDFs or stored procedures. If memory-heavy ML is required use a Snowpark-optimized warehouse or container runtime.`,
  tricky: "to_pandas() collects everything to the client; it is an action.", clientApp: "Snowpark coding standards.", docLink: "https://docs.snowflake.com/en/developer-guide/snowpark/python/performance" },
{ id: "SCN038", section: "Scenario-Based", topic: "Cortex", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A team ran an AI function over 80 million rows in a view that BI refreshes hourly. Bill spiked. How do you control it?",
  answer: `Cortex is billed per token. A view recomputes on every query. Materialize results (incremental: only new/changed rows via stream or dynamic table), sample and use AI_COUNT_TOKENS first, pick a smaller model, restrict CORTEX_USER to approved roles, set budgets/alerts, and store outputs with model name/version for reproducibility.`,
  tricky: "Never put LLM calls inside a frequently queried view.", clientApp: "AI cost governance.", docLink: "https://docs.snowflake.com/en/user-guide/snowflake-cortex/aisql" },
{ id: "SCN039", section: "Scenario-Based", topic: "Cortex", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A RAG chatbot over HR documents leaks salary info to employees who should not see it. How do you fix the architecture?",
  answer: `Retrieval must enforce entitlements: store ACL attributes with each chunk, use row access policies/filters (or per-audience search services) so retrieval returns only permitted chunks, run under the caller's role, mask PII before indexing, and log queries. Test with red-team prompts per persona. The LLM must never be the access-control layer.`,
  tricky: "Filtering after generation is too late.", clientApp: "Secure AI design.", docLink: "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/cortex-search-overview" },
{ id: "SCN040", section: "Scenario-Based", topic: "Orchestration", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Choose an orchestrator: Snowflake Tasks vs IDMC Taskflow vs Airflow for a client with 300 pipelines across Snowflake, SAP and SaaS. Justify.",
  answer: `Tasks are great for Snowflake-internal SQL chains but cannot reach SAP/SaaS, have limited cross-system dependency/alerting. IDMC Taskflow fits when pipelines are already IDMC mappings (connectors, parameters, notifications). Airflow fits code-first teams needing cross-tool dependencies. Likely design: IDMC for ingestion and orchestration of mappings, Snowflake Tasks/dynamic tables for in-warehouse transformation, one top-level scheduler for cross-system SLAs. Decide by skills, connectors, observability, and cost.`,
  tricky: "Avoid three schedulers owning the same dependency.", clientApp: "Architecture decision record.", docLink: "" },
{ id: "SCN041", section: "Scenario-Based", topic: "Reliability", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Design restartability for a 10-table nightly load when table 6 fails and downstream marts have started.",
  answer: `Per-table status in a control table; downstream waits on upstream success (dependency gates). Rerun failed table with the same batch id using MERGE/partition replace. Mart refresh should be re-triggered only after all upstream tables succeed, or mart reads a 'last good batch' marker. Reconcile before publishing. Roll back with Time Travel/clones if a bad batch already reached marts.`,
  tricky: "Marts must not run on partial upstream data.", clientApp: "Restart semantics.", docLink: "" },
{ id: "SCN042", section: "Scenario-Based", topic: "Reliability", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How would you detect that a pipeline succeeded technically but delivered stale data?",
  answer: `Freshness checks independent of job status: MAX(load_ts) or business date vs SLA, row-count anomaly vs trailing average, DMFs on freshness/null/duplicate, stream/dynamic table lag metrics, and a daily heartbeat. Alert the data owner with context (table, expected vs actual, last good load).`,
  tricky: "Job 'green' with 0 rows loaded is the classic silent failure.", clientApp: "Observability design.", docLink: "https://docs.snowflake.com/en/user-guide/data-quality-intro" },
{ id: "SCN043", section: "Scenario-Based", topic: "Cost", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A BI tool fires thousands of tiny queries per minute and the warehouse never suspends. What do you change?",
  answer: `Use a dedicated small BI warehouse, tune AUTO_SUSPEND to a minute or two balanced with cache benefit, enable result cache friendliness (stable SQL), use extracts or aggregated marts for chatty dashboards, reduce refresh frequency, and limit concurrency/timeouts. Check whether the 60-second minimum is being paid repeatedly.`,
  tricky: "Many tiny queries can cost more than one big one because of resume minimums.", clientApp: "BI cost control.", docLink: "https://docs.snowflake.com/en/user-guide/warehouses-considerations" },
{ id: "SCN044", section: "Scenario-Based", topic: "Governance", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Auto-classification tagged a business column as PII and masking broke a downstream job. How do you roll out governance safely?",
  answer: `Classification only suggests. Review results, apply tags to a pilot, assess lineage/ACCESS_HISTORY for consumers, test the masking policy per role in a clone, communicate, then enforce via tag-based masking. Provide a break-glass role and a rollback.`,
  tricky: "Enforcing policies without impact analysis breaks pipelines.", clientApp: "Governance rollout.", docLink: "https://docs.snowflake.com/en/user-guide/governance-classify" },
{ id: "SCN045", section: "Scenario-Based", topic: "Multi-Account", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A client wants dev/test/prod. One account or three? Defend your choice.",
  answer: `Regulated clients: separate prod account (isolated network policies, keys, access), dev/test can share an account with cloned databases and small warehouses. One account is simpler and cheaper but couples admin risk and limits. Use ORGADMIN, infrastructure as code (Terraform/schemachange), replication for promotion, and consistent role models.`,
  tricky: "More accounts mean more integrations and policies to keep in sync.", clientApp: "Account strategy.", docLink: "https://docs.snowflake.com/en/user-guide/organizations" },
{ id: "SCN046", section: "Scenario-Based", topic: "Late Data", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Events arrive up to 3 days late. Daily aggregates were already published. How do you keep aggregates correct?",
  answer: `Process by event date with a rolling reprocess window (re-aggregate last 3-4 days each run) using partition replace or MERGE; dynamic tables handle this automatically. Version published numbers if finance needs 'as reported' snapshots, and publish a restatement flag. Define a cut-off after which data is frozen.`,
  tricky: "A watermark by load time hides late events; use event time plus a lookback.", clientApp: "Streaming/IoT reporting.", docLink: "" },
{ id: "SCN047", section: "Scenario-Based", topic: "Disaster Recovery", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A region outage is possible. Walk through a failover plan and what often fails in tests.",
  answer: `Failover group replicates databases, users, roles, warehouses, integrations to a secondary (Business Critical+). Steps: promote secondary, redirect clients via connection objects, resume tasks/pipes/dynamic tables, validate data freshness (RPO), re-point ETL tools and BI. Often failing: network policies/private connectivity not set in DR, integrations needing re-auth, external stage IAM trusts, tasks not resumed, secrets, and clients with hard-coded URLs.`,
  tricky: "Untested DR is not DR.", clientApp: "BCP/DR sign-off.", docLink: "https://docs.snowflake.com/en/user-guide/account-replication-intro" },
{ id: "SCN048", section: "Scenario-Based", topic: "Query Tuning", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "NOT IN returns zero rows in a prod anti-join that worked in test. Why?",
  answer: `Production data contains NULLs in the subquery column; NOT IN with a NULL evaluates to UNKNOWN for every row, returning nothing. Use NOT EXISTS or filter NULLs. Add a DQ check for NULL keys. Also confirm whether duplicates or case differences matter.`,
  tricky: "Test data rarely includes NULL keys.", clientApp: "Classic SQL production bug.", docLink: "" },
{ id: "SCN049", section: "Scenario-Based", topic: "UDF", type: "Scenario", difficulty: "Advanced", priority: "Medium", coverage: "Beyond TOC",
  question: "A Python UDF makes a query 50x slower than SQL. What are your options?",
  answer: `Replace with built-in SQL functions/regex where possible; otherwise convert to a vectorized (batch) UDF, reduce rows before the UDF call, avoid per-row network or imports, cache heavy objects at module level, and test on a sample. Consider a Snowpark pipeline instead of row-level UDF logic.`,
  tricky: "Scalar Python UDFs run per row in a sandbox.", clientApp: "UDF performance review.", docLink: "https://docs.snowflake.com/en/developer-guide/udf/python/udf-python-batch" },
{ id: "SCN050", section: "Scenario-Based", topic: "Data Lake", type: "Scenario", difficulty: "Advanced", priority: "Medium", coverage: "Beyond TOC",
  question: "Client has a Spark lake on S3 and wants Snowflake access without copying 200 TB. Options?",
  answer: `External tables over Parquet (read-only, slower), or Iceberg tables with an external catalog or Snowflake-managed catalog stored in client's S3 via external volume. For heavy BI, load hot subsets into native tables. Evaluate performance, feature gaps (Time Travel, clustering), catalog ownership, and cost.`,
  tricky: "External tables are not a performance replacement for native tables.", clientApp: "Lakehouse strategy.", docLink: "https://docs.snowflake.com/en/user-guide/tables-iceberg" },
{ id: "SCN051", section: "Scenario-Based", topic: "Idempotency", type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "The same Kafka event can arrive twice. How do you guarantee one row per event in Snowflake?",
  answer: `At-least-once delivery is normal. Use a stable event_id and either Snowpipe Streaming offset tokens at ingestion or dedupe downstream: MERGE on event_id, or QUALIFY ROW_NUMBER() by event_id keeping the first/latest. Keep raw immutable, dedupe in the typed layer, and monitor duplicate rate.`,
  tricky: "Without a natural event id, create a deterministic hash of key fields.", clientApp: "Streaming correctness.", docLink: "https://docs.snowflake.com/en/user-guide/data-load-snowpipe-streaming-overview" },
{ id: "SCN052", section: "Scenario-Based", topic: "Deployment", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A deployment script used CREATE OR REPLACE VIEW and analysts lost access. Prevent this class of issue.",
  answer: `CREATE OR REPLACE drops grants unless COPY GRANTS is specified. Use CREATE OR ALTER where available, or ALTER, include COPY GRANTS, rely on future grants/access roles, run post-deploy grant validation tests, and deploy via versioned migrations with a rollback path (clone before change).`,
  tricky: "Ownership changes also affect task and view behaviour.", clientApp: "CI/CD hardening.", docLink: "https://docs.snowflake.com/en/sql-reference/sql/create-view" },
{ id: "SCN053", section: "Scenario-Based", topic: "Sizing", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do you pick a warehouse size for a new heavy ELT job with evidence?",
  answer: `Run the job on XS to 2XL with cold cache and result cache off, record elapsed time, spill, credits (size credits/hr x time). Stop upsizing when time stops halving. Pick the cheapest size meeting the SLA. Validate repeatability and test at production volume.`,
  tricky: "Doubling size doubling speed means equal cost; diminishing returns cost more.", clientApp: "Cost/performance proof.", docLink: "https://docs.snowflake.com/en/user-guide/warehouses-considerations" },
{ id: "SCN054", section: "Scenario-Based", topic: "Data Contracts", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "An upstream team drops a column without notice and breaks 15 dashboards. What process change do you propose?",
  answer: `Introduce data contracts and versioned interfaces: consumers read stable views, producers announce changes via change control, automated schema-drift detection and CI tests, lineage/OBJECT_DEPENDENCIES impact reports before changes, deprecation windows, and alerts on contract violation.`,
  tricky: "Technical fixes alone fail without ownership agreements.", clientApp: "Operating model.", docLink: "https://docs.snowflake.com/en/user-guide/access-history" },
{ id: "SCN055", section: "Scenario-Based", topic: "Interview Meta", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "The client's lead says: 'Why Snowflake plus IDMC and not just Fivetran plus dbt?' Give a balanced answer.",
  answer: `Fivetran+dbt: fast SaaS ingestion, SQL-first transformation, lower tooling overhead, great for analytics teams. IDMC adds enterprise connectors (SAP, mainframe, on-prem via Secure Agent), CDC, data quality, governance/catalog, API/application integration (CAI), and orchestration in one governed platform. Choose by source mix, regulatory needs, team skills, licensing and TCO. Hybrid is common (IDMC ingest, dbt/SQL transform).`,
  tricky: "Avoid tool tribalism; present decision criteria.", clientApp: "Architecture pitch.", docLink: "" },
