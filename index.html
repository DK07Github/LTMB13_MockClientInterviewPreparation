},
{
  id: "SQL077", section: "SQL", topic: "Scenario",
  type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "After a pipeline rerun, the target table has duplicate records. Redesign the pipeline to be idempotent.",
  answer: "<strong>Root cause:</strong> Plain INSERT or append-only load without deduplication allows reruns to add rows again.<br><br><strong>Fix — use MERGE with business key:</strong><pre class=\"code-block\">MERGE INTO orders_core t\nUSING (\n  SELECT * FROM orders_stage\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC)=1\n) s\nON t.order_id = s.order_id\nWHEN MATCHED THEN UPDATE SET t.status=s.status, t.amount=s.amount\nWHEN NOT MATCHED THEN INSERT (order_id,status,amount) VALUES (s.order_id,s.status,s.amount);\n</pre><strong>Additional controls:</strong> load metadata (file_name + checksum), run IDs in staging, QUALIFY dedup in staging before MERGE.",
  tricky: "A checkpoint saved before the MERGE commit can cause watermark advancement with partial data. Commit watermark only AFTER MERGE succeeds.", clientApp: "Idempotency is a must-have requirement on every production ETL.",
  docLink: ""
},
{
  id: "SQL078", section: "SQL", topic: "Scenario",
  type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A query that was running in 10 seconds now takes 4 minutes after a data volume increase. What is your investigation plan?",
  answer: "<strong>1. Gather facts:</strong> query id, before/after row counts, data growth %, warehouse size unchanged?<br><strong>2. Query Profile:</strong> compare before/after — did partitions scanned increase proportionally or explosively?<br><strong>3. Check join cardinality:</strong> is a dimension growing and creating M:M?<br><strong>4. Check pruning:</strong> filter column still selective? Clustering depth changed?<br><strong>5. Check spill:</strong> data now exceeds warehouse memory — consider upsizing.<br><strong>6. Check skew:</strong> one micro-partition much larger than others (NULL skew, hot key).<br><strong>7. Test fix:</strong> one change at a time — add filter, recluster, upsize warehouse, rewrite join.",
  tricky: "Linear data growth should produce roughly linear runtime. Quadratic growth suggests a join cardinality problem.", clientApp: "Performance degradation after data growth is a common production support scenario.",
  docLink: ""
},
{
  id: "SQL079", section: "SQL", topic: "Incremental vs Full Load",
  type: "Conceptual", difficulty: "Intermediate", priority: "Must Know", coverage: "Beyond TOC",
  question: "Contrast full load and incremental load. When is each appropriate and how do you switch between them in one pipeline?",
  answer: "<strong>Full load:</strong> TRUNCATE + INSERT all rows from source. Simple, correct, expensive for large tables. Use for small reference/lookup tables, initial historical load, or tables with no reliable change indicator.<br><br><strong>Incremental load:</strong> extract only new/changed rows by watermark, CDC or diff. Scalable, requires idempotent target write (MERGE), harder to design correctly.<br><br><strong>Parameterised pipeline:</strong><pre class=\"code-block\">-- Parameter: load_mode = 'FULL' or 'INCREMENTAL'\nIF :load_mode = 'FULL' THEN\n  TRUNCATE TABLE target;\n  INSERT INTO target SELECT * FROM source;\nELSE\n  MERGE INTO target USING (SELECT * FROM source WHERE updated_at > :watermark) ...;\nEND IF;</pre>",
  tricky: "Switching from full to incremental requires establishing a consistent initial watermark boundary.", clientApp: "All client pipelines need a documented load-mode strategy per table.",
  docLink: ""
},
{
  id: "SQL080", section: "SQL", topic: "Lineage",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "What is data lineage? How do you capture column-level lineage in a SQL-based warehouse?",
  answer: "<strong>Data lineage</strong> tracks where data originates, how it was transformed, and where it flows — from source to BI report, column by column.<br><br><strong>Column-level lineage in SQL:</strong> documented manually in specs; auto-captured by tools like Snowflake Horizon access history, dbt docs (via YAML), IDMC catalog, or a custom registry table that maps source.table.column → target.table.column per ETL job.<pre class=\"code-block\">SELECT object_name, column_name, base_objects_accessed\nFROM snowflake.account_usage.access_history,\nLATERAL FLATTEN(direct_objects_accessed) f\nWHERE f.value:objectDomain = 'Table';</pre>",
  tricky: "Column lineage breaks when SELECT * is used in intermediate views — always name columns explicitly.", clientApp: "Lineage is mandatory for GDPR/DPDP compliance, impact analysis and audit.",
  docLink: "https://docs.snowflake.com/en/user-guide/access-history"

                answer: "<strong>Short Answer:</strong> Retention is inherited down the hierarchy (account -&gt; database -&gt; schema -&gt; table) unless set explicitly. When a <strong>schema or database is dropped</strong>, the retention of the dropped container governs its children: child tables with a longer explicit retention are <strong>not</strong> kept longer once the parent is dropped. <code>UNDROP</code> works for tables, schemas, databases (and some other objects) within retention, requires the original name to be free, and restores the most recent dropped version.<pre class=\"code-block\">SHOW TABLES HISTORY LIKE 'ORDERS' IN SCHEMA sales_db.raw;\nALTER TABLE orders RENAME TO orders_new;\nUNDROP TABLE orders;</pre><strong>Explanation:</strong> To keep long recovery for important tables, do not rely on a long table-level retention under a short-retention schema that might be dropped; set the container retention appropriately too.",

                answer: "<strong>Short Answer:</strong> A stream stores an <strong>offset</strong> (a point in table history), not data. Querying it returns changes since the offset. The offset advances only when the stream is used as a source in DML that <strong>commits</strong>. Inside an explicit transaction, a stream gives <strong>repeatable-read</strong> results: reading it twice returns the same data, even if the table changed meanwhile.<pre class=\"code-block\">CREATE STREAM orders_strm ON TABLE orders SHOW_INITIAL_ROWS = TRUE;\n-- first consumption returns the existing rows as INSERTs, later ones only deltas\n\nBEGIN;\nINSERT INTO audit SELECT * FROM orders_strm;   -- offset moves on COMMIT\nINSERT INTO audit2 SELECT * FROM orders_strm;  -- same rows, repeatable read\nCOMMIT;</pre><strong>Explanation:</strong> Creating a stream enables <strong>change tracking</strong> on the table, which adds hidden metadata (some storage and maintenance cost). Streams on views need change tracking on the underlying tables. To consume the same changes in two pipelines, create two streams or consume both in one transaction.",

                answer: "<strong>Short Answer:</strong><br>- <code>ALLOW_OVERLAPPING_EXECUTION</code> (default FALSE): a new scheduled run is skipped if the previous graph run is still going.<br>- <code>USER_TASK_TIMEOUT_MS</code>: max runtime of a task (default 1 hour).<br>- <code>TASK_AUTO_RETRY_ATTEMPTS</code>: retries a failed graph run from the root.<br>- <code>SUSPEND_TASK_AFTER_NUM_FAILURES</code>: suspends the task after consecutive failures.<br>- <strong>Finalizer task</strong> (<code>FINALIZE = root</code>): runs after all other tasks in the graph complete, success or failure; ideal for cleanup and alerts.<pre class=\"code-block\">CREATE TASK notify_end\n  WAREHOUSE = etl_wh\n  FINALIZE = root_task\nAS CALL ops.send_run_summary();\n\nALTER TASK root_task SET\n  TASK_AUTO_RETRY_ATTEMPTS = 2,\n  SUSPEND_TASK_AFTER_NUM_FAILURES = 3,\n  USER_TASK_TIMEOUT_MS = 1800000;</pre><strong>Explanation:</strong> Defaults and availability of some parameters have changed across releases; verify in the docs for your account.",

                answer: "<strong>Short Answer:</strong><pre class=\"code-block\">from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap   = capacity\n        self.cache = OrderedDict()\n\n    def get(self, key):\n        if key not in self.cache: return -1\n        self.cache.move_to_end(key)    # mark as recently used\n        return self.cache[key]\n\n    def put(self, key, value):\n        if key in self.cache:\n            self.cache.move_to_end(key)\n        self.cache[key] = value\n        if len(self.cache) > self.cap:\n            self.cache.popitem(last=False)  # evict oldest\n\ncache = LRUCache(3)\ncache.put(1, \"a\"); cache.put(2, \"b\"); cache.put(3, \"c\")\nprint(cache.get(1))   # a — moves 1 to end\ncache.put(4, \"d\")     # evicts 2 (oldest unused)\nprint(cache.get(2))   # -1 (evicted)</pre>",

  question: "What is the difference between an Enterprise Data Warehouse (EDW) and a Data Mart? Contrast Inmon top-down vs Kimball bottom-up approaches.",
  answer: "<strong>EDW:</strong> enterprise-wide integrated repository, all subject areas, single source of truth.<br><strong>Data Mart:</strong> subject-specific subset (Sales, Finance, HR) serving one department.<br><br><strong>Inmon (top-down):</strong> build a normalised EDW first → derive dependent marts. Consistent, slower to deliver first value.<br><strong>Kimball (bottom-up):</strong> build dimensional marts using conformed dimensions and a bus matrix; the union of marts IS the warehouse. Faster value delivery.<br><br><strong>Types of marts:</strong> Dependent (fed from EDW), Independent (fed from source — risk of silos), Logical (views on EDW).",

{

  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",

  answer: "<strong>ETL (Extract → Transform → Load):</strong> data is transformed in a separate engine (Informatica, Talend) before landing in the target. Good when: target is weak, sensitive data must be masked before landing, heavy non-SQL processing needed.<br><br><strong>ELT (Extract → Load → Transform):</strong> raw data lands first, transformations run inside the target warehouse using its compute (SQL, dbt, Snowpark). Good when: cloud warehouse is powerful and elastic, raw data retention needed, faster iteration.<br><br><strong>IDMC note:</strong> supports both — classic ETL mappings, and pushdown optimisation converts mapping logic to warehouse SQL (ELT).",

  question: "Compare batch, micro-batch and real-time streaming ingestion for a data warehouse. What trade-offs do you discuss with a client?",
  answer: "<strong>Batch:</strong> scheduled bulk loads (nightly/hourly). Simple, cheap, easy reconciliation. Latency = hours.<br><br><strong>Micro-batch:</strong> small frequent loads (1-15 min) via Snowpipe or dynamic tables. Moderate complexity.<br><br><strong>Real-time streaming:</strong> event-by-event (Kafka, Snowpipe Streaming). Lowest latency (seconds), highest complexity and cost. Requires handling out-of-order events, duplicates and exactly-once semantics.<br><br><strong>Trade-offs to discuss:</strong> latency vs cost vs complexity vs correctness. Ask: 'What latency is truly needed?' Most dashboards are fine at 15-minute freshness.",

  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Explain star schema vs snowflake schema with a retail sales example. Which do you recommend for cloud warehouses and why?",
  answer: "<strong>Star schema:</strong> central fact table joined to denormalised dimension tables. Simple SQL (fewer joins), BI-friendly, some redundancy.<br><br><strong>Snowflake schema:</strong> dimensions further normalised into sub-dimensions (Product → Category → Department). Less redundancy, more joins, harder for analysts.<br><br><strong>Example — Retail:</strong> FACT_SALES joins DIM_DATE, DIM_PRODUCT, DIM_CUSTOMER, DIM_STORE (star). Snowflake would split DIM_PRODUCT into DIM_PRODUCT + DIM_CATEGORY + DIM_BRAND.<br><br><strong>Recommendation:</strong> Star schema for cloud columnar warehouses — storage savings from snowflaking are minimal, but join complexity hurts usability and BI tool performance.",
  tricky: "'Snowflake schema' is a modeling term unrelated to Snowflake the product — clarify in interviews.", clientApp: "Default to star schema; only normalise if hierarchy management justifies extra joins.",
  docLink: ""
},
{
  id: "DW009", section: "Data Warehousing", topic: "Star vs Snowflake Schema",
  type: "Conceptual", difficulty: "Intermediate", priority: "Must Know", coverage: "Exact TOC",
  question: "What are fact and dimension tables? Explain fact table types: transaction, periodic snapshot and accumulating snapshot.",
  answer: "<strong>Dimension table:</strong> descriptive attributes used to slice/filter/group facts (Customer, Product, Date).<br><strong>Fact table:</strong> numeric measures at a specific grain with FK references to dimensions.<br><br><strong>Fact types:</strong><br>- <strong>Transaction:</strong> one row per event (order line). Most common. Additive measures (revenue, qty).<br>- <strong>Periodic snapshot:</strong> one row per entity per period (daily account balance). Semi-additive (can't sum across time).<br>- <strong>Accumulating snapshot:</strong> one row per process instance, updated as milestones occur (order placed → shipped → delivered). Tracks pipeline/SLA.<br>- <strong>Factless fact:</strong> records events with no numeric measure (student attendance, promotion coverage).",
  tricky: "A balance column is semi-additive: SUM across accounts on one date is valid; SUM across dates is not.", clientApp: "Identify fact type first — it determines valid aggregations and the dimension design.",
  docLink: ""

  type: "Conceptual", difficulty: "Intermediate", priority: "Must Know", coverage: "Exact TOC",

{
  id: "DW011", section: "Data Warehousing", topic: "Star vs Snowflake Schema",
  type: "Conceptual", difficulty: "Intermediate", priority: "Must Know", coverage: "Exact TOC",
  question: "Explain surrogate keys. Why not use the natural/business key as the PK in a warehouse dimension?",
  answer: "<strong>Surrogate key:</strong> a system-generated meaningless integer (or hash) that uniquely identifies a dimension row version.<br><br><strong>Reasons to use surrogate keys:</strong><br>1. Support SCD Type 2 — same business key has multiple historical versions, each needing a unique PK.<br>2. Source key changes or gets reused (e.g. customer ID reassigned).<br>3. Integrate multiple sources with colliding natural keys.<br>4. Unknown/not-applicable members (-1, -2) that have no natural key.<br>5. Faster, narrower joins on integers vs VARCHAR business keys.",

{

  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Explain SCD Types 1, 2 and 3 with an example: a customer moves from Pune to Mumbai.",
  answer: "<strong>Type 1 — Overwrite:</strong> UPDATE city = 'Mumbai'. History lost. Use for corrections or non-historical attributes.<br><br><strong>Type 2 — Add Row:</strong> Close current row (end_date=today, is_current=FALSE); INSERT new row (city='Mumbai', start_date=today, is_current=TRUE, new surrogate key). Full history preserved. Facts reference the correct historical version.<br><br><strong>Type 3 — Add Column:</strong> Add column <code>prev_city</code>; update current_city='Mumbai', prev_city='Pune'. Only one level of history.<br><br><strong>Other types:</strong> Type 4 (history table), Type 6 (hybrid 1+2+3).",
  tricky: "Facts must keep pointing to the dimension SURROGATE KEY valid at the event time — not the latest version.", clientApp: "Pick SCD type per attribute, not per table. A customer may have Type 1 (email) and Type 2 (address) columns.",

{
  id: "DW013", section: "Data Warehousing", topic: "SCD",
  type: "Coding", difficulty: "Advanced", priority: "Must Know", coverage: "Exact TOC",
  question: "Write SQL to implement SCD Type 2: close changed rows and insert new versions. Table: dim_customer(sk, customer_id, city, eff_from, eff_to, is_current).",
  answer: "<pre class=\"code-block\">-- Step 1: Close changed current rows\nUPDATE dim_customer d\nSET eff_to = CURRENT_TIMESTAMP(), is_current = FALSE\nFROM stg_customer s\nWHERE d.customer_id = s.customer_id\n  AND d.is_current = TRUE\n  AND NOT EQUAL_NULL(d.city, s.city);   -- EQUAL_NULL treats NULL=NULL as TRUE\n\n-- Step 2: Insert new versions (new customers + changed)\nINSERT INTO dim_customer\n  (customer_id, city, eff_from, eff_to, is_current)\nSELECT s.customer_id, s.city,\n  CURRENT_TIMESTAMP(), '9999-12-31'::TIMESTAMP, TRUE\nFROM stg_customer s\nLEFT JOIN dim_customer d\n  ON d.customer_id = s.customer_id AND d.is_current = TRUE\nWHERE d.customer_id IS NULL;  -- new, or just closed in step 1</pre>",
  tricky: "Using <> for change detection misses NULL→value transitions. Always use EQUAL_NULL or IS DISTINCT FROM.", clientApp: "Wrap both steps in one transaction so there is no window where a key has no current row.",

  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "Explain normalisation vs denormalisation. Where is each used in a warehouse architecture?",
  answer: "<strong>Normalisation:</strong> removes redundancy by splitting into related tables (1NF → 2NF → 3NF). Protects write integrity, eliminates update anomalies. Used in OLTP and often in the integration/core layer (Data Vault hubs/satellites).<br><br><strong>Denormalisation:</strong> intentionally duplicates attributes to reduce joins and speed reads. Used in star-schema marts for BI — BI tools prefer fewer joins.<br><br><strong>Trade-off:</strong> normalisation → write efficiency, smaller storage, governed updates. Denormalisation → read speed, simpler BI SQL, data redundancy requiring pipeline maintenance.",

{
  id: "DW015", section: "Data Warehousing", topic: "ETL Processes",
  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Describe data extraction approaches: full extract, incremental (watermark), CDC and snapshot diff. Which captures hard deletes?",
  answer: "<strong>Full extract:</strong> read everything each run. Simple; heavy. Use for small reference tables or missing change tracking.<br><br><strong>Incremental (watermark):</strong> <code>WHERE updated_at > :last_run</code>. Needs reliable timestamp. <strong>Misses hard deletes.</strong><br><br><strong>CDC (Change Data Capture):</strong> reads DB logs or triggers. Captures INSERT, UPDATE and DELETE with order. Low source impact. Requires DB support/permissions.<br><br><strong>Snapshot diff:</strong> compare today vs yesterday full copy to derive changes. Captures deletes. Expensive.<br><br><strong>Only CDC and snapshot diff capture hard deletes.</strong>",
  tricky: "Timestamp-based incremental also misses rows updated without changing the timestamp and rows updated during the extraction window edge.", clientApp: "Ask the client: 'Do you need deletes captured? What change-tracking does the source support?'",
  docLink: ""
},
{
  id: "DW016", section: "Data Warehousing", topic: "ETL Processes",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What data transformation techniques are applied in ETL/ELT pipelines? Map them to IDMC transformations.",
  answer: "<strong>Transformations and IDMC equivalents:</strong><br>- Cleansing (trim, case, null handling) → Expression<br>- Type casting → Expression / Router<br>- Standardisation (date formats, codes) → Expression<br>- Deduplication (ROW_NUMBER) → Sorter + Expression or Aggregator<br>- Lookup/enrichment (join to reference) → Lookup<br>- Joining streams → Joiner<br>- Aggregation (SUM, COUNT per group) → Aggregator<br>- Routing by condition → Router<br>- Filtering rows → Filter<br>- Derivation (calculated columns) → Expression<br>- Pivot/Unpivot → Expression or Normalizer<br>- Surrogate key assignment → Sequence Generator",
  tricky: "Keep transformation rules in one documented layer, not scattered across ETL, views, and application code.", clientApp: "Design spec should map each business rule to the responsible transformation step.",
  docLink: ""
},
{
  id: "DW017", section: "Data Warehousing", topic: "ETL Processes",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "Compare loading strategies: truncate-and-load, append, MERGE/upsert and partition replace. When is each idempotent?",
  answer: "<strong>Truncate-and-load:</strong> TRUNCATE then INSERT all. Idempotent. Best for small reference tables. Target empty during load — use swap table pattern or single transaction.<br><br><strong>Append:</strong> INSERT new rows. NOT idempotent by default — duplicates on rerun unless deduplicated.<br><br><strong>MERGE/upsert:</strong> INSERT if new, UPDATE if exists. Idempotent on the business key. Best for mutable data.<br><br><strong>Partition replace:</strong> delete one date-partition then reload it. Idempotent per partition. Best for large fact tables with day-level reprocessing.<br><br><strong>Rule:</strong> prefer idempotent patterns — a pipeline that can be safely rerun is production-grade.",
  tricky: "Plain append is the most common cause of duplicates after job restarts.", clientApp: "Use MERGE for dimensions, partition replace for large daily facts.",
  docLink: ""
},
{
  id: "DW018", section: "Data Warehousing", topic: "ETL Tools",
  type: "Conceptual", difficulty: "Beginner", priority: "High Priority", coverage: "Exact TOC",
  question: "Compare ETL/ELT tools: Informatica IDMC, Qlik (Compose), Talend, Fivetran and Matillion. What is each best at?",
  answer: "<strong>Informatica IDMC (CDI/CAI):</strong> enterprise-grade, multi-cloud, visual mapping designer, governance built-in, strong on complex transformations and orchestration. Best for large regulated enterprises.<br><br><strong>Qlik Compose:</strong> automated DWH generation from logical model; strong on automation.<br><br><strong>Talend:</strong> open-source Java-based; broad connectors; on-prem and cloud.<br><br><strong>Fivetran:</strong> SaaS ELT connector; 300+ pre-built connectors; lands raw data into warehouse; zero-maintenance extraction. Best for standard SaaS sources fast.<br><br><strong>Matillion:</strong> cloud-native ELT on Snowflake/Redshift/BigQuery; pushdown SQL; low-code.",
  tricky: "Fivetran handles extraction; it does not do complex transformation — combine with dbt for the T in ELT.", clientApp: "Know each tool at pitch level; this question comes up in every client tool-selection conversation.",
  docLink: ""
},
{
  id: "DW019", section: "Data Warehousing", topic: "Data Profiling",
  type: "Conceptual", difficulty: "Beginner", priority: "High Priority", coverage: "Exact TOC",
  question: "What is data profiling and which metrics do you capture before building a pipeline?",
  answer: "<strong>Data profiling:</strong> analysing source data to understand its structure, content and quality before designing the pipeline.<br><br><strong>Metrics to capture:</strong><pre class=\"code-block\">SELECT\n  COUNT(*)                      AS total_rows,\n  COUNT(customer_id)            AS non_null_id,\n  COUNT(DISTINCT customer_id)   AS distinct_ids,\n  SUM(CASE WHEN email IS NULL OR email='' THEN 1 END) AS null_emails,\n  MIN(created_at), MAX(created_at),\n  MIN(LEN(name)), MAX(LEN(name)),\n  COUNT(DISTINCT status)        AS status_cardinality\nFROM source_customers;</pre>Also: duplicate key analysis, FK resolution rate, format pattern frequency, top-N value distribution.",
  tricky: "COUNT(col) ignores NULLs; COUNT(*) does not. Always use both to understand null density.", clientApp: "Profiling findings drive cleansing rules, SCD type decisions and DQ thresholds.",
  docLink: ""
},
{
  id: "DW020", section: "Data Warehousing", topic: "Data Profiling",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "How do you handle duplicate records and missing data in a warehouse load?",
  answer: "<strong>Duplicates:</strong><br>1. Define the business key (what makes a row unique).<br>2. Define survivorship: keep latest by updated_at, most complete, or trusted source.<br>3. Dedup with window function:<pre class=\"code-block\">SELECT * FROM stg_customers\nQUALIFY ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY updated_at DESC) = 1;</pre><strong>Missing data:</strong><br>- Classify: is NULL meaningful (optional field) or an error (required field)?<br>- Required missing → reject row, quarantine, alert.<br>- Optional missing → COALESCE with default or use 'Unknown' dimension member (-1).<br>- Never silently fill with assumptions; document the rule.",
  tricky: "Do not use SELECT DISTINCT * to dedup if rows differ in any column (e.g. updated_at) — it won't work.", clientApp: "Document survivorship rules in the data contract before build.",
  docLink: ""
},
{
  id: "DW021", section: "Data Warehousing", topic: "Data Quality",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "Name the 7 dimensions of data quality with a check for each.",
  answer: "<strong>1. Completeness:</strong> mandatory fields not null — COUNT(*) WHERE col IS NULL.<br><strong>2. Uniqueness:</strong> no duplicate keys — GROUP BY key HAVING COUNT(*)>1.<br><strong>3. Validity:</strong> values match type/format/domain — REGEXP_LIKE, BETWEEN checks.<br><strong>4. Accuracy:</strong> matches reality/trusted source — sample comparison vs authoritative system.<br><strong>5. Consistency:</strong> same fact agrees across systems — cross-system reconciliation.<br><strong>6. Timeliness:</strong> data arrives within SLA — MAX(load_ts) vs CURRENT_TIMESTAMP check.<br><strong>7. Referential integrity:</strong> FK keys resolve — NOT EXISTS check between fact and dimension.",
  tricky: "Accuracy is the hardest to automate — it usually requires a reference dataset or manual sampling.", clientApp: "Publish a DQ scorecard per load as a client-facing operational deliverable.",
  docLink: ""
},
{
  id: "DW022", section: "Data Warehousing", topic: "Error Handling",
  type: "Architecture", difficulty: "Advanced", priority: "Must Know", coverage: "Exact TOC",
  question: "Design error handling and logging for an ETL pipeline. What do you capture, how do you classify errors, and what thresholds do you set?",
  answer: "<strong>Run-level audit table:</strong> run_id, job, start/end, status (SUCCESS/FAILED/PARTIAL), rows_extracted/loaded/rejected, source file, error_message.<br><br><strong>Row-level reject table:</strong> run_id, error_code, error_message, raw record value, source file/line. Keep bad rows — never discard.<br><br><strong>Error classes:</strong><br>- Technical (connectivity, timeout): RETRY with backoff, then FAIL.<br>- Data (type mismatch, constraint): reject row, CONTINUE within threshold.<br>- Fatal (schema broken, permission): ABORT immediately.<br><br><strong>Thresholds:</strong> FAIL the job if rejects exceed X% (e.g. >5% = abort; client-defined). Alert ops team.<br><br><strong>Replay path:</strong> fix the bad rows, reprocess rejects only — not the whole file.",
  tricky: "Swallowing all errors to 'keep the pipeline green' creates silent data loss — the worst production outcome.", clientApp: "Every production pipeline must have an auditable reject log and an alerting threshold.",
  docLink: ""
},
{
  id: "DW023", section: "Data Warehousing", topic: "Reconciliation",
  type: "Coding", difficulty: "Intermediate", priority: "Must Know", coverage: "Beyond TOC",
  question: "Write a source-to-target reconciliation report query. What checks go beyond simple row counts?",
  answer: "<pre class=\"code-block\">-- Layer comparison\nSELECT 'source'  AS layer, COUNT(*) rows, SUM(amount) total,\n       MIN(order_date) min_dt, MAX(order_date) max_dt FROM source_orders\nUNION ALL\nSELECT 'target', COUNT(*), SUM(amount), MIN(order_date), MAX(order_date)\nFROM target_orders;\n\n-- Orphaned keys\nSELECT t.order_id, 'in_target_not_source' AS issue\nFROM target_orders t LEFT JOIN source_orders s USING(order_id) WHERE s.order_id IS NULL\nUNION ALL\nSELECT s.order_id, 'in_source_not_target'\nFROM source_orders s LEFT JOIN target_orders t USING(order_id) WHERE t.order_id IS NULL;\n\n-- Amount discrepancy by date\nSELECT order_date, s_amt - t_amt AS delta FROM (\n  SELECT order_date, SUM(amount) s_amt FROM source_orders GROUP BY 1) s\nJOIN (SELECT order_date, SUM(amount) t_amt FROM target_orders GROUP BY 1) t USING(order_date)\nWHERE ABS(s_amt - t_amt) > 0.01;</pre>",
  tricky: "Equal row counts can hide offsetting errors — a missing row and a duplicate cancel each other out. Always compare control totals.", clientApp: "Reconciliation sign-off is required before UAT in most client projects.",
  docLink: ""
},
{
  id: "DW024", section: "Data Warehousing", topic: "Compute Management",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What is compute management in a cloud warehouse? What levers control cost vs performance?",
  answer: "<strong>Compute management:</strong> controlling when and how much compute runs to balance cost and performance.<br><br><strong>Levers:</strong><br>- Right-size warehouses for the workload (XS for ad-hoc, M/L for heavy ELT).<br>- Auto-suspend / auto-resume to stop billing when idle.<br>- Separate warehouses per workload (ELT, BI, ad-hoc) — workload isolation.<br>- Multi-cluster warehouses for concurrency peaks (BI).<br>- Resource monitors / budgets to cap spend.<br>- Query timeouts to kill runaway queries.<br>- Schedule heavy jobs off-peak.<br><br><strong>Scale up</strong> (larger size): speeds a single heavy query.<br><strong>Scale out</strong> (more clusters): handles many concurrent queries.",
  tricky: "A forgotten warehouse without auto-suspend is the classic surprise credit bill.", clientApp: "Compute management is always discussed in cost governance workshops.",
  docLink: ""
},
{
  id: "DW025", section: "Data Warehousing", topic: "Compute Management",
  type: "Performance", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "How do you benchmark warehouse performance for a new schema or warehouse size? What must you control?",
  answer: "<strong>Process:</strong><br>1. Define representative workload: 10-20 real queries (dashboards, ELT, ad-hoc) at realistic data volume.<br>2. Disable result cache: <code>ALTER SESSION SET USE_CACHED_RESULT = FALSE;</code><br>3. Run cold (suspend/resume warehouse to drop local cache).<br>4. Run 3+ times and take median runtime.<br>5. Change ONE variable at a time (warehouse size, clustering, schema change).<br>6. Capture: elapsed time, bytes scanned, partitions scanned/total, bytes spilled, query credits.<br>7. Compare cost AND latency together — 2× faster at 4× cost is not a win.",
  tricky: "Never benchmark on tiny data or warm cache — it proves nothing about production performance.", clientApp: "Benchmark results justify sizing decisions to the client with evidence.",
  docLink: ""
},
{
  id: "DW026", section: "Data Warehousing", topic: "CDC & Incremental",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Compare CDC methods: log-based, trigger-based, timestamp/version column and snapshot diff. Which captures deletes?",
  answer: "<strong>Log-based:</strong> reads DB transaction logs. Low source impact. Captures INSERT/UPDATE/DELETE with ordering. Needs DB support/permissions. Best choice where available.<br><br><strong>Trigger-based:</strong> triggers write changes to a change table. Captures deletes. Adds source-write overhead.<br><br><strong>Timestamp/version column:</strong> <code>WHERE updated_at > :watermark</code>. Simple. <strong>Misses hard deletes.</strong> Missed late commits. Low overhead.<br><br><strong>Snapshot diff:</strong> compare full extract to previous snapshot. Captures deletes. Expensive storage and compute.<br><br><strong>Deletes captured by:</strong> log-based, trigger-based, snapshot diff. NOT by timestamp alone.",
  tricky: "Add a soft-delete flag (is_deleted=1) to the source if log CDC is not available — lets timestamp method detect deletes too.", clientApp: "IDMC Mass Ingestion uses log-based CDC; Snowflake streams are target-side CDC for already-landed data.",
  docLink: ""
},
{
  id: "DW027", section: "Data Warehousing", topic: "CDC & Incremental",
  type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Your incremental extract uses WHERE updated_at > last_run_time. Name 3 ways it can lose data and how to harden each.",
  answer: "<strong>1. Late-committed transactions:</strong> a row committed with an updated_at just before the watermark, after the watermark was captured. <em>Fix:</em> use source's actual max timestamp with a lookback overlap (watermark - 15 min) and dedup/MERGE on key.<br><br><strong>2. Clock skew:</strong> ETL server clock differs from source DB clock. <em>Fix:</em> always use the source system's timestamp (<code>SELECT MAX(updated_at) FROM source</code>), not the ETL server clock.<br><br><strong>3. Hard deletes:</strong> rows removed from source without timestamp trace. <em>Fix:</em> use soft-delete flags, supplement with snapshot diff, or use log-based CDC.<br><br>Also: rows updated without changing updated_at (trigger bypassed, bulk load). <em>Fix:</em> periodic full reconciliation.",
  tricky: "Overlap + idempotent MERGE is the practical combination that handles cases 1 and 2 together.", clientApp: "Silent data loss from incremental load edge cases is a leading cause of analytics discrepancies.",
  docLink: ""
},
{
  id: "DW028", section: "Data Warehousing", topic: "Late-Arriving Data",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "What are late-arriving facts and late-arriving dimensions? How do you handle each?",
  answer: "<strong>Late-arriving fact:</strong> the event arrives after its reporting period was processed.<br>Handle: INSERT the fact using the dimension version valid at the <strong>event date</strong> (not load date). Refresh affected snapshot aggregates or mark the period as restated.<br><br><strong>Late-arriving dimension (early-arriving fact):</strong> a fact references a dimension member not yet loaded.<br>Handle: INSERT an <strong>inferred/placeholder</strong> dimension row with the natural key and 'Unknown' descriptive attributes. When the real dimension row arrives, update inferred attributes (Type 1 fill) and continue SCD2 normally.",
  tricky: "Never map all unresolved facts to a permanent 'Unknown' member — it makes reporting permanently incorrect.", clientApp: "Late-arriving data is common with source system delays; design the handling strategy upfront.",
  docLink: ""
},
{
  id: "DW029", section: "Data Warehousing", topic: "Schema Evolution",
  type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A source system adds 3 new columns and widens a VARCHAR. How do you design pipelines to tolerate schema changes?",
  answer: "<strong>Detection:</strong> compare source metadata to target schema at extract time; alert on differences.<br><br><strong>Additive changes (new nullable columns):</strong> auto-add nullable columns in staging; promote to curated only after review. Use Snowflake schema evolution: <code>COPY INTO ... MATCH_BY_COLUMN_NAME ENABLE_SCHEMA_EVOLUTION</code>.<br><br><strong>Type widening (VARCHAR 50→200):</strong> usually backward compatible; ALTER COLUMN in target.<br><br><strong>Breaking changes (rename, type incompatibility, drop):</strong> fail the pipeline intentionally; require change control review; version views to protect consumers.<br><br><strong>Prevention:</strong> avoid SELECT * in downstream objects; define explicit schema contracts.",
  tricky: "Silent auto-evolution can push unreviewed PII columns into marts or break downstream joins.", clientApp: "Schema drift failures are a recurring IDMC/ETL incident — design detection and alerting first.",
  docLink: "https://docs.snowflake.com/en/user-guide/data-load-schema-evolution"
},
{
  id: "DW030", section: "Data Warehousing", topic: "Idempotency",
  type: "Conceptual", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "What does an idempotent and restartable pipeline mean? How do you implement it?",
  answer: "<strong>Idempotent:</strong> running the same load once or many times produces the same final target state.<br><strong>Restartable:</strong> a failed run can resume without duplicates or gaps.<br><br><strong>Implementation checklist:</strong><br>1. Deterministic business key + MERGE/upsert (not plain INSERT).<br>2. Control table with run status and watermark updated ONLY after successful commit.<br>3. Staged batches with atomic file move (incoming → processing → archive/failed).<br>4. Load metadata check (skip already-loaded files by name + checksum).<br>5. No non-deterministic logic where reproducibility matters (use batch time, not CURRENT_TIMESTAMP in keys).<br>6. Partition-level delete+insert scoped to the exact batch, inside one transaction.",
  tricky: "Idempotent does not mean 'never fails' — it means 'safe to retry'. Design for failure from the start.", clientApp: "This is the foundational requirement for every production ETL pipeline.",
  docLink: ""
},
{
  id: "DW031", section: "Data Warehousing", topic: "Dimensional Modeling",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "Explain conformed, junk, degenerate and role-playing dimensions with examples.",
  answer: "<strong>Conformed dimension:</strong> shared, identical dimension across facts/marts (Date, Customer) — enables drill-across queries. Kimball's cornerstone for EDW consistency.<br><br><strong>Junk dimension:</strong> combines low-cardinality flags/indicators into one table to avoid cluttering the fact with many small FKs (e.g. is_online_order, is_gift, is_return — all combined).<br><br><strong>Degenerate dimension:</strong> identifier stored IN the fact table with no separate dimension table (Invoice Number, Order Number). Useful for grouping line items back to the original transaction.<br><br><strong>Role-playing dimension:</strong> one physical table used multiple times with aliases (Date as order_date, ship_date, delivery_date).",
  tricky: "Date is the most common role-playing dimension — create views or aliases, not physical copies.", clientApp: "Role-playing date dimension is asked in almost every dimensional modeling interview.",
  docLink: ""
},
{
  id: "DW032", section: "Data Warehousing", topic: "Dimensional Modeling",
  type: "Architecture", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do you design a date dimension? What columns should it include and how do you handle unknown dates?",
  answer: "<strong>Design:</strong> pre-built, populated for a wide date range. Integer smart key (20250131) for fast joins.<br><br><strong>Columns:</strong> date_key(INT), full_date, day_of_week, day_name, day_of_month, week_of_year, iso_week, month_num, month_name, quarter, year, fiscal_year, fiscal_quarter, is_weekend(BOOL), is_holiday(BOOL), holiday_name.<br><br><strong>Unknown/not-applicable rows:</strong><pre class=\"code-block\">INSERT INTO dim_date(date_key, full_date, ...)\nVALUES (-1, NULL, 'Unknown', ...),\n       (-2, NULL, 'Not Applicable', ...);</pre>Facts use FK -1 or -2 instead of NULL, so inner joins don't drop facts.",
  tricky: "Nullable FKs in facts cause inner joins to silently lose rows — use unknown members instead.", clientApp: "Date dimension is the first table built on any DWH project.",
  docLink: ""
},
{
  id: "DW033", section: "Data Warehousing", topic: "Pipeline Design",
  type: "Architecture", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Design a reporting pipeline from source to BI dashboard. Which layers, controls and refresh strategy do you propose?",
  answer: "<strong>Architecture:</strong><br>1. <strong>Ingest (RAW):</strong> CDC/file/API → staging table with load metadata (batch_id, source_file, load_ts). No transformation.<br>2. <strong>Cleanse/Conform (CORE):</strong> apply business rules, assign surrogate keys, implement SCD. DQ gate here.<br>3. <strong>Mart (GOLD):</strong> star schema facts/dimensions + aggregates. Row access policies per role.<br>4. <strong>Semantic layer:</strong> views/metrics with RBAC. BI connects to a dedicated read-only warehouse.<br><br><strong>Controls:</strong> reconciliation between each layer, alerting on anomalies, row-count thresholds, run audit table.<br><br><strong>Refresh:</strong> incremental on schedule or via dynamic tables. SLA-aligned freshness (e.g. T+1h by 6am).",
  tricky: "Dashboards should always read from marts, never directly from RAW — raw data is ungoverned.", clientApp: "Reasoning from SLA backwards is how architects present designs to clients.",
  docLink: ""
},
{
  id: "DW034", section: "Data Warehousing", topic: "Lineage & Monitoring",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "What is data lineage and how do you implement operational pipeline monitoring?",
  answer: "<strong>Data lineage:</strong> tracing where each column's data came from, through what transformations, to where it is used. Supports impact analysis ('if source X changes, what breaks?'), audit, GDPR/DPDP compliance.<br><br><strong>Implementation:</strong> Snowflake Horizon ACCESS_HISTORY (column-level); dbt docs (YAML + manifest); IDMC catalog; custom lineage registry table (source.table.column → target.table.column per ETL job).<br><br><strong>Operational monitoring:</strong> pipeline status vs SLA, row-count anomaly detection, freshness checks (MAX load_ts), DQ failure rate, credit/cost per job, alerting with named owner.",
  tricky: "Column lineage breaks when SELECT * is used in intermediate views — always name columns explicitly.", clientApp: "Regulators and auditors require documented lineage for PII and financial data.",
  docLink: "https://docs.snowflake.com/en/user-guide/access-history"
},
{
  id: "DW035", section: "Data Warehousing", topic: "Batch Recovery",
  type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "A nightly batch loads 10 tables and fails at table 6. How do you recover without duplicates or missing data?",
  answer: "<strong>Recovery steps:</strong><br>1. Check the control/audit table for per-table status — identify tables 1-5 as SUCCESS, table 6 as FAILED.<br>2. Do NOT rerun tables 1-5 — they succeeded and loads are idempotent for those tables anyway.<br>3. Fix the root cause (bad data, connectivity, schema drift).<br>4. Rerun starting from table 6 using the <strong>SAME batch_id / watermark</strong> as the failed run — not a new one.<br>5. MERGE-based load ensures table 6 rerun doesn't duplicate already-processed rows.<br>6. Validate reconciliation counts for all 10 tables before publishing downstream.<br><br><strong>Key requirement:</strong> each table's load must be idempotent (MERGE or partition replace).",
  tricky: "If the watermark advanced before the failure, the rerun skips the window that failed — advance watermarks only AFTER commit.", clientApp: "Restart semantics are one of the most asked follow-up questions in ETL interviews.",
  docLink: ""
},
{
  id: "DW036", section: "Data Warehousing", topic: "Historical Corrections",
  type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A source system corrects last month's sales data. How do you apply the correction while preserving audit history?",
  answer: "<strong>Options:</strong><br><strong>1. Reverse-and-rebook:</strong> insert an offsetting fact row (negative amounts) + insert the corrected row. Every version auditable. Best for finance where reports are versioned.<br><br><strong>2. Versioned rows (bi-temporal):</strong> fact has valid_from/valid_to (business date) AND row_from/row_to (system date). Query 'as reported on date X' vs 'as corrected'.<br><br><strong>3. Overwrite + audit table:</strong> copy old values to audit table, UPDATE target. Simpler but loses ability to reproduce prior published numbers.<br><br><strong>Ask the client:</strong> do you need 'as-was' (point-in-time reproducibility) or only 'as-is' (current correct view)?",
  tricky: "Snowflake Time Travel is NOT a long-term audit mechanism — use it for recovery, not for regulatory audit history.", clientApp: "Finance clients almost always need reproducible reports 'as published on date X'.",
  docLink: ""
},
{
  id: "DW037", section: "Data Warehousing", topic: "Medallion Architecture",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "Explain the Medallion (Bronze/Silver/Gold) architecture and map it to traditional DWH layers.",
  answer: "<strong>Bronze (Raw):</strong> data as-received, append-only, full history. = Traditional Staging layer.<br><strong>Silver (Cleansed):</strong> deduplicated, type-cast, conformed, with SCD/CDC applied. = Integration/Core layer.<br><strong>Gold (Curated):</strong> business-ready marts, aggregates, semantic layer. = Access/Mart layer.<br><br><strong>Benefits:</strong> reprocess from raw at any time; clear quality gates; separate ownership and access control; independent refresh schedules per layer.<br><br><strong>Modern tooling:</strong> Snowflake (databases per layer + dynamic tables), Databricks (Delta Lake), dbt (models organised by layer in the project).",
  tricky: "More layers add latency and storage cost — don't add a layer without a clear purpose.", clientApp: "Medallion is common vocabulary with Databricks and Snowflake clients — use it fluently.",
  docLink: ""
},
{
  id: "DW038", section: "Data Warehousing", topic: "Many-to-Many",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do you model a many-to-many relationship in dimensional modeling? Give an example with a bridge table.",
  answer: "<strong>Example:</strong> A customer can have multiple accounts; an account can be co-owned by multiple customers.<br><br><strong>Bridge table pattern:</strong><pre class=\"code-block\">FACT_TRANSACTIONS → FK → BRIDGE_CUSTOMER_ACCOUNT (customer_sk, account_sk, allocation_factor)\nBRIDGE → FK → DIM_CUSTOMER\nBRIDGE → FK → DIM_ACCOUNT</pre><strong>Allocation factor:</strong> each bridge row has a weight (e.g. 0.5 for 50% ownership) so measures summed through the bridge still total 100% — avoiding double-counting.<br><br><strong>Without allocation:</strong> SUM(balance) through the bridge multiplies balances by the number of co-owners.",
  tricky: "Many interviewers don't expect the allocation factor — mentioning it shows dimensional modeling depth.", clientApp: "Product-category and patient-diagnosis are common M:M cases in client projects.",
  docLink: ""
},
{
  id: "DW039", section: "Data Warehousing", topic: "Data Vault",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "What is Data Vault 2.0? Define hubs, links and satellites. When would you choose it over Kimball?",
  answer: "<strong>Data Vault 2.0 components:</strong><br>- <strong>Hubs:</strong> unique business keys (customer_bk, product_bk) with hash key + load_ts + record_source.<br>- <strong>Links:</strong> relationships between hubs (customer-order link). Also insert-only.<br>- <strong>Satellites:</strong> descriptive attributes of hubs or links with full history (every change stored).<br><br><strong>Properties:</strong> insert-only (no updates), auditable, agile for many evolving sources.<br><br><strong>Choose Data Vault when:</strong> large enterprise, many heterogeneous sources, strict auditability, frequent source changes, long-term integration platform. Business-facing reports are still built as Kimball marts on top (Raw Vault → Business Vault → Marts).",
  tricky: "Data Vault adds join complexity and tooling overhead — overkill for single-source or small DWH projects.", clientApp: "Know it at pitch level; know when NOT to use it.",
  docLink: ""
},
{
  id: "DW040", section: "Data Warehousing", topic: "Aggregations",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "Additive vs semi-additive vs non-additive measures: define each and give examples. How do you handle non-additive measures in SQL?",
  answer: "<strong>Additive:</strong> can be summed across ALL dimensions. Example: sales amount, units sold. SUM(amount) across products, dates and regions is always valid.<br><br><strong>Semi-additive:</strong> can sum across some dimensions but NOT across time. Example: account balance, inventory quantity. SUM(balance) across accounts on one date is valid; SUM across dates is not.<br><br><strong>Non-additive:</strong> cannot be summed at all. Example: ratios, percentages, rates. Store the numerator and denominator separately; compute the ratio at query time:<pre class=\"code-block\">SELECT region, SUM(revenue) / NULLIF(SUM(cost), 0) AS margin_ratio\nFROM fact_sales GROUP BY region;</pre>",
  tricky: "Interviewers check that you know not to SUM a balance column across dates.", clientApp: "Correctly classifying measures prevents the most common analytical errors in reports.",
  docLink: ""
},
{
  id: "DW041", section: "Data Warehousing", topic: "ETL Tools",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "In what scenario would you choose Fivetran over Informatica IDMC for data ingestion?",
  answer: "<strong>Choose Fivetran when:</strong><br>- Source is a standard SaaS application (Salesforce, HubSpot, Google Analytics, Stripe) with a pre-built Fivetran connector.<br>- Team wants zero-maintenance extraction — Fivetran handles schema changes, API versioning and incremental sync automatically.<br>- Speed to first data matters more than custom transformation logic.<br>- Budget favors SaaS pricing over enterprise licensing.<br><br><strong>Choose IDMC when:</strong><br>- Sources are on-prem databases, mainframes, or custom APIs needing Secure Agent.<br>- Complex multi-step transformations, SCD2, data quality rules or CAI orchestration are required.<br>- Enterprise governance, lineage and IDMC catalog matter.<br>- Client already has an Informatica contract.",
  tricky: "Fivetran extracts; it does not transform. Pair with dbt for the T step. IDMC does both extraction and complex transformation.", clientApp: "This is a live client decision — know the trade-offs fluently.",
  docLink: ""
},
{
  id: "DW042", section: "Data Warehousing", topic: "Reporting Pipelines",
  type: "Architecture", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "What visualisation and BI tools integrate with cloud warehouses and what best practices apply when connecting them?",
  answer: "<strong>Common tools:</strong> Tableau, Power BI, Looker, Qlik Sense, Mode, Sigma, Metabase.<br><br><strong>Best practices connecting BI to Snowflake:</strong><br>1. Dedicated <strong>read-only BI warehouse</strong> — isolate BI queries from ELT.<br>2. Role with minimum SELECT + USAGE grants on mart only.<br>3. Connect to <strong>views/semantic layer</strong>, not raw tables.<br>4. Optimise for repeated queries — dashboards reuse result cache.<br>5. Set <strong>statement timeout</strong> to prevent runaway ad-hoc queries.<br>6. Monitor query volume and cost per user/dashboard.<br>7. Prefer <strong>live connection</strong> over extract where freshness matters; use extract for offline/scheduled reports.",
  tricky: "BI tools generating chatty queries (many small SELECTs) on a Large warehouse consume significant credits even if each query is fast.", clientApp: "BI layer design is always part of a Snowflake architecture engagement.",
  docLink: ""
},
{
  id: "DW043", section: "Data Warehousing", topic: "Performance Benchmarking",
  type: "Architecture", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "What is query and visualisation lab work in a DWH project? Describe how to run a query lab.",
  answer: "<strong>Query lab:</strong> a structured exercise to test and optimise a set of representative analytical queries against the warehouse design.<br><br><strong>Steps:</strong><br>1. Collect 10-20 real business queries from the client (most common dashboard queries + expected heavy queries).<br>2. Load representative data volume (or full production data).<br>3. Baseline each query: elapsed time, bytes scanned, partitions scanned, credits used.<br>4. Identify slow queries (>X seconds) and expensive queries (high bytes scanned).<br>5. Apply targeted fixes one-at-a-time: add clustering, rewrite predicate, restructure join, resize warehouse.<br>6. Re-measure and document improvement.<br>7. Document final recommended config and schema adjustments.<br><br><strong>Visualisation lab:</strong> validate dashboard renders correctly, freshness meets SLA, BI tool concurrency is handled.",
  tricky: "Always test at final production data volume — results on 10% data are not representative.", clientApp: "Query labs are a client-facing deliverable in performance optimization engagements.",
  docLink: ""
},
{
  id: "DW044", section: "Data Warehousing", topic: "Cross-Technology",
  type: "Architecture", difficulty: "Advanced", priority: "High Priority", coverage: "Cross-Technology",
  question: "A client has IDMC for ETL and Snowflake as the target warehouse. How do you decide between running transformations in the Secure Agent vs pushing them down to Snowflake?",
  answer: "<strong>Prefer pushdown (ELT in Snowflake) when:</strong><br>- Large data volume — transformation runs on elastic Snowflake compute, no data moves through agent.<br>- Transformation is set-based SQL that IDMC can translate (filter, join, aggregate, expression).<br>- Network bandwidth between agent and Snowflake is a bottleneck.<br><br><strong>Keep in Secure Agent when:</strong><br>- Transformation uses unsupported functions or complex procedural logic.<br>- Source data is outside Snowflake (agent bridges on-prem to cloud).<br>- Per-row Python/Java processing is required that Snowflake can't do.<br>- Sensitive data must be masked BEFORE landing in Snowflake.<br><br><strong>Validation:</strong> always compare pushdown vs non-pushdown results on a sample — SQL semantics differ for NULLs, casts and date functions.",
  tricky: "Pushdown generates Snowflake SQL from the mapping — test edge cases like NULL handling and type conversion carefully.", clientApp: "This decision appears in every combined IDMC + Snowflake architecture design.",
  docLink: ""
},
{
  id: "DW045", section: "Data Warehousing", topic: "Data Quality",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What is a data quality gate and how do you implement one between DWH layers?",
  answer: "<strong>DQ gate:</strong> a checkpoint that validates data quality after each layer load, preventing bad data from propagating to downstream layers.<br><br><strong>Implementation:</strong><pre class=\"code-block\">-- Run DQ checks after loading CORE layer\nINSERT INTO dq_results (layer, check_name, failures, run_id, run_ts)\nSELECT 'CORE', 'null_order_id', COUNT(*), :run_id, CURRENT_TIMESTAMP()\nFROM core_orders WHERE order_id IS NULL\nUNION ALL\nSELECT 'CORE', 'future_order_date', COUNT(*), :run_id, CURRENT_TIMESTAMP()\nFROM core_orders WHERE order_date > CURRENT_DATE();\n\n-- Gate: fail pipeline if critical checks exceed threshold\nSELECT CASE WHEN SUM(failures) > 0 THEN RAISE_ERROR('DQ gate failed')\n       END FROM dq_results WHERE run_id = :run_id AND check_name IN ('null_order_id');</pre>",
  tricky: "Distinguish critical checks (hard fail) from warnings (log and continue) — not all DQ failures should abort the pipeline.", clientApp: "DQ gates are a mandatory architectural pattern in regulated data environments.",
  docLink: ""
},
{
  id: "DW046", section: "Data Warehousing", topic: "ETL Processes",
  type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Source and target row counts differ after an overnight pipeline. What is your step-by-step investigation?",
  answer: "<strong>Step 1:</strong> Define comparable counts — are source and target at the same grain? Transformations may legitimately change count (FLATTEN, dedup).<br><strong>Step 2:</strong> Check the pipeline run log — did it complete? Any errors/rejects?<br><strong>Step 3:</strong> Check the extract: rows_extracted from source = expected?<br><strong>Step 4:</strong> Check rejected rows — rejects + loaded should equal extracted.<br><strong>Step 5:</strong> Check load mode — was MERGE used or append? Any ON_ERROR=CONTINUE that hid errors?<br><strong>Step 6:</strong> Check timezone and watermark boundaries — did the window capture all of yesterday?<br><strong>Step 7:</strong> Compare key-level: source keys not in target, target keys not in source.<br><strong>Step 8:</strong> Verify control totals (SUM of amount) — equal counts can hide offsetting errors.",
  tricky: "Unequal counts don't always mean data loss — intentional transformations (dedup, filter) change counts legitimately. Document the expected delta.", clientApp: "Source-to-target count mismatch is the most common post-load support ticket.",
  docLink: ""
},
{
  id: "DW047", section: "Data Warehousing", topic: "Audit History",
  type: "Architecture", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "Design an audit history strategy for a data warehouse. What must be auditable for regulatory compliance?",
  answer: "<strong>Minimum audit requirements for BFSI/regulated clients:</strong><br>1. <strong>Row-level load audit:</strong> who loaded it, when, from which source file/system, batch ID.<br>2. <strong>Change history:</strong> SCD2 or bi-temporal model tracks every value change with timestamps.<br>3. <strong>Access audit:</strong> who queried what data and when (Snowflake ACCESS_HISTORY).<br>4. <strong>Pipeline run log:</strong> every run, duration, status, rows processed, errors.<br>5. <strong>Data corrections log:</strong> what was changed, old value, new value, reason, who authorised.<br><br><strong>Implementation:</strong> add audit columns to every table (batch_id, source_system, load_ts, load_by) and maintain the ETL audit log table. Use Snowflake tags to classify sensitive columns for targeted lineage.",
  tricky: "Snowflake Time Travel is recovery, not audit — it expires in 90 days max. Use a permanent audit table for long-term compliance.", clientApp: "Auditors ask for evidence of who loaded data and who changed it — implement this from day one.",
  docLink: ""
},
{
  id: "DW048", section: "Data Warehousing", topic: "CDC & Incremental",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Write a SQL pattern for a hardened incremental load with overlap window and idempotent MERGE.",
  answer: "<pre class=\"code-block\">-- Step 1: determine run boundaries with overlap\nSET last_run = (SELECT COALESCE(MAX(watermark), '1900-01-01')\n                FROM etl_control WHERE job = 'orders_load');\nSET current_run = CURRENT_TIMESTAMP();\n\n-- Step 2: extract with 15-min lookback to catch late commits\nCREATE OR REPLACE TEMPORARY TABLE stg_orders AS\nSELECT * FROM source_orders\nWHERE updated_at > DATEADD('minute', -15, $last_run)\n  AND updated_at <= $current_run\nQUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1;\n\n-- Step 3: idempotent MERGE\nMERGE INTO core_orders t USING stg_orders s ON t.order_id = s.order_id\nWHEN MATCHED THEN UPDATE SET t.status=s.status, t.amount=s.amount, t.updated_at=s.updated_at\nWHEN NOT MATCHED THEN INSERT (order_id,status,amount,updated_at) VALUES (s.order_id,s.status,s.amount,s.updated_at);\n\n-- Step 4: advance watermark ONLY after successful MERGE\nUPDATE etl_control SET watermark=$current_run, status='SUCCESS', last_run_ts=CURRENT_TIMESTAMP()\nWHERE job='orders_load';</pre>",
  tricky: "The 15-min overlap causes re-processing of some rows — MERGE handles this safely via the business key.", clientApp: "This pattern is the production-standard answer to almost every ETL design question.",
  docLink: ""
},
{
  id: "DW049", section: "Data Warehousing", topic: "Data Profiling",
  type: "Architecture", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What is data cleansing? List 8 common cleansing transformations applied before loading to the integration layer.",
  answer: "<strong>1. Trim whitespace:</strong> TRIM(name) → 'Asha ' → 'Asha'<br><strong>2. Standardise case:</strong> UPPER(country_code) → 'ind' → 'IND'<br><strong>3. Date normalisation:</strong> parse 'Jan 15, 2025' → 2025-01-15<br><strong>4. Null coalescing:</strong> COALESCE(phone, mobile, 'UNKNOWN')<br><strong>5. Remove special characters:</strong> REGEXP_REPLACE(phone, '[^0-9]', '')<br><strong>6. Standardise codes:</strong> CASE WHEN gender IN ('M','Male','m') THEN 'M' END<br><strong>7. Deduplication:</strong> ROW_NUMBER + QUALIFY on business key<br><strong>8. Range validation:</strong> reject rows where age < 0 OR age > 150<br><br>Additional: split/merge fields, fix encoding issues (UTF-8), resolve abbreviations, flag suspect values.",
  tricky: "Data cleansing rules must be documented and business-approved — don't invent rules without sign-off.", clientApp: "Cleansing spec is a key project deliverable; errors here cause downstream analytics defects.",
  docLink: ""
},
{

                answer: "<strong>Short Answer (pattern):</strong> Read the stream *inside* the MERGE so the stream offset advances only if the MERGE commits. The source feeds each changed key <strong>twice</strong>: once with the real key (to close the old version) and once with a NULL merge key (which can never match, so it inserts the new version).<pre class=\"code-block\">MERGE INTO dim_customer d\nUSING (\n  WITH chg AS (\n    SELECT customer_id, city FROM stg_customer_strm\n    WHERE METADATA$ACTION = 'INSERT'\n    QUALIFY ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY updated_at DESC) = 1)\n  SELECT customer_id AS merge_key, customer_id, city FROM chg\n  UNION ALL\n  SELECT NULL, c.customer_id, c.city\n  FROM chg c JOIN dim_customer x\n    ON x.customer_id = c.customer_id AND x.is_current AND NOT EQUAL_NULL(x.city, c.city)\n) s\nON d.customer_id = s.merge_key AND d.is_current\nWHEN MATCHED AND NOT EQUAL_NULL(d.city, s.city)\n  THEN UPDATE SET d.is_current = FALSE, d.eff_to = CURRENT_TIMESTAMP()\nWHEN NOT MATCHED\n  THEN INSERT (customer_id, city, eff_from, eff_to, is_current)\n       VALUES (s.customer_id, s.city, CURRENT_TIMESTAMP(), '9999-12-31'::TIMESTAMP, TRUE);</pre><strong>Explanation:</strong> New customer -&gt; branch 1 is NOT MATCHED -&gt; inserted. Changed customer -&gt; branch 1 matches and closes the current row; branch 2 (NULL key) is NOT MATCHED -&gt; inserts the new version. Unchanged customer -&gt; matched but no clause fires. <code>updated_at</code> is an assumed column. This is a standard pattern; adapt change detection to all tracked attributes.",
