{ id: "IDD001", section: "IDMC Documentation", topic: "Secure Agent", type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "What are Secure Agent groups and runtime environments, and how do they provide high availability and load balancing?",
  answer: `A <strong>runtime environment</strong> is the compute where tasks run; a <strong>Secure Agent group</strong> holds one or more agents. With multiple agents in a group, jobs can be distributed (load balancing) and failover occurs if one agent is down. Serverless runtime environments are also available (Informatica-managed compute) for supported scenarios. Assign connections and tasks to a runtime environment, not to a single machine. Verify agent group capabilities and limits in the current docs.`,
  tricky: "Agents in one group should have the same connectivity, drivers and OS-level access.", clientApp: "HA design for on-prem sources.", docLink: "https://docs.informatica.com/" },
{ id: "IDD002", section: "IDMC Documentation", topic: "Secure Agent", type: "Debugging", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A Secure Agent shows as 'Not running' after a patch. What do you check first?",
  answer: `Check the agent service/process (Windows service or <code>infaagent</code> daemon on Linux), logs under the agent install directory (agent core logs, Tomcat/agent logs), outbound HTTPS to Informatica cloud (proxy/firewall), expired or changed credentials/token, disk space and Java/JVM memory, and upgrade/patch failure messages. Restart the agent, re-register with a fresh install token if needed, and confirm status in Administrator &gt; Runtime Environments.`,
  tricky: "Most agent outages are network/proxy or disk issues, not product bugs.", clientApp: "Ops runbook.", docLink: "https://docs.informatica.com/" },
{ id: "IDD003", section: "IDMC Documentation", topic: "Snowflake Connector", type: "Conceptual", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Which authentication methods and key connection properties does the IDMC Snowflake connection support?",
  answer: `Typical Snowflake connection properties: account (identifier), warehouse, role, database/schema defaults, and authentication: standard (user/password), key-pair, and OAuth/other modes depending on connector version. Additional JDBC/connection parameters can be supplied. For pipelines prefer a service user with key-pair auth and a dedicated ETL role. Confirm supported modes and property names for your connector version in the docs.`,
  tricky: "Wrong account identifier format is the most common connection failure.", clientApp: "Secure connection setup.", docLink: "https://docs.informatica.com/" },
{ id: "IDD004", section: "IDMC Documentation", topic: "SQL ELT / Pushdown", type: "Conceptual", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Explain SQL ELT optimization (pushdown) in CDI for Snowflake: when it applies and how to verify what was pushed down.",
  answer: `With SQL ELT optimization the mapping is translated to SQL that Snowflake executes, so data does not move through the Secure Agent. It applies when sources and targets are in the same Snowflake environment and all transformations in the mapping are supported for pushdown. You enable it in the Mapping Task (advanced/optimization settings) and review the job log/session log for the generated SQL and whether the mapping was fully or partially pushed down. If an unsupported transformation exists, behaviour falls back or partially pushes down depending on option. Validate result parity on a sample.`,
  tricky: "Different sources (e.g. Oracle + Snowflake) cannot be fully pushed down in one statement.", clientApp: "Key performance lever for ELT.", docLink: "https://docs.informatica.com/" },
{ id: "IDD005", section: "IDMC Documentation", topic: "Mappings", type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "What is the difference between input parameters and in-out parameters in a CDI mapping, and how are they set at runtime?",
  answer: `Input parameters hold values supplied before the run (connection, object name, filter, date). In-out parameters (and aggregation variables, such as a high-water mark) can be updated by the mapping during the run and the new value is saved for the next run (for example, last extracted timestamp). Values can be defined in the Mapping Task, overridden by Taskflow input fields, or provided via a parameter file. Check which parameter types are supported by your task type.`,
  tricky: "In-out parameter updates persist only if the job completes as defined in docs; design restart logic anyway.", clientApp: "Incremental extraction watermarks.", docLink: "https://docs.informatica.com/" },
{ id: "IDD006", section: "IDMC Documentation", topic: "Parameters", type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do parameter files work in IDMC and where can they be stored? What are the pitfalls?",
  answer: `A parameter file supplies values for mapping/task parameters, stored on the Secure Agent machine or in supported cloud storage locations (check supported options by version) and referenced in the Mapping Task. Pitfalls: path accessibility from the agent, syntax errors, encoding/line endings, parameter name case/scope, secrets in plain text, and stale files not updated before the run. Prefer Taskflow inputs for values the orchestration controls.`,
  tricky: "Do not store credentials in parameter files.", clientApp: "Environment-specific config.", docLink: "https://docs.informatica.com/" },
{ id: "IDD007", section: "IDMC Documentation", topic: "Taskflows", type: "Conceptual", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "List Taskflow step types and describe how data is passed between steps and how errors are handled.",
  answer: `Common steps: Data Task (run a mapping task etc.), Command, Notification (email), Decision, Parallel Paths, Wait, Jump, Subtaskflow, Assignment, Throw, End. Data moves via taskflow input/temp fields and task output fields (e.g. rows processed, status). Error handling: per-step fault/error paths, Decision on task status, Throw to raise custom faults, and notification steps for alerts. Use step-level error behaviour (suspend on fault vs continue) deliberately. Verify the exact step list in your release docs.`,
  tricky: "Suspend-on-fault leaves a taskflow instance waiting for manual resume.", clientApp: "Orchestration standards.", docLink: "https://docs.informatica.com/" },
{ id: "IDD008", section: "IDMC Documentation", topic: "Taskflows", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do you run a Taskflow on file arrival, and what are the limits of file listeners versus scheduling?",
  answer: `Use a file listener / event-based trigger (file listener on agent-accessible or supported cloud locations) that starts the taskflow when a file lands, passing file details as inputs. Schedules are time-based. Limits to check in docs: supported storage types, polling interval, file stability checks (partially written files), concurrency, and ordering. Use a control file or size/stability check to avoid reading half-written files.`,
  tricky: "Event-driven does not guarantee all files arrive together; add completeness checks.", clientApp: "File-driven ingestion.", docLink: "https://docs.informatica.com/" },
{ id: "IDD009", section: "IDMC Documentation", topic: "Taskflows", type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How can a Taskflow be invoked externally (REST API) and monitored? What authentication is used?",
  answer: `Published taskflows expose a service endpoint that external systems can call (with JSON inputs) after authenticating to Informatica (session/token from the login API or supported service auth). Status can be polled via the monitoring/activity REST APIs. Use this for integration with external schedulers (Control-M, Airflow). Confirm exact URL patterns and auth flow in the REST API documentation for your pod.`,
  tricky: "Treat the call as async and poll status rather than blocking.", clientApp: "Enterprise scheduler integration.", docLink: "https://docs.informatica.com/" },
{ id: "IDD010", section: "IDMC Documentation", topic: "Ingestion", type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "What load types does database ingestion (Data Ingestion and Replication) support, and how does it capture changes?",
  answer: `Typical load types: initial load, incremental load (by a key/timestamp column), combined initial and incremental (CDC), with log-based CDC for supported sources (Oracle, SQL Server, MySQL, PostgreSQL, etc.) using database logs. Targets include Snowflake, cloud storage, other warehouses. Source needs log access/permissions and appropriate retention. Check supported sources/targets and DDL propagation behaviour for your version.`,
  tricky: "Log retention too short on source breaks restart after downtime.", clientApp: "Large-scale migration and replication.", docLink: "https://docs.informatica.com/" },
{ id: "IDD011", section: "IDMC Documentation", topic: "Ingestion", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A CDC ingestion job to Snowflake falls behind. What do you check in IDMC and in Snowflake?",
  answer: `IDMC: job metrics (latency, rows/sec), agent CPU/memory/network, batch/commit settings, source log reader lag, errors/warnings. Snowflake: warehouse size/queuing for apply, target table locks, MERGE vs insert-only apply mode, file sizes/frequency, clustering/search maintenance on target. Source: redo/transaction log volume spikes, long-running transactions. Tune batch interval and size, scale the agent group, and decouple apply from landing.`,
  tricky: "Apply (MERGE) is often the bottleneck, not extraction.", clientApp: "Replication SLA troubleshooting.", docLink: "https://docs.informatica.com/" },
{ id: "IDD012", section: "IDMC Documentation", topic: "Mapping Task", type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "What advanced properties on a Mapping Task affect Snowflake loads (pre/post SQL, commit size, error handling)?",
  answer: `Mapping Task and target options include pre-SQL/post-SQL, write mode (insert/update/upsert/delete/data driven), batch/commit sizing, error thresholds and reject handling, and Snowflake connector specific properties (staging, bulk load behaviour). Use pre-SQL for truncating staging and post-SQL for validation/MERGE. Exact property names vary by connector version; consult the Snowflake connector guide.`,
  tricky: "A failing post-SQL fails the task even if rows loaded.", clientApp: "Load strategy tuning.", docLink: "https://docs.informatica.com/" },
{ id: "IDD013", section: "IDMC Documentation", topic: "Transformations", type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "Contrast Lookup transformation caching options (cached, uncached, dynamic) and when each is appropriate.",
  answer: `Cached lookup loads the reference data into memory once (best for small/medium static reference tables). Uncached queries the source per row (small input rows, large frequently changing reference). Dynamic cache updates the cache as rows pass, useful for deduplicating within a run or maintaining inserts during the load. Match multiple rows policy and condition ports matter. Confirm availability per runtime/pushdown mode.`,
  tricky: "Lookup against large unsorted tables with caching can exhaust agent memory.", clientApp: "Performance tuning.", docLink: "https://docs.informatica.com/" },
{ id: "IDD014", section: "IDMC Documentation", topic: "Transformations", type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How does the Joiner transformation behave regarding master/detail, sorted input and cache, and when can the join be pushed down?",
  answer: `Master (smaller) is cached; detail streams through. Sorted input can reduce memory. Heterogeneous joins must run in the engine; homogeneous joins (same connection/Snowflake) can be pushed down as SQL joins. Ensure join keys have compatible types and handle NULL keys (not equal). Review log for cache usage and spills.`,
  tricky: "Swapping master and detail can be the difference between minutes and hours.", clientApp: "Join performance.", docLink: "https://docs.informatica.com/" },
{ id: "IDD015", section: "IDMC Documentation", topic: "Transformations", type: "Conceptual", difficulty: "Advanced", priority: "Medium", coverage: "Beyond TOC",
  question: "What is the Hierarchy Parser/Builder and how do you design handling of deeply nested JSON from APIs?",
  answer: `Hierarchy Parser converts hierarchical input (JSON/XML) into relational output groups using a hierarchical schema; Hierarchy Builder does the reverse. Define the schema from a sample, map child arrays to output groups, handle optional/missing keys and arrays of arrays carefully. For schema-variable payloads land JSON as a string/VARIANT in Snowflake and parse there.`,
  tricky: "A schema inferred from a small sample can miss optional fields.", clientApp: "API ingestion.", docLink: "https://docs.informatica.com/" },
{ id: "IDD016", section: "IDMC Documentation", topic: "Mappings", type: "Conceptual", difficulty: "Advanced", priority: "Medium", coverage: "Beyond TOC",
  question: "How do mapplets and reusable components differ from mapping templates, and how do you manage change impact?",
  answer: `Mapplets encapsulate reusable transformation logic embedded in mappings (no sources/targets as discussed); changes propagate to mappings that use them on next validation/publish, so version/impact analysis is needed. Use naming conventions, documented interfaces, and test suites. Use Explore/dependencies to find usage before changing.`,
  tricky: "Changing a shared mapplet can break many mappings simultaneously.", clientApp: "Reuse governance.", docLink: "https://docs.informatica.com/" },
{ id: "IDD017", section: "IDMC Documentation", topic: "Deployment", type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do you promote assets from dev to test to prod in IDMC (export/import, asset migration, Git integration)?",
  answer: `Options: export assets as packages and import to the target org/sub-org, use source control (Git integration) with commits/promotions and repository-based deployment, or REST/automation for CI/CD. Handle connections and runtime environments per environment (connection names differ), parameterize environment values, and run post-deployment validation. Confirm which features your licence and release support.`,
  tricky: "Connections are environment-specific; remap them or use consistent names.", clientApp: "CI/CD design.", docLink: "https://docs.informatica.com/" },
{ id: "IDD018", section: "IDMC Documentation", topic: "Administration", type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do organizations, sub-organizations and roles/privileges isolate environments and teams?",
  answer: `A parent org can contain sub-orgs, each with its own assets, connections, users, agents and licences allocation. Users get roles (privilege sets) per org; custom roles can restrict who can design, run, or administer. Use sub-orgs for environment or business-unit isolation and audit logs for tracking changes.`,
  tricky: "Assets are not shared across orgs automatically.", clientApp: "Multi-team governance.", docLink: "https://docs.informatica.com/" },
{ id: "IDD019", section: "IDMC Documentation", topic: "Monitoring", type: "Debugging", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Where do you find the generated SQL, session log and error rows for a failed CDI job, and how do you download logs for support?",
  answer: `In Monitor (My Jobs/All Jobs), open the job, view the session log and execution details; download the log, and review error row files where configured. For pushdown, logs include generated SQL statements. Agent-level logs are on the agent host for connectivity/runtime errors. Set the log level appropriately and share job ID plus logs with support.`,
  tricky: "Default retention of logs is limited; export important runs.", clientApp: "Incident handling.", docLink: "https://docs.informatica.com/" },
{ id: "IDD020", section: "IDMC Documentation", topic: "Monitoring", type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do you configure alerts/notifications at task, taskflow and organization level, and what SMTP/webhook options exist?",
  answer: `Task-level success/warning/failure emails, taskflow Notification steps for custom messages, and org-level notification settings. For chat tools call a webhook via Command/Service steps or custom API calls. Test recipient lists, avoid noisy alerts, and include job name, run ID, error and link in messages.`,
  tricky: "Alert on business conditions (row count thresholds), not only technical failure.", clientApp: "Support model.", docLink: "https://docs.informatica.com/" },
{ id: "IDD021", section: "IDMC Documentation", topic: "Scheduling", type: "Conceptual", difficulty: "Intermediate", priority: "Medium", coverage: "Beyond TOC",
  question: "How are time zones and blackout periods handled in IDMC schedules?",
  answer: `Schedules are defined with a time zone, start/end dates and repeat patterns; blackout/exclusion settings (where available) skip runs in defined windows. Check DST behaviour and the schedule's time zone versus agent/server time. Prefer explicit time zones and review next-run times after creation.`,
  tricky: "DST transitions can skip or double a run.", clientApp: "Operational calendars.", docLink: "https://docs.informatica.com/" },
{ id: "IDD022", section: "IDMC Documentation", topic: "CAI", type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "In CAI, how do process types (service, human, guide) and runtime (Secure Agent vs cloud) affect design?",
  answer: `CAI processes orchestrate services; they can run on the cloud runtime or on a Secure Agent when accessing private resources. Design with sync vs async processes, timeouts, retries, fault handlers, and idempotent operations. Use process objects for typed payloads. Choose runtime by network access and latency requirements.`,
  tricky: "Synchronous processes have time limits; long jobs need async callbacks.", clientApp: "API-led integration.", docLink: "https://docs.informatica.com/" },
{ id: "IDD023", section: "IDMC Documentation", topic: "CAI", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do you secure an API published from CAI (authentication, rate limiting, IP restrictions)?",
  answer: `Use supported authentication (basic, token, OAuth/JWT per configuration), API Manager policies for rate limiting/quotas, IP allowlists, TLS, and least-privilege access for callers. Log requests, avoid logging sensitive payloads, validate input schemas, and monitor errors. Confirm policy options in your release.`,
  tricky: "Public endpoints without rate limits invite abuse.", clientApp: "API security review.", docLink: "https://docs.informatica.com/" },
{ id: "IDD024", section: "IDMC Documentation", topic: "CAI-CDI", type: "Scenario", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How do you call a CDI Taskflow/Mapping Task from CAI and surface its status back to the caller?",
  answer: `Use the CDI connector/service to start a task or taskflow with input parameters, capture the run/job ID, then poll status (or use callback) and map completion/errors to the API response. For long jobs return 202 with a status endpoint. Pass correlation ids for traceability.`,
  tricky: "Do not block an HTTP request waiting for a long ETL.", clientApp: "API-triggered loads.", docLink: "https://docs.informatica.com/" },
{ id: "IDD025", section: "IDMC Documentation", topic: "CDQ", type: "Conceptual", difficulty: "Advanced", priority: "Medium", coverage: "Beyond TOC",
  question: "What are CDQ rule specifications, scorecards and dictionaries, and how do they fit with pipelines before loading to Snowflake?",
  answer: `Rule specifications define validation/standardization logic reusable in mappings; scorecards track quality metrics over time; dictionaries hold reference values for matching/validation. Use them to gate or flag bad data before loading, and publish scores to stakeholders. Combine with Snowflake DMFs for in-warehouse monitoring.`,
  tricky: "Quality rules must be owned by the business, not just IT.", clientApp: "DQ framework.", docLink: "https://docs.informatica.com/" },
{ id: "IDD026", section: "IDMC Documentation", topic: "Catalog", type: "Conceptual", difficulty: "Advanced", priority: "Medium", coverage: "Beyond TOC",
  question: "How does Cloud Data Governance and Catalog scan Snowflake and show lineage?",
  answer: `A catalog source/scanner connects to Snowflake with a read-only role, harvests metadata (tables, columns, views), profiles data optionally, and derives lineage from SQL/ETL metadata and CDI mappings. Scanning needs privileges on ACCOUNT_USAGE/INFORMATION_SCHEMA as documented, schedules, and filters to limit scope. Lineage accuracy depends on parsing support and connected tools.`,
  tricky: "Over-broad scans can add warehouse cost; limit scope.", clientApp: "Governance rollout.", docLink: "https://docs.informatica.com/" },
{ id: "IDD027", section: "IDMC Documentation", topic: "Performance", type: "Performance", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Which agent and mapping settings matter for performance (DTM buffer, partitioning, JVM memory, concurrency) and how do you tune safely?",
  answer: `Review mapping task advanced settings (buffer/cache sizes, partitioning), agent resources (CPU/RAM, JVM heap), max concurrent tasks per agent, source read parallelism and target bulk load options. Tune with controlled tests: change one setting, compare throughput, watch memory/GC. Prefer pushdown for Snowflake-to-Snowflake logic.`,
  tricky: "Increasing parallelism can overload sources or Snowflake locks.", clientApp: "Throughput tuning.", docLink: "https://docs.informatica.com/" },
{ id: "IDD028", section: "IDMC Documentation", topic: "Connectors", type: "Conceptual", difficulty: "Intermediate", priority: "Medium", coverage: "Beyond TOC",
  question: "What is the difference between native connectors, ODBC/JDBC-based generic connectors and Informatica Connector Toolkit connectors?",
  answer: `Native connectors are optimized and supported for specific systems; generic ODBC/JDBC connectors give broad access but fewer optimizations and pushdown features; Connector Toolkit enables custom connectors for REST/other APIs. Prefer native when available. Check entitlement and drivers on the agent.`,
  tricky: "Generic JDBC usually lacks bulk-load optimizations.", clientApp: "Connector selection.", docLink: "https://docs.informatica.com/" },
{ id: "IDD029", section: "IDMC Documentation", topic: "Security", type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How are secrets, connection credentials and encryption handled in IDMC, and what are best practices for Snowflake credentials?",
  answer: `Connection credentials are stored encrypted by the platform; some deployments integrate with secrets managers (AWS/Azure/HashiCorp) where supported. Use service accounts with key-pair auth, least-privilege Snowflake roles, rotate keys, avoid hard-coded values in parameter files/commands, and restrict who can edit connections via roles.`,
  tricky: "Editing a shared connection affects every task using it.", clientApp: "Security audit.", docLink: "https://docs.informatica.com/" },
{ id: "IDD030", section: "IDMC Documentation", topic: "Licensing", type: "Conceptual", difficulty: "Intermediate", priority: "Medium", coverage: "Beyond TOC",
  question: "How does IDMC licensing (IPU consumption) influence design choices for a Snowflake project?",
  answer: `IDMC is commonly consumption-based (Informatica Processing Units) with metering by service/usage. Design for efficiency: use pushdown/ELT, incremental loads, avoid unnecessary full reloads and idle runtime, monitor usage dashboards, and right-size schedules. Confirm the metering model with the client's contract as terms differ.`,
  tricky: "Cost drivers differ from Snowflake credits; model both.", clientApp: "TCO discussion.", docLink: "https://docs.informatica.com/" },
        ];

  

    let currentMode = "browse";
    let currentQuestionIndex = 0;

    function getSaved(key, id) {
      try { return localStorage.getItem(`${key}_${id}`) === "true"; }
      catch (error) { return false; }
    }
    function setSaved(key, id, value) {
      try {
        if (value) localStorage.setItem(`${key}_${id}`, "true");
        else localStorage.removeItem(`${key}_${id}`);
      } catch (error) { console.warn("Progress could not be saved in this browser.", error); }
    }
    function getFilteredQuestions() {
      const section = document.getElementById("filterSection").value;
      const type = document.getElementById("filterType").value;
      const difficulty = document.getElementById("filterDifficulty").value;
      const priority = document.getElementById("filterPriority").value;
      const status = document.getElementById("filterAnswerStatus").value;
      const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();

      return questionsDatabase.filter(q => {
        if (section && q.section !== section) return false;
        if (type && q.type !== type) return false;
        if (difficulty && q.difficulty !== difficulty) return false;
        if (priority && q.priority !== priority) return false;
        if (searchTerm && !(`${q.question} ${q.topic} ${q.section} ${q.answer}`.toLowerCase().includes(searchTerm))) return false;
        const revealed = getSaved("revealed", q.id);
        const understood = getSaved("understood", q.id);
        const revision = getSaved("revision", q.id);
        if (status === "Unanswered" && revealed) return false;
        if (status === "Revealed" && !revealed) return false;
        if (status === "Understood" && !understood) return false;
        if (status === "Revision" && !revision) return false;
        return true;
      });
    }
    function applyFilters() {
      currentQuestionIndex = 0;
      renderQuestions();
    }
    function resetFilters() {
      ["filterSection", "filterType", "filterDifficulty", "filterPriority", "filterAnswerStatus"].forEach(id => {
        document.getElementById(id).value = "";
      });
      document.getElementById("searchInput").value = "";
      currentQuestionIndex = 0;
      renderQuestions();
    }
    function switchMode(mode, button) {
      currentMode = mode;
      currentQuestionIndex = 0;
      document.querySelectorAll(".mode-tab").forEach(tab => tab.classList.toggle("active", tab === button));
      renderQuestions();
    }
    function renderQuestions() {
      const questions = getFilteredQuestions();
      if (currentMode === "practice") renderPracticeMode(questions);
      else if (currentMode === "coverage") renderCoverageReport();
      else renderBrowseMode(questions);
    }
    function renderBrowseMode(questions) {
      const beginner = questions.filter(q => q.difficulty === "Beginner").length;
      const tricky = questions.filter(q => q.difficulty === "Tricky").length;
      let html = `<div class="dashboard">
        <div class="stat"><div class="stat-value">${questions.length}</div><div class="stat-label">Filtered Questions</div></div>
        <div class="stat"><div class="stat-value">${questionsDatabase.length}</div><div class="stat-label">Total in Bank</div></div>
        <div class="stat"><div class="stat-value">${beginner}</div><div class="stat-label">Beginner</div></div>
        <div class="stat"><div class="stat-value">${tricky}</div><div class="stat-label">Tricky</div></div>
      </div>`;
      if (!questions.length) html += `<div class="empty-state"><h3>No questions match your filters</h3><p>Change a filter or select Reset Filters.</p></div>`;
      else html += questions.map((q, i) => renderQuestionCard(q, i)).join("");
      document.getElementById("mainContent").innerHTML = html;
    }
    function renderQuestionCard(q, index) {
      const revealed = getSaved("revealed", q.id);
      const understood = getSaved("understood", q.id);
      const revision = getSaved("revision", q.id);
      const difficultyClass = `badge-${q.difficulty.toLowerCase().replace(/\s+/g, "-")}`;
      return `<article class="question-card" id="card_${q.id}">
        <div class="question-meta">
          <span class="badge badge-section">${q.section}</span><span class="badge badge-type">${q.type}</span>
          <span class="badge ${difficultyClass}">${q.difficulty}</span><span class="badge">${q.priority}</span>
        </div>
        <div class="question-number">Q${index + 1} · ${q.topic}</div>
        <div class="question-text">${q.question}</div>
        ${q.example ? `<pre class="question-code">${escapeHtml(q.example)}</pre>` : ""}
        <div class="answer-section">${revealed ? answerHtml(q) : `<div class="answer-hidden">Answer hidden. Select Reveal Answer when you're ready.</div>`}</div>
        <div class="card-actions">
          <button type="button" class="btn-action" onclick="toggleAnswer('${q.id}')">${revealed ? "Hide Answer" : "Reveal Answer"}</button>
          <button type="button" class="btn-action ${understood ? "active" : ""}" aria-pressed="${understood}" onclick="toggleProgress('understood','${q.id}')">${understood ? "✓ Understood" : "Mark Understood"}</button>
          <button type="button" class="btn-action ${revision ? "active" : ""}" aria-pressed="${revision}" onclick="markRevision('${q.id}')">${revision ? "Remove Revision" : "Mark for Revision"}</button>
          ${q.docLink ? `<a class="doc-link" href="${q.docLink}" target="_blank" rel="noopener noreferrer">Open Docs ↗</a>` : ""}
        </div>
      </article>`;
    }
    function answerHtml(q) {
      return `<div class="answer-content">${q.answer}${q.tricky ? `<br><br><strong>Tricky Point:</strong> ${q.tricky}` : ""}${q.clientApp ? `<br><br><strong>Client Application:</strong> ${q.clientApp}` : ""}</div>`;
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[char]));
    }
    function toggleAnswer(id) {
      setSaved("revealed", id, !getSaved("revealed", id));
      renderQuestions();
    }
    function toggleProgress(key, id) {
      setSaved(key, id, !getSaved(key, id));
      renderQuestions();
    }
    function markRevision(id) {
      setSaved("revision", id, !getSaved("revision", id));
      renderQuestions();
    }
    function randomQuestion() {
      const questions = getFilteredQuestions();
      if (!questions.length) { alert("No questions match your filters."); return; }
      currentMode = "browse";
      currentQuestionIndex = 0;
      document.querySelectorAll(".mode-tab").forEach(tab => tab.classList.toggle("active", tab.dataset.mode === "browse"));
      const chosen = questions[Math.floor(Math.random() * questions.length)];
      renderBrowseMode(questions);
      document.getElementById(`card_${chosen.id}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    function renderPracticeMode(questions) {
      const root = document.getElementById("mainContent");
      if (!questions.length) {
        root.innerHTML = `<div class="empty-state"><h3>No questions match your filters</h3><p>Adjust the filters to continue practicing.</p></div>`;
        return;
      }
      currentQuestionIndex = ((currentQuestionIndex % questions.length) + questions.length) % questions.length;
      const q = questions[currentQuestionIndex];
      const revealed = getSaved("revealed", q.id);
      root.innerHTML = `<div class="practice-panel">
        <div class="practice-heading"><h2>Practice Mode</h2><p>Question ${currentQuestionIndex + 1} of ${questions.length}</p></div>
        <article class="question-card"><div class="question-meta"><span class="badge badge-section">${q.section}</span><span class="badge badge-type">${q.type}</span><span class="badge badge-${q.difficulty.toLowerCase()}">${q.difficulty}</span></div>
          <div class="question-text">${q.question}</div>${q.example ? `<pre class="question-code">${escapeHtml(q.example)}</pre>` : ""}
          <div class="answer-section">${revealed ? answerHtml(q) : `<div class="answer-hidden">Think through your answer before revealing it.</div>`}</div>
          <div class="card-actions"><button class="btn-action" type="button" onclick="toggleAnswer('${q.id}')">${revealed ? "Hide Answer" : "Reveal Answer"}</button><button class="btn-action ${getSaved("revision", q.id) ? "active" : ""}" type="button" onclick="markRevision('${q.id}')">${getSaved("revision", q.id) ? "Remove Revision" : "Mark for Revision"}</button></div>
        </article>
        <div class="practice-controls"><button type="button" class="btn" onclick="previousPracticeQuestion()">← Previous</button><button type="button" class="btn pri" onclick="nextPracticeQuestion()">Next →</button></div>
      </div>`;
    }
    function nextPracticeQuestion() {
      const questions = getFilteredQuestions();
      if (!questions.length) return;
      currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
      renderPracticeMode(questions);
    }
    function previousPracticeQuestion() {
      const questions = getFilteredQuestions();
      if (!questions.length) return;
      currentQuestionIndex = (currentQuestionIndex - 1 + questions.length) % questions.length;
      renderPracticeMode(questions);
    }
    function renderCoverageReport() {
      const root = document.getElementById("mainContent");
      const sections = [...new Set(questionsDatabase.map(q => q.section))];
      let html = `<h2 style="margin-bottom:18px">TOC Coverage Report</h2>`;
      sections.forEach(section => {
        const sectionQuestions = questionsDatabase.filter(q => q.section === section);
        const topics = {};
        sectionQuestions.forEach(q => topics[q.topic] = (topics[q.topic] || 0) + 1);
        html += `<div class="toc-coverage"><h3>${section} (${sectionQuestions.length} questions)</h3>`;
        Object.entries(topics).forEach(([topic, count]) => html += `<div class="toc-topic"><span>${topic}</span><span class="toc-count">${count} Q</span></div>`);
        html += `</div>`;
      });
      html += `<p class="coverage-total">Total: ${questionsDatabase.length} questions across ${sections.length} sections.</p>`;
      root.innerHTML = html;
    }
    function resetProgress() {
      if (!confirm("Clear all saved answer reveals, understood marks and revision marks?")) return;
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && /^(revealed|understood|revision)_/.test(key)) keys.push(key);
        }
        keys.forEach(key => localStorage.removeItem(key));
      } catch (error) { alert("Progress could not be reset in this browser."); }
      renderQuestions();
    }

    renderQuestions();
  </script>
</body>
</html>
