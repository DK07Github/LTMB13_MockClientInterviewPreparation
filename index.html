<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>D&A, Snowflake &amp; IDMC Interview Prep Portal</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f7f6;
      --surface: #ffffff;
      --tx: #18312f;
      --muted: #607572;
      --border: #d7e4e1;
      --pri: #4d1a6a;
      --pri-hover: #115e59;
      --accent: #0d9488;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --shadow: 0 4px 18px rgba(20, 54, 50, .07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font: 16px / 1.5 system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--tx);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .container { display: flex; min-height: 100vh; }
    .sidebar {
      width: 285px; flex: 0 0 285px; background: var(--surface);
      border-right: 1px solid var(--border); padding: 22px; overflow-y: auto;
    }
    .sidebar h2 { font-size: 1rem; margin-bottom: 20px; color: var(--pri); letter-spacing: .04em; }
    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .header { padding: 25px 30px; color: white; background: var(--pri); }
    .header h1 { font-size: clamp(1.2rem, 2.5vw, 1.7rem); line-height: 1.25; margin-bottom: 7px; }
    .header p { font-size: .92rem; opacity: .9; }
    .content { padding: 28px; width: 100%; max-width: 1500px; margin: 0 auto; }
    .filter-section { margin-bottom: 18px; }
    .filter-section > label { display: block; margin-bottom: 7px; color: var(--muted); font-size: .76rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .filter-section select, .filter-section input {
      width: 100%; padding: 10px 11px; color: var(--tx); background: var(--bg);
      border: 1px solid var(--border); border-radius: 7px; outline: none;
    }
    .filter-section select:focus, .filter-section input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,.13); }
    .mode-tabs { display: grid; gap: 8px; }
    .btn, .btn-action, .mode-tab {
      border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px;
      background: var(--surface); color: var(--tx); font-weight: 600; font-size: .85rem;
      transition: background .15s, border-color .15s, color .15s;
    }
    .btn:hover, .btn-action:hover, .mode-tab:hover { border-color: var(--pri); }
    button.pri, .btn.pri {
      background: var(--pri); border-color: var(--pri); color: #eafffb; font-weight: 600;
    }
    button.pri:hover, .btn.pri:hover { background: var(--pri-hover); border-color: var(--pri-hover); }
    .mode-tab { width: 100%; text-align: left; }
    .mode-tab.active { background: var(--pri); color: #eafffb; border-color: var(--pri); }
    .btn-group { display: flex; gap: 8px; margin-top: 14px; }
    .btn-group .btn { flex: 1; }
    .dashboard { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 24px; }
    .stat { padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); text-align: center; }
    .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--pri); }
    .stat-label { color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-size: .72rem; font-weight: 700; }
    .question-card, .toc-coverage { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 22px; margin-bottom: 18px; box-shadow: var(--shadow); }
    .question-card:hover { border-color: #86bdb6; }
    .question-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 4px 9px; border-radius: 20px; font-size: .72rem; font-weight: 750; background: #e8f3f1; color: #245d57; }
    .badge-beginner { background: #e5f5e9; color: #166534; }
    .badge-intermediate { background: #fff2d8; color: #92400e; }
    .badge-advanced, .badge-tricky { background: #fee8e7; color: #991b1b; }
    .badge-section { background: #dff3ef; color: #0f625a; }
    .badge-type { background: #e8edf2; color: #40546a; }
    .question-number { color: var(--muted); font-size: .78rem; margin-bottom: 6px; }
    .question-text { font-size: 1.04rem; font-weight: 650; margin: 8px 0 14px; white-space: normal; }
    .question-code, .code-block { overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: #f0f5f4; border-left: 3px solid var(--accent); border-radius: 5px; padding: 13px; margin: 12px 0; font: .86rem/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .answer-section { border-top: 1px solid var(--border); padding-top: 15px; margin-top: 15px; }
    .answer-hidden { color: var(--muted); font-style: italic; padding: 8px 0; }
    .answer-content { background: #eef8f5; border-left: 3px solid var(--accent); padding: 15px; border-radius: 5px; line-height: 1.75; overflow-wrap: anywhere; }
    .answer-content strong { color: var(--pri); }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
    .btn-action.active { background: #dff3e5; border-color: #86c99a; color: #166534; }
    .doc-link { color: var(--pri); font-weight: 650; font-size: .85rem; text-decoration: none; padding: 6px; }
    .doc-link:hover { text-decoration: underline; }
    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
    .empty-state h3 { color: var(--tx); margin-bottom: 8px; }
    .practice-panel { max-width: 900px; margin: 0 auto; }
    .practice-heading { padding: 22px; background: #e1f2ef; border: 1px solid var(--border); border-radius: 10px; text-align: center; margin-bottom: 18px; }
    .practice-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin: 16px 0 25px; }
    .toc-coverage h3 { color: var(--pri); margin-bottom: 10px; }
    .toc-topic { display: flex; justify-content: space-between; gap: 15px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: .9rem; }
    .toc-topic:last-child { border-bottom: 0; }
    .toc-count { color: var(--pri); font-weight: 750; white-space: nowrap; }
    .coverage-total { color: var(--muted); margin: 16px 0; }
    @media (max-width: 850px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; flex: auto; border-right: 0; border-bottom: 1px solid var(--border); }
      .header { padding: 20px; }
      .content { padding: 17px; }
      .dashboard { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 450px) {
      .question-card, .toc-coverage { padding: 15px; }
      .btn-group { flex-direction: column; }
      .dashboard { gap: 9px; }
      .stat { padding: 13px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2>FILTER PANEL</h2>
      <div class="filter-section">
        <label>Mode</label>
        <div class="mode-tabs">
          <button type="button" class="mode-tab active" data-mode="browse" onclick="switchMode('browse', this)">Browse All</button>
          <button type="button" class="mode-tab" data-mode="practice" onclick="switchMode('practice', this)">Practice</button>
          <button type="button" class="mode-tab" data-mode="coverage" onclick="switchMode('coverage', this)">TOC Coverage</button>
        </div>
      </div>
      <div class="filter-section">
        <label for="filterSection">Section</label>
        <select id="filterSection" onchange="applyFilters()">
          <option value="">All Sections</option>
          <option>SQL</option><option>Python</option><option>Data Warehousing</option>
          <option>Snowflake Basic</option><option>Snowflake Advanced</option>
          <option>Snowflake Documentation</option><option>IDMC</option>
          <option>IDMC Documentation</option><option>Scenario-Based</option>
        </select>
      </div>
      <div class="filter-section">
        <label for="filterType">Question Type</label>
        <select id="filterType" onchange="applyFilters()">
          <option value="">All Types</option><option>Conceptual</option><option>Coding</option>
          <option>Output Prediction</option><option>Debugging</option><option>Scenario</option>
          <option>Architecture</option><option>Performance</option>
        </select>
      </div>
      <div class="filter-section">
        <label for="filterDifficulty">Difficulty</label>
        <select id="filterDifficulty" onchange="applyFilters()">
          <option value="">All Levels</option><option>Beginner</option><option>Intermediate</option>
          <option>Advanced</option><option>Tricky</option>
        </select>
      </div>
      <div class="filter-section">
        <label for="filterPriority">Priority</label>
        <select id="filterPriority" onchange="applyFilters()">
          <option value="">All Priorities</option><option>Must Know</option><option>High Priority</option>
          <option>Advanced</option><option>Expert</option>
        </select>
      </div>
      <div class="filter-section">
        <label for="filterAnswerStatus">Answer Status</label>
        <select id="filterAnswerStatus" onchange="applyFilters()">
          <option value="">All Questions</option><option value="Unanswered">Unanswered</option>
          <option value="Revealed">Revealed</option><option value="Understood">Marked Understood</option>
          <option value="Revision">Marked for Revision</option>
        </select>
      </div>
      <div class="filter-section">
        <label for="searchInput">Search</label>
        <input type="search" id="searchInput" placeholder="Search questions..." oninput="applyFilters()">
      </div>
      <div class="btn-group">
        <button type="button" class="btn" onclick="resetFilters()">Reset Filters</button>
        <button type="button" class="btn pri" onclick="randomQuestion()">Random Q</button>
      </div>
      <div class="filter-section" style="margin-top:22px;padding-top:17px;border-top:1px solid var(--border)">
        <button type="button" class="btn" style="width:100%" onclick="resetProgress()">Reset Progress</button>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <h1>D&amp;A, Snowflake &amp; IDMC Interview Prep</h1>
        <p>Interview question bank · Revision tracker · Practice mode</p>
      </header>
      <section class="content" id="mainContent" aria-live="polite"></section>
    </main>
  </div>

  <script>
    // Add new question objects inside this array. Keep every question ID unique.
     questionsDatabase = [
            // ============================================================
// SECTION 1: SQL — 80+ Questions covering full TOC
// ============================================================
{
  id: "SQL001", section: "SQL", topic: "Planning Logic & Pseudocode",
  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "What is pseudocode and why is it useful before writing SQL or ETL logic? Show a pseudocode example for an incremental load.",
  answer: "<strong>Short Answer:</strong> Pseudocode is plain-language, structure-only representation of logic—no syntax rules. It helps validate logic with stakeholders before coding.<br><br><strong>Example — incremental load:</strong><pre class=\"code-block\">GET last_successful_run_time FROM control_table\nFOR EACH record in source WHERE updated_at > last_run_time:\n    IF record exists in target (by business_key):\n        UPDATE target\n    ELSE:\n        INSERT into target\nSET last_successful_run_time = current_time IN control_table\nLOG rows_processed, rows_failed</pre><strong>Explanation:</strong> A flowchart shows the same logic visually with decision boxes and arrows. Both help catch logic errors early.",
  tricky: "Pseudocode is not a standard—just be consistent within a team.", clientApp: "Design docs and peer reviews use pseudocode; clients appreciate seeing logic before build.",
  docLink: ""
},
{
  id: "SQL002", section: "SQL", topic: "Database Fundamentals",
  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "What is a database? Contrast relational (RDBMS) and non-relational (NoSQL) databases with examples of each.",
  answer: "<strong>Short Answer:</strong> A database is an organised collection of structured data stored and accessed electronically.<br><br><strong>RDBMS:</strong> tables with rows/columns, foreign keys, SQL interface, ACID transactions. Examples: MySQL, PostgreSQL, Oracle, SQL Server, Teradata, Snowflake.<br><br><strong>NoSQL:</strong> flexible schemas, horizontal scale, eventual consistency. Types: document (MongoDB), key-value (Redis), column-family (Cassandra), graph (Neo4j).<br><br><strong>Explanation:</strong> RDBMS suits structured, relational, transactional data. NoSQL suits unstructured/semi-structured, high-volume, variable-schema data.",
  tricky: "Snowflake is a cloud RDBMS that also stores semi-structured data via VARIANT.", clientApp: "Architecture decisions often weigh RDBMS governance vs NoSQL scale.",
  docLink: ""
},
{
  id: "SQL003", section: "SQL", topic: "DDL",
  type: "Coding", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Demonstrate CREATE TABLE, ALTER TABLE (add column, modify type), DROP TABLE and TRUNCATE with examples. What is the difference between DROP and TRUNCATE?",
  answer: "<strong>Short Answer:</strong><pre class=\"code-block\">CREATE TABLE employees (\n  emp_id   INT PRIMARY KEY,\n  name     VARCHAR(100) NOT NULL,\n  salary   DECIMAL(12,2),\n  dept_id  INT\n);\n\nALTER TABLE employees ADD COLUMN email VARCHAR(200);\nALTER TABLE employees ALTER COLUMN salary TYPE DECIMAL(15,2);\n\nTRUNCATE TABLE employees;   -- removes all rows, keeps structure\nDROP TABLE employees;        -- removes table entirely</pre><strong>DROP vs TRUNCATE:</strong> DROP removes the table object; TRUNCATE removes all rows but keeps the structure. TRUNCATE is usually not logged row-by-row (faster, may differ by DBMS and transaction behavior).",
  tricky: "TRUNCATE in Snowflake is auto-committed and cannot be rolled back in the same statement; DROP can be undone via Time Travel.", clientApp: "Schema migrations use ALTER; environment resets use TRUNCATE.",
  docLink: "https://docs.snowflake.com/en/sql-reference/sql/truncate-table"
},
{
  id: "SQL004", section: "SQL", topic: "DDL",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What are constraints in SQL (PRIMARY KEY, UNIQUE, NOT NULL, FOREIGN KEY, CHECK, DEFAULT)? Which are enforced in Snowflake?",
  answer: "<strong>Short Answer:</strong><br>- <strong>PRIMARY KEY:</strong> unique + not null identifier for each row.<br>- <strong>UNIQUE:</strong> all values distinct; NULLs allowed.<br>- <strong>NOT NULL:</strong> column must have a value.<br>- <strong>FOREIGN KEY:</strong> references another table's PK, enforces referential integrity.<br>- <strong>CHECK:</strong> validates values meet a condition (e.g. salary > 0).<br>- <strong>DEFAULT:</strong> value used when not supplied on INSERT.<br><br><strong>Snowflake:</strong> only NOT NULL is enforced. PK, UNIQUE and FK are informational metadata.",
  tricky: "Not enforcing PKs means you can INSERT duplicates; the ETL must guarantee uniqueness.", clientApp: "Always add a DQ check for uniqueness rather than relying on constraints in Snowflake.",
  docLink: "https://docs.snowflake.com/en/sql-reference/constraints-overview"
},
{
  id: "SQL005", section: "SQL", topic: "DML",
  type: "Coding", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Write INSERT, UPDATE (with WHERE), DELETE (with WHERE) statements. What is the danger of missing a WHERE clause?",
  answer: "<pre class=\"code-block\">-- INSERT\nINSERT INTO employees (emp_id, name, salary) VALUES (1, 'Asha', 55000);\n-- Multi-row\nINSERT INTO employees VALUES (2,'Raj',60000),(3,'Priya',70000);\n\n-- UPDATE\nUPDATE employees SET salary = salary * 1.10 WHERE dept_id = 3;\n\n-- DELETE\nDELETE FROM employees WHERE emp_id = 2;</pre><strong>Missing WHERE:</strong> UPDATE without WHERE updates every row; DELETE without WHERE deletes every row. Always preview with SELECT using the same WHERE before executing DML.",
  tricky: "AUTOCOMMIT is ON by default in Snowflake; wrap risky DML in BEGIN/COMMIT.", clientApp: "Data corruption from missing WHERE is a leading production incident type.",
  docLink: ""
},
{
  id: "SQL006", section: "SQL", topic: "DQL",
  type: "Coding", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Show the full SELECT statement structure: SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT. Explain the evaluation order.",
  answer: "<pre class=\"code-block\">SELECT department, COUNT(*) AS headcount, AVG(salary) AS avg_sal\nFROM employees\nWHERE active = TRUE\nGROUP BY department\nHAVING COUNT(*) >= 5\nORDER BY avg_sal DESC\nLIMIT 10;</pre><strong>Logical evaluation order:</strong> FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.<br><br><strong>Explanation:</strong> This differs from the written order. WHERE runs before SELECT, so you cannot use a SELECT alias in WHERE (but you can in ORDER BY in some databases).",
  tricky: "HAVING is evaluated after aggregation so it can use aggregate functions; WHERE cannot.", clientApp: "Understanding evaluation order prevents confusion about alias availability.",
  docLink: ""
},
{
  id: "SQL007", section: "SQL", topic: "DQL",
  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "What is the difference between WHERE and HAVING?",
  answer: "<strong>WHERE</strong> filters rows before grouping; <strong>HAVING</strong> filters groups after aggregation.<pre class=\"code-block\">SELECT dept, COUNT(*) n\nFROM employees\nWHERE salary > 30000       -- row-level filter first\nGROUP BY dept\nHAVING COUNT(*) >= 3;      -- group-level filter after aggregation</pre>",
  tricky: "You cannot use aggregate functions in WHERE (SQL will error).", clientApp: "A very common interview question; interviewers check understanding of evaluation order.",
  docLink: ""
},
{
  id: "SQL008", section: "SQL", topic: "Operators",
  type: "Output Prediction", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Explain AND, OR, NOT, BETWEEN, IN and LIKE. Predict the output: <code>WHERE salary BETWEEN 40000 AND 60000 AND dept IN ('Sales','IT') AND name LIKE 'A%'</code>",
  answer: "<strong>Operators:</strong><br>- AND: all conditions true<br>- OR: at least one true<br>- NOT: negates<br>- BETWEEN: inclusive range<br>- IN: value in a list (equivalent to chained OR)<br>- LIKE: pattern match (% = any chars, _ = one char)<br><br><strong>The WHERE returns rows where salary is 40000-60000 AND dept is Sales or IT AND name starts with A.</strong>",
  tricky: "NOT IN with a subquery containing NULL returns zero rows (three-valued logic UNKNOWN).", clientApp: "LIKE with leading % (e.g. '%son') cannot use index/pruning.",
  docLink: ""
},
{
  id: "SQL009", section: "SQL", topic: "JOINs",
  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Explain INNER, LEFT, RIGHT, FULL OUTER and SELF JOIN. Draw a result-set size comparison.",
  answer: "<strong>Short Answer:</strong><br>- <strong>INNER JOIN:</strong> only matched rows from both sides.<br>- <strong>LEFT JOIN:</strong> all left rows + matched right (NULLs for unmatched right).<br>- <strong>RIGHT JOIN:</strong> all right rows + matched left (NULLs for unmatched left).<br>- <strong>FULL OUTER JOIN:</strong> all rows from both; NULLs where no match.<br>- <strong>SELF JOIN:</strong> table joined to itself (e.g. employee–manager on same table).<br><br><strong>Row count:</strong> FULL OUTER ≥ LEFT/RIGHT ≥ INNER (assuming same data).",
  tricky: "Adding a WHERE predicate on the right-side table of a LEFT JOIN effectively converts it to an INNER JOIN.", clientApp: "LEFT JOIN is the most common in analytics; explain the filter-placement trap.",
  docLink: ""
},
{
  id: "SQL010", section: "SQL", topic: "JOINs",
  type: "Output Prediction", difficulty: "Intermediate", priority: "Must Know", coverage: "Exact TOC",
  question: "Table A has rows id=1,2,3. Table B has rows id=1,3,4. How many rows does each join type return and which are NULL-extended?",
  answer: "<pre class=\"code-block\">INNER JOIN  → 2 rows: (1,1),(3,3)  — id=2 dropped from A, id=4 dropped from B\nLEFT JOIN   → 3 rows: (1,1),(2,NULL),(3,3) — id=2 kept with NULL B side\nRIGHT JOIN  → 3 rows: (1,1),(3,3),(NULL,4) — id=4 kept with NULL A side\nFULL OUTER  → 4 rows: (1,1),(2,NULL),(3,3),(NULL,4)</pre>",
  tricky: "FULL OUTER JOIN is not supported in all databases; use LEFT UNION RIGHT as workaround.", clientApp: "Row-count check after JOIN is a data validation step in every ETL pipeline.",
  docLink: ""
},
{
  id: "SQL011", section: "SQL", topic: "JOINs",
  type: "Troubleshooting", difficulty: "Intermediate", priority: "Must Know", coverage: "Beyond TOC",
  question: "Why can a JOIN unexpectedly double the row count? How do you detect and fix it?",
  answer: "<strong>Cause:</strong> The join key is not unique on one or both sides (many-to-many), creating a Cartesian product for each matching pair.<br><br><strong>Detect:</strong><pre class=\"code-block\">SELECT customer_id, COUNT(*) n\nFROM orders GROUP BY customer_id HAVING COUNT(*) > 1;</pre><strong>Fix:</strong> Deduplicate the non-unique side first (GROUP BY or ROW_NUMBER), or join on a more granular unique key. Don't blindly apply DISTINCT.",
  tricky: "Applying DISTINCT after a join masks the root cause and can hide legitimate duplicate facts.", clientApp: "Row explosion after a dimension join is a classic production incident.",
  docLink: ""
},
{
  id: "SQL012", section: "SQL", topic: "JOINs",
  type: "Coding", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "Write a SELF JOIN to show each employee and their manager's name. Table: employees(emp_id, name, manager_id).",
  answer: "<pre class=\"code-block\">SELECT e.emp_id, e.name AS employee, m.name AS manager\nFROM employees e\nLEFT JOIN employees m ON e.manager_id = m.emp_id;</pre><strong>LEFT JOIN</strong> ensures the CEO (who has no manager) still appears with NULL for manager.",
  tricky: "Use aliases (e, m) to disambiguate the same table.", clientApp: "Org hierarchy queries appear in HR and org-chart dashboards.",
  docLink: ""
},
{
  id: "SQL013", section: "SQL", topic: "Subqueries",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What are subqueries, nested queries and correlated subqueries? Compare EXISTS vs IN for anti-join patterns.",
  answer: "<strong>Subquery:</strong> SELECT inside another SELECT, in WHERE/FROM/SELECT.<br><strong>Correlated:</strong> references outer query per row (evaluated per row).<br><strong>Nested:</strong> subquery returns a scalar/set used in the outer query.<br><br><strong>EXISTS vs IN:</strong><pre class=\"code-block\">-- IN (fails when subquery returns NULL)\nSELECT * FROM A WHERE id IN (SELECT id FROM B WHERE condition);\n-- NOT IN danger: if B has NULL, returns 0 rows\n\n-- EXISTS (safe with NULLs, stops at first match)\nSELECT * FROM A WHERE EXISTS (\n  SELECT 1 FROM B WHERE B.id = A.id AND condition);</pre>",
  tricky: "NOT IN with a NULL in the subquery returns UNKNOWN for all rows, giving empty result. Always use NOT EXISTS for anti-join.", clientApp: "Data quality checks use NOT EXISTS to find orphaned records.",
  docLink: ""
},
{
  id: "SQL014", section: "SQL", topic: "NULL Logic",
  type: "Tricky", difficulty: "Intermediate", priority: "Must Know", coverage: "Beyond TOC",
  question: "Why does NOT IN return zero rows when the subquery contains NULL? Explain SQL three-valued logic.",
  answer: "<strong>Three-valued logic:</strong> SQL comparisons return TRUE, FALSE, or <strong>UNKNOWN</strong>. NULL = NULL → UNKNOWN; NULL &lt;&gt; NULL → UNKNOWN. WHERE keeps only TRUE rows.<br><br><pre class=\"code-block\">SELECT * FROM t WHERE id NOT IN (1, 2, NULL);\n-- id=3: 3 NOT IN (1,2,NULL) → 3&lt;&gt;1 AND 3&lt;&gt;2 AND 3&lt;&gt;NULL\n-- 3&lt;&gt;NULL = UNKNOWN → entire AND = UNKNOWN → row dropped</pre><strong>Fix:</strong> Use NOT EXISTS or filter NULLs: <code>WHERE id NOT IN (SELECT id FROM b WHERE id IS NOT NULL)</code>",
  tricky: "This is the number-one SQL null trap. Know it cold for interviews.", clientApp: "Data exclusion logic (blacklists, permission checks) often uses NOT IN.",
  docLink: ""
},
{
  id: "SQL015", section: "SQL", topic: "Transactions",
  type: "Conceptual", difficulty: "Intermediate", priority: "Must Know", coverage: "Exact TOC",
  question: "Explain ACID properties and the role of COMMIT, ROLLBACK and SAVEPOINT.",
  answer: "<strong>ACID:</strong><br>- <strong>Atomicity:</strong> all-or-nothing; partial success rolls back.<br>- <strong>Consistency:</strong> transaction moves DB from one valid state to another.<br>- <strong>Isolation:</strong> concurrent transactions don't interfere.<br>- <strong>Durability:</strong> committed data survives failures.<br><br><pre class=\"code-block\">BEGIN;\n  UPDATE accounts SET balance = balance - 1000 WHERE id = 1;\n  SAVEPOINT after_debit;\n  UPDATE accounts SET balance = balance + 1000 WHERE id = 2;\n  -- if error:\n  ROLLBACK TO after_debit;  -- undo only step 2\nCOMMIT;</pre>",
  tricky: "In Snowflake, DDL auto-commits any open transaction; don't mix DDL inside multi-statement transactions.", clientApp: "Financial and reconciliation pipelines require explicit transaction control.",
  docLink: "https://docs.snowflake.com/en/sql-reference/transactions"
},
{
  id: "SQL016", section: "SQL", topic: "Transactions",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Explain transaction isolation levels: READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE. What problems does each prevent?",
  answer: "<strong>Problems:</strong> Dirty Read, Non-Repeatable Read, Phantom Read.<br><br><table><tr><th>Level</th><th>Dirty</th><th>Non-Repeat</th><th>Phantom</th></tr><tr><td>READ UNCOMMITTED</td><td>✗</td><td>✗</td><td>✗</td></tr><tr><td>READ COMMITTED</td><td>✓</td><td>✗</td><td>✗</td></tr><tr><td>REPEATABLE READ</td><td>✓</td><td>✓</td><td>✗</td></tr><tr><td>SERIALIZABLE</td><td>✓</td><td>✓</td><td>✓</td></tr></table><strong>Snowflake:</strong> uses READ COMMITTED by default.",
  tricky: "Higher isolation = more locking = lower concurrency. Analytics workloads typically accept READ COMMITTED.", clientApp: "Match isolation level to data-sensitivity requirements.",
  docLink: ""
},
{
  id: "SQL017", section: "SQL", topic: "Security",
  type: "Coding", difficulty: "Intermediate", priority: "Must Know", coverage: "Exact TOC",
  question: "Explain GRANT and REVOKE. Show syntax for granting SELECT on a table, and revoking it. Include server backups and roles.",
  answer: "<pre class=\"code-block\">-- Grant SELECT to a role\nGRANT SELECT ON TABLE sales TO ROLE analyst;\n-- Grant multiple privileges\nGRANT INSERT, UPDATE ON TABLE orders TO ROLE etl_role;\n-- Object-level\nGRANT USAGE ON DATABASE mydb TO ROLE analyst;\n\n-- Revoke\nREVOKE DELETE ON TABLE orders FROM ROLE etl_role;\n\n-- Create role and assign\nCREATE ROLE reporting;\nGRANT ROLE reporting TO USER alice;</pre><strong>Server backups:</strong> use ACCOUNTADMIN or dedicated backup roles. Least-privilege: grant only what is needed.",
  tricky: "In Snowflake, SELECT also requires USAGE on the database and schema.", clientApp: "RBAC design is the first security conversation on every Snowflake project.",
  docLink: "https://docs.snowflake.com/en/sql-reference/sql/grant"
},
{
  id: "SQL018", section: "SQL", topic: "Set Operations",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "Explain UNION, UNION ALL, INTERSECT, MINUS/EXCEPT with a worked example. When do you prefer UNION ALL?",
  answer: "<pre class=\"code-block\">-- UNION removes duplicates; UNION ALL keeps them (faster)\nSELECT id FROM A\nUNION ALL\nSELECT id FROM B;\n\n-- INTERSECT: rows in both\nSELECT id FROM A INTERSECT SELECT id FROM B;\n\n-- MINUS/EXCEPT: in A but not in B\nSELECT id FROM A EXCEPT SELECT id FROM B;</pre><strong>Prefer UNION ALL</strong> when you know there are no duplicates or you want them; deduplication adds overhead.",
  tricky: "INTERSECT and EXCEPT imply DISTINCT; INTERSECT ALL / EXCEPT ALL preserve duplicates (supported in PostgreSQL, Snowflake).", clientApp: "Combining multiple extract feeds before load.",
  docLink: ""
},
{
  id: "SQL019", section: "SQL", topic: "Aliases",
  type: "Coding", difficulty: "Beginner", priority: "High Priority", coverage: "Exact TOC",
  question: "What are column and table aliases? Where can you use an alias in a query?",
  answer: "<pre class=\"code-block\">-- Column alias\nSELECT first_name || ' ' || last_name AS full_name,\n       salary * 12 AS annual_salary\nFROM employees e   -- table alias\nJOIN departments d ON e.dept_id = d.id;</pre><strong>Alias scope:</strong> Column aliases defined in SELECT are available in ORDER BY and (in some databases) HAVING, but NOT in WHERE or GROUP BY (logical evaluation order).<br>Snowflake allows aliases in GROUP BY and ORDER BY.",
  tricky: "In strict SQL, you cannot use a SELECT alias in GROUP BY; repeat the expression or use a subquery.", clientApp: "Aliases make generated columns readable in BI tools.",
  docLink: ""
},
{
  id: "SQL020", section: "SQL", topic: "Aggregate Functions",
  type: "Output Prediction", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "Given rows: (1,10),(1,10),(2,NULL), what do COUNT(*), COUNT(value), COUNT(DISTINCT value), SUM(value), AVG(value) return?",
  answer: "<pre class=\"code-block\">COUNT(*)            = 3    -- all rows including NULL\nCOUNT(value)        = 2    -- ignores NULL\nCOUNT(DISTINCT value)= 1   -- unique non-null: only 10\nSUM(value)          = 20   -- ignores NULL\nAVG(value)          = 10   -- 20/2 (ignores NULL, not 20/3)</pre>",
  tricky: "AVG divides by the count of non-NULL values, not total rows. This can skew averages when NULLs mean 'zero'.", clientApp: "Choose AVG vs SUM/NULLIF carefully in financial metrics.",
  docLink: ""
},
{
  id: "SQL021", section: "SQL", topic: "Views & Indexing",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What is a VIEW? Contrast regular view, materialized view and Snowflake dynamic table. When does a view hurt performance?",
  answer: "<strong>Regular view:</strong> stored query, no data, executes on each query.<br><strong>Materialized view:</strong> stores computed result; auto-refreshed (Enterprise); restricted to single-table in Snowflake.<br><strong>Dynamic table:</strong> any query including joins; refreshed to target lag; serverless.<br><br><pre class=\"code-block\">CREATE VIEW v_active_orders AS\nSELECT * FROM orders WHERE status = 'ACTIVE';\n\nCREATE MATERIALIZED VIEW mv_sales AS\nSELECT region, SUM(amount) s FROM sales GROUP BY region;</pre><strong>Performance risk:</strong> layering views on views hides complexity; the optimizer must expand all layers at query time.",
  tricky: "Nesting 5+ views can explode query complexity and prevent pruning.", clientApp: "Views are the semantic layer in BI; dynamic tables replace scheduled refresh tasks.",
  docLink: "https://docs.snowflake.com/en/user-guide/views-materialized"
},
{
  id: "SQL022", section: "SQL", topic: "Views & Indexing",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "Why doesn't Snowflake use traditional B-tree indexes? What replaces them?",
  answer: "<strong>Traditional indexes</strong> pre-sort data for point-lookups on OLTP row stores. Snowflake uses columnar micro-partitions with per-partition metadata (min, max, distinct count) for automatic <strong>pruning</strong>.<br><br><strong>Alternatives:</strong><br>- <strong>Clustering keys:</strong> reorder micro-partitions for range filters on high-cardinality columns.<br>- <strong>Search Optimization Service:</strong> selective point-lookups.<br>- <strong>Materialized views:</strong> pre-aggregated access patterns.",
  tricky: "Developers from OLTP backgrounds waste time looking for CREATE INDEX in Snowflake.", clientApp: "Explain this paradigm shift when onboarding clients migrating from Oracle/SQL Server.",
  docLink: "https://docs.snowflake.com/en/user-guide/tables-clustering-keys"
},
{
  id: "SQL023", section: "SQL", topic: "Window Functions",
  type: "Conceptual", difficulty: "Intermediate", priority: "Must Know", coverage: "Exact TOC",
  question: "Compare ROW_NUMBER(), RANK() and DENSE_RANK(). Show output for salaries: 5000, 5000, 4000, 3000.",
  answer: "<pre class=\"code-block\">salary  ROW_NUMBER  RANK  DENSE_RANK\n5000       1         1       1\n5000       2         1       1\n4000       3         3       2\n3000       4         4       3</pre><strong>ROW_NUMBER:</strong> unique sequential; no ties.<br><strong>RANK:</strong> ties share rank; next rank skips.<br><strong>DENSE_RANK:</strong> ties share rank; next rank does NOT skip.",
  tricky: "When exactly one winner is needed (top-1 per group), use ROW_NUMBER with a deterministic ORDER BY tie-breaker.", clientApp: "Deduplication uses ROW_NUMBER; leaderboards use RANK or DENSE_RANK.",
  docLink: "https://docs.snowflake.com/en/sql-reference/functions/rank"
},
{
  id: "SQL024", section: "SQL", topic: "Window Functions",
  type: "Coding", difficulty: "Intermediate", priority: "Must Know", coverage: "Exact TOC",
  question: "Write queries using LEAD() and LAG() to show each order's date and the previous/next order date for the same customer.",
  answer: "<pre class=\"code-block\">SELECT order_id, customer_id, order_date,\n  LAG(order_date)  OVER (PARTITION BY customer_id ORDER BY order_date) AS prev_order,\n  LEAD(order_date) OVER (PARTITION BY customer_id ORDER BY order_date) AS next_order,\n  DATEDIFF('day',\n    LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date),\n    order_date) AS days_since_prev\nFROM orders;</pre><strong>NULL:</strong> first row has NULL prev; last row has NULL next.",
  tricky: "LAG/LEAD accept an offset (default 1) and a default value for the NULL case: LAG(col, 1, 0).", clientApp: "Days-between-orders is a core customer lifetime value metric.",
  docLink: "https://docs.snowflake.com/en/sql-reference/functions/lead"
},
{
  id: "SQL025", section: "SQL", topic: "Window Functions",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "Write a query to find the top 3 products by revenue per region using window functions.",
  answer: "<pre class=\"code-block\">WITH ranked AS (\n  SELECT region, product_id, revenue,\n    DENSE_RANK() OVER (PARTITION BY region ORDER BY revenue DESC) AS dr\n  FROM product_sales\n)\nSELECT region, product_id, revenue\nFROM ranked\nWHERE dr <= 3\nORDER BY region, dr;</pre>Or in Snowflake using QUALIFY:<pre class=\"code-block\">SELECT region, product_id, revenue\nFROM product_sales\nQUALIFY DENSE_RANK() OVER (PARTITION BY region ORDER BY revenue DESC) <= 3;</pre>",
  tricky: "Use DENSE_RANK if ties should both appear in top-3; ROW_NUMBER to pick exactly 3.", clientApp: "Standard dashboard requirement: top-N per category.",
  docLink: "https://docs.snowflake.com/en/sql-reference/constructs/qualify"
},
{
  id: "SQL026", section: "SQL", topic: "Window Functions",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Write queries for: (a) running total of sales by month, (b) moving 3-month average, (c) percentage of row vs partition total.",
  answer: "<pre class=\"code-block\">-- (a) running total\nSELECT month, sales,\n  SUM(sales) OVER (ORDER BY month\n    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total\nFROM monthly_sales;\n\n-- (b) 3-month moving average\nSELECT month, sales,\n  AVG(sales) OVER (ORDER BY month\n    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS moving_avg_3m\nFROM monthly_sales;\n\n-- (c) % of partition total\nSELECT region, product, revenue,\n  ROUND(revenue / SUM(revenue) OVER (PARTITION BY region) * 100, 2) AS pct_of_region\nFROM sales;</pre>",
  tricky: "ROWS uses physical row positions; RANGE uses logical value range (can include more rows for ties).", clientApp: "Running totals and moving averages appear in every BI dashboard.",
  docLink: ""
},
{
  id: "SQL027", section: "SQL", topic: "Window Frames",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Explain ROWS vs RANGE window frames. Show a case where they differ.",
  answer: "<strong>ROWS:</strong> counts physical row positions in the partition (exact row boundaries).<br><strong>RANGE:</strong> includes rows with values that fall within a range relative to the current row (can pull in more rows when there are ties).<pre class=\"code-block\">-- Table: (dt=Jan, amt=100),(dt=Jan, amt=100),(dt=Feb, amt=200)\n\n-- ROWS: exactly current row and 1 before\nSUM(amt) OVER (ORDER BY dt ROWS BETWEEN 1 PRECEDING AND CURRENT ROW)\n-- Feb row: 100+200=300\n\n-- RANGE: all rows with same dt value as window boundary\nSUM(amt) OVER (ORDER BY dt RANGE BETWEEN CURRENT ROW AND CURRENT ROW)\n-- Feb row: 200  (only Feb)\n-- Jan rows: both Jan rows are in the 'CURRENT ROW' range for each other</pre>",
  tricky: "RANGE is default for ORDER BY + no explicit frame; ROWS is usually what you intend.", clientApp: "Miscounting can happen when the default RANGE frame includes unexpected rows.",
  docLink: ""
},
{
  id: "SQL028", section: "SQL", topic: "CTEs",
  type: "Coding", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What is a CTE (WITH clause)? Compare it to subqueries and temporary tables. Write a CTE example for multi-step logic.",
  answer: "<pre class=\"code-block\">WITH high_value AS (\n  SELECT customer_id, SUM(amount) AS total\n  FROM orders\n  GROUP BY customer_id\n  HAVING SUM(amount) > 10000\n),\nenriched AS (\n  SELECT h.customer_id, c.name, h.total\n  FROM high_value h\n  JOIN customers c USING (customer_id)\n)\nSELECT * FROM enriched ORDER BY total DESC;</pre><strong>CTE vs subquery:</strong> CTEs are named, reusable within the statement, more readable. <strong>CTE vs temp table:</strong> CTE is query-scoped; temp table persists for the session.",
  tricky: "In most databases (including Snowflake) a CTE is re-evaluated each time it is referenced, not cached. Use a temp table for reuse.", clientApp: "CTEs replace deeply nested subqueries in complex ETL logic.",
  docLink: "https://docs.snowflake.com/en/sql-reference/constructs/with"
},
{
  id: "SQL029", section: "SQL", topic: "CTEs",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "Write a recursive CTE to traverse an employee-manager hierarchy and compute depth level.",
  answer: "<pre class=\"code-block\">WITH RECURSIVE org AS (\n  -- Anchor: top-level (no manager)\n  SELECT emp_id, name, manager_id, 0 AS depth\n  FROM employees\n  WHERE manager_id IS NULL\n\n  UNION ALL\n\n  -- Recursive: join children\n  SELECT e.emp_id, e.name, e.manager_id, o.depth + 1\n  FROM employees e\n  JOIN org o ON e.manager_id = o.emp_id\n)\nSELECT emp_id, name, depth FROM org ORDER BY depth, name;</pre>",
  tricky: "Always define a stopping condition (base case or MAXRECURSION limit) to prevent infinite loops on cyclic data.", clientApp: "Org-chart and bill-of-materials (BOM) hierarchies require recursive CTEs.",
  docLink: "https://docs.snowflake.com/en/sql-reference/constructs/with#recursive-common-table-expressions"

{
  id: "SQL030", section: "SQL", topic: "CASE Expressions",
  type: "Coding", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "Write a CASE expression to bucket salary into 'Junior/Mid/Senior'. Also show conditional aggregation with CASE.",
  answer: "<pre class=\"code-block\">-- Salary bucket\nSELECT name, salary,\n  CASE\n    WHEN salary < 30000 THEN 'Junior'\n    WHEN salary < 60000 THEN 'Mid'\n    ELSE 'Senior'\n  END AS grade\nFROM employees;\n\n-- Conditional aggregation (pivot-like)\nSELECT dept,\n  COUNT(CASE WHEN status='Active'   THEN 1 END) AS active_count,\n  COUNT(CASE WHEN status='Inactive' THEN 1 END) AS inactive_count,\n  SUM(CASE WHEN status='Active'     THEN salary ELSE 0 END) AS active_payroll\nFROM employees\nGROUP BY dept;</pre>",

{
  id: "SQL031", section: "SQL", topic: "Stored Procedures",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "What is a stored procedure? Write a Snowflake Scripting procedure that performs an incremental load and returns a status string.",
  answer: "<pre class=\"code-block\">CREATE OR REPLACE PROCEDURE load_incremental(batch_date DATE)\nRETURNS STRING\nLANGUAGE SQL\nEXECUTE AS OWNER\nAS\n$$\nDECLARE\n  rows_loaded INT DEFAULT 0;\nBEGIN\n  MERGE INTO orders_core t\n  USING (SELECT * FROM orders_stage WHERE order_date = :batch_date) s\n    ON t.order_id = s.order_id\n  WHEN MATCHED THEN UPDATE SET t.status = s.status\n  WHEN NOT MATCHED THEN INSERT VALUES (s.order_id, s.order_date, s.status);\n\n  rows_loaded := SQLROWCOUNT;\n  RETURN 'Loaded ' || rows_loaded || ' rows for ' || batch_date;\nEND;\n$$;\nCALL load_incremental('2025-01-15');</pre>",
  tricky: "Inside a Snowflake procedure SQL, bind variables with : prefix (e.g. :batch_date).", clientApp: "Stored procedures encapsulate repeatable ETL logic callable from tasks or orchestrators.",
  docLink: "https://docs.snowflake.com/en/developer-guide/stored-procedure/stored-procedures-overview"
},
{
  id: "SQL032", section: "SQL", topic: "Stored Procedures",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "What is a database trigger? Give two use cases and explain why triggers are used sparingly in data warehouses.",
  answer: "<strong>Trigger:</strong> SQL code that auto-executes BEFORE/AFTER an INSERT, UPDATE or DELETE.<br><br><strong>Use cases:</strong> (1) Audit log: record old/new values on salary change. (2) Enforce business rule: prevent negative balance.<br><br><pre class=\"code-block\">CREATE TRIGGER audit_salary\nAFTER UPDATE OF salary ON employees\nFOR EACH ROW\nINSERT INTO salary_audit(emp_id, old_sal, new_sal, changed_at)\nVALUES (NEW.emp_id, OLD.salary, NEW.salary, NOW());</pre><strong>Data warehouse caution:</strong> triggers add hidden overhead, complicate debugging, and are not well-supported in cloud warehouses (Snowflake has limited trigger support).",
  tricky: "Snowflake streams + tasks replace trigger-like patterns in a more visible, manageable way.", clientApp: "OLTP audit trails; avoid in warehouse—use stream-based CDC instead.",
  docLink: ""
},
{
  id: "SQL033", section: "SQL", topic: "Query Optimization",
  type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "A query runs in 120 seconds. Walk through a systematic tuning approach.",
  answer: "<strong>Step 1:</strong> Baseline — capture query text, runtime, bytes scanned, partitions scanned.<br><strong>Step 2:</strong> Inspect execution plan (EXPLAIN / Query Profile) — identify expensive nodes: full scans, join explosions, spill to disk.<br><strong>Step 3:</strong> Check pruning — is a date/key filter pruning partitions?<br><strong>Step 4:</strong> Check join selectivity — are keys unique? Is the join order optimal?<br><strong>Step 5:</strong> Remove unnecessary columns (SELECT *), apply filters early.<br><strong>Step 6:</strong> Consider clustering or search optimization on the filter column.<br><strong>Step 7:</strong> Check warehouse size — is there spill to remote storage?<br><strong>Step 8:</strong> Test one change at a time; compare plan and runtime.",
  tricky: "Do not resize the warehouse as first step; it masks logic bugs and costs more.", clientApp: "Systematic tuning is a key client deliverable in performance projects.",
  docLink: "https://docs.snowflake.com/en/user-guide/ui-query-profile"
},
{
  id: "SQL034", section: "SQL", topic: "Query Optimization",
  type: "Debugging", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Explain query execution plans. What does a full table scan vs partition pruning look like in Snowflake's Query Profile?",
  answer: "<strong>Execution plan:</strong> shows operations the engine will perform and their estimated cost. In Snowflake — Query Profile DAG of nodes.<br><br><strong>Full scan:</strong> 'Partitions scanned: 1000 / 1000' — no pruning benefit.<br><strong>Pruned:</strong> 'Partitions scanned: 12 / 1000' — 98.8% skipped.<br><br><strong>Common bad signs:</strong> JOIN exploding rows (output >> input), Bytes spilled to local/remote disk, 'Expressions' consuming most time.<pre class=\"code-block\">-- Force disable result cache to get real profile:\nALTER SESSION SET USE_CACHED_RESULT = FALSE;\nSELECT /* your query */;</pre>",
  tricky: "Non-sargable predicates (WHERE YEAR(ts)=2025) prevent pruning; use range predicates instead.", clientApp: "Query Profile is the primary tool in any Snowflake performance engagement.",
  docLink: "https://docs.snowflake.com/en/user-guide/ui-query-profile"
},
{
  id: "SQL035", section: "SQL", topic: "Temporary Tables",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Exact TOC",
  question: "When should you use a temporary table vs a CTE vs a permanent staging table for multi-step ETL logic?",
  answer: "<strong>CTE:</strong> single query, named sub-step, no storage overhead, re-evaluated each reference.<br><strong>Temp table:</strong> session-scoped, materialised once, reusable in multiple statements, ideal for intermediate ETL results that are queried several times.<br><strong>Permanent staging:</strong> persists across sessions, auditable, retryable; needed for incremental checkpoints.<pre class=\"code-block\">-- Temp table (Snowflake)\nCREATE TEMPORARY TABLE clean_orders AS\n  SELECT * FROM raw_orders WHERE amount > 0;\nSELECT COUNT(*) FROM clean_orders;   -- reuses materialised result</pre>",
  tricky: "Temp tables drop at session end with no data loss warning; never use them as the only checkpoint.", clientApp: "Multi-step SQL transformations with reuse benefit from temp tables over repeated CTEs.",
  docLink: ""
},
{
  id: "SQL036", section: "SQL", topic: "Deduplication",
  type: "Coding", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "Write a query to deduplicate a table by business key (order_id), keeping the latest row by updated_at.",
  answer: "<pre class=\"code-block\">-- Using ROW_NUMBER CTE\nWITH ranked AS (\n  SELECT *,\n    ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) AS rn\n  FROM orders_raw\n)\nSELECT order_id, customer_id, amount, status\nFROM ranked\nWHERE rn = 1;\n\n-- Snowflake QUALIFY shorthand\nSELECT order_id, customer_id, amount, status\nFROM orders_raw\nQUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1;</pre>",
  tricky: "Do not use SELECT DISTINCT * to dedup if rows differ in any column (like updated_at).", clientApp: "Landing zone dedup before MERGE into curated layer is a standard ELT step.",
  docLink: ""
},
{
  id: "SQL037", section: "SQL", topic: "Gaps & Islands",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Write a query to find 'islands' — consecutive date ranges of activity — and 'gaps' between them for each user.",
  answer: "<pre class=\"code-block\">-- Gaps & Islands: group consecutive dates\nWITH numbered AS (\n  SELECT user_id, activity_date,\n    ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY activity_date) AS rn\n  FROM user_activity\n),\ngrouped AS (\n  SELECT user_id, activity_date,\n    DATEADD('day', -rn, activity_date) AS grp  -- same grp if consecutive\n  FROM numbered\n)\nSELECT user_id,\n  MIN(activity_date) AS island_start,\n  MAX(activity_date) AS island_end,\n  COUNT(*) AS days_active\nFROM grouped\nGROUP BY user_id, grp\nORDER BY user_id, island_start;</pre>",
  tricky: "The trick: subtracting the row number from the date gives the same date for consecutive rows.", clientApp: "Subscription tenure analysis, login streaks, SLA continuous coverage checks.",
  docLink: ""
},
{

  answer: "<pre class=\"code-block\">-- Option 1: DENSE_RANK\nSELECT salary FROM (\n  SELECT DISTINCT salary,\n    DENSE_RANK() OVER (ORDER BY salary DESC) AS dr\n  FROM employees\n) WHERE dr = 2;\n\n-- Option 2: Subquery (portable)\nSELECT MAX(salary)\nFROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);</pre>",

{

  type: "Coding", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Write a MERGE (upsert) statement to load daily sales data into a target table: update if key exists, insert if new, delete if flagged.",
  answer: "<pre class=\"code-block\">MERGE INTO sales_target t\nUSING daily_sales_stage s\n  ON t.sale_id = s.sale_id\nWHEN MATCHED AND s.is_deleted = TRUE\n  THEN DELETE\nWHEN MATCHED AND s.is_deleted = FALSE\n  THEN UPDATE SET\n    t.amount     = s.amount,\n    t.updated_at = s.updated_at\nWHEN NOT MATCHED AND s.is_deleted = FALSE\n  THEN INSERT (sale_id, customer_id, amount, sale_date, updated_at)\n       VALUES (s.sale_id, s.customer_id, s.amount, s.sale_date, s.updated_at);</pre>",

{
  id: "SQL040", section: "SQL", topic: "MERGE / UPSERT",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "What are database dialect differences in MERGE/UPSERT syntax? Compare Snowflake, PostgreSQL, MySQL and SQL Server.",
  answer: "<strong>Snowflake:</strong> MERGE INTO ... USING ... ON ... WHEN MATCHED / WHEN NOT MATCHED.<br><strong>PostgreSQL:</strong> INSERT ... ON CONFLICT (key) DO UPDATE SET ... (INSERT ... ON CONFLICT syntax; MERGE added in PG 15).<br><strong>MySQL:</strong> INSERT ... ON DUPLICATE KEY UPDATE ... or REPLACE INTO.<br><strong>SQL Server:</strong> MERGE (same syntax as Snowflake but has known edge cases with concurrency).<pre class=\"code-block\">-- PostgreSQL upsert\nINSERT INTO t(id, val) VALUES (1, 'x')\nON CONFLICT (id) DO UPDATE SET val = EXCLUDED.val;</pre>",
  tricky: "MySQL REPLACE INTO deletes the old row and inserts new; it resets auto-increment and fires DELETE triggers.", clientApp: "When migrating from RDBMS to Snowflake, rewrite dialect-specific upsert syntax.",
  docLink: ""
},
{
  id: "SQL041", section: "SQL", topic: "Incremental Loads",
  type: "Architecture", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "Design a safe, restartable incremental load pattern using a watermark table.",
  answer: "<pre class=\"code-block\">-- 1. Read last watermark\nSELECT max_updated_at\nFROM etl_control\nWHERE job_name = 'orders_load';\n\n-- 2. Extract changed rows with an overlap window (handles late commits)\nINSERT INTO orders_stage\nSELECT * FROM source.orders\nWHERE updated_at > :last_run - INTERVAL '15 minutes'  -- overlap\n  AND updated_at <= :current_run;\n\n-- 3. Upsert into target\nMERGE INTO orders_core ...\n\n-- 4. Commit watermark ONLY after successful MERGE\nUPDATE etl_control\nSET max_updated_at = :current_run, status = 'SUCCESS'\nWHERE job_name = 'orders_load';</pre>",
  tricky: "Never advance the watermark before the target write commits — this is the #1 cause of missed records.", clientApp: "This pattern and its trade-offs come up in almost every ETL interview.",
  docLink: ""
},
{

  question: "Show COALESCE, NULLIF, NVL, NVL2 and IFNULL with examples. When would NULLIF be useful?",
  answer: "<pre class=\"code-block\">-- COALESCE: first non-null\nSELECT COALESCE(phone, mobile, 'No contact') FROM customers;\n\n-- NULLIF: returns NULL if two values equal (prevents div-by-zero)\nSELECT total / NULLIF(qty, 0) AS unit_price FROM orders;\n\n-- NVL (Oracle/Snowflake): 2-arg COALESCE\nSELECT NVL(discount, 0) FROM orders;\n\n-- NVL2: if not null → val1, if null → val2\nSELECT NVL2(promo_code, 'Has promo', 'No promo') FROM orders;\n\n-- IFNULL: synonym for NVL in Snowflake/MySQL\nSELECT IFNULL(email, 'unknown@x.com') FROM users;</pre>",
  tricky: "COALESCE evaluates all arguments; use CASE for conditional short-circuit in expensive expressions.", clientApp: "NULL handling is essential in every data transformation.",
  docLink: ""
},

{

{

  question: "Explain SELECT DISTINCT, LIMIT, OFFSET and TOP. Why is deep OFFSET slow?",

{
  id: "SQL048", section: "SQL", topic: "CROSS JOIN",
  type: "Conceptual", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "What is a CROSS JOIN? Give a legitimate use case. What is a LATERAL join?",
  answer: "<strong>CROSS JOIN:</strong> Cartesian product — every row in A paired with every row in B. m×n rows.<pre class=\"code-block\">-- Generate all date-product combinations\nSELECT d.date, p.product_id\nFROM dim_date d\nCROSS JOIN products p\nWHERE d.date BETWEEN '2025-01-01' AND '2025-12-31';</pre><strong>LATERAL JOIN (Snowflake LATERAL FLATTEN):</strong> allows the right-side expression to reference columns from the left side — used for unnesting arrays/JSON.<pre class=\"code-block\">SELECT o.id, f.value AS item\nFROM orders o, LATERAL FLATTEN(INPUT => o.items) f;</pre>",
  tricky: "An accidental CROSS JOIN (missing ON clause) with large tables causes resource exhaustion.", clientApp: "LATERAL FLATTEN is the primary tool for processing VARIANT arrays in Snowflake.",
  docLink: "https://docs.snowflake.com/en/sql-reference/functions/flatten"
},
{
  id: "SQL049", section: "SQL", topic: "Semi/Anti Joins",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Explain semi-join and anti-join patterns. Show SQL implementations using EXISTS and NOT EXISTS.",
  answer: "<strong>Semi-join:</strong> return rows from A where a match exists in B (do not add B columns).<pre class=\"code-block\">-- Semi-join: customers who have at least one order\nSELECT c.* FROM customers c\nWHERE EXISTS (\n  SELECT 1 FROM orders o WHERE o.customer_id = c.id);</pre><strong>Anti-join:</strong> return rows from A where no match exists in B.<pre class=\"code-block\">-- Anti-join: customers with no orders\nSELECT c.* FROM customers c\nWHERE NOT EXISTS (\n  SELECT 1 FROM orders o WHERE o.customer_id = c.id);</pre>Equivalent LEFT JOIN anti-join:<pre class=\"code-block\">SELECT c.* FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.customer_id IS NULL;</pre>",
  tricky: "NOT IN is not equivalent to NOT EXISTS when NULLs are present. Use NOT EXISTS.", clientApp: "Anti-join finds orphaned facts, missing dimensions and records to load.",
  docLink: ""
},
{
  id: "SQL050", section: "SQL", topic: "Aggregation Edge Cases",
  type: "Tricky", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "GROUP BY vs GROUP BY ROLLUP vs GROUP BY CUBE vs GROUPING SETS — explain with an example.",
  answer: "<pre class=\"code-block\">-- Regular GROUP BY\nSELECT region, product, SUM(sales)\nFROM sales GROUP BY region, product;\n\n-- ROLLUP: subtotals at each level + grand total\nSELECT region, product, SUM(sales)\nFROM sales GROUP BY ROLLUP(region, product);\n-- rows: (region,product), (region,NULL), (NULL,NULL)\n\n-- CUBE: all combinations of subtotals\nGROUP BY CUBE(region, product);\n-- rows: all ROLLUP combos + (NULL,product)\n\n-- GROUPING SETS: specify exactly which aggregations you want\nGROUP BY GROUPING SETS((region,product),(region),(product),());</pre>",
  tricky: "NULL in ROLLUP/CUBE result means 'all'; use GROUPING() function to distinguish from real NULLs.", clientApp: "Reporting pipelines that need row, subtotal and grand total in one query.",
  docLink: "https://docs.snowflake.com/en/sql-reference/constructs/group-by"
},

{
  id: "SQL056", section: "SQL", topic: "Advanced Analytics",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "Build a SQL inventory dashboard query showing: current stock, reorder alert (stock < min), last restock date, and days of supply at current burn rate.",
  answer: "<pre class=\"code-block\">WITH daily_usage AS (\n  SELECT product_id,\n    AVG(qty_sold) AS avg_daily_sold\n  FROM daily_sales\n  WHERE sale_date >= DATEADD('day', -30, CURRENT_DATE())\n  GROUP BY product_id\n),\nlast_restock AS (\n  SELECT product_id,\n    MAX(restock_date) AS last_restock_date\n  FROM restocks\n  GROUP BY product_id\n)\nSELECT\n  i.product_id, p.name,\n  i.current_stock,\n  i.min_stock_level,\n  CASE WHEN i.current_stock < i.min_stock_level THEN 'REORDER' ELSE 'OK' END AS alert,\n  r.last_restock_date,\n  ROUND(i.current_stock / NULLIF(d.avg_daily_sold, 0)) AS days_of_supply\nFROM inventory i\nJOIN products p USING (product_id)\nLEFT JOIN daily_usage d USING (product_id)\nLEFT JOIN last_restock r USING (product_id)\nORDER BY i.current_stock / NULLIF(d.avg_daily_sold, 0) ASC;</pre>",
  tricky: "NULLIF prevents division by zero when a product had no recent sales.", clientApp: "Inventory and supply-chain dashboards are a common client use case.",
  docLink: ""
},
{
  id: "SQL057", section: "SQL", topic: "Execution Plans",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "What is an execution plan and how do you read it? List three warning signs in a Snowflake Query Profile.",
  answer: "<strong>Execution plan:</strong> the sequence of operations (scan, join, aggregate, sort) the database engine will perform, with estimated/actual cost per step.<br><br><strong>Read it:</strong> bottom-up (leaves = scans, top = final output); widest/darkest nodes = most expensive.<br><br><strong>Three red flags in Snowflake Query Profile:</strong><br>1. <strong>Partitions scanned ≈ total</strong> — poor pruning, add filter/clustering.<br>2. <strong>Bytes spilled to remote storage</strong> — warehouse too small or join explosion.<br>3. <strong>Output rows >> Input rows on a join node</strong> — many-to-many join, dedup source.",
  tricky: "Profile shows actual; EXPLAIN shows estimated—they can differ significantly when statistics are stale.", clientApp: "Reading the profile is the first step in every Snowflake performance engagement.",
  docLink: "https://docs.snowflake.com/en/user-guide/ui-query-profile"
},
{
  id: "SQL058", section: "SQL", topic: "Working with Large Datasets",
  type: "Architecture", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "What techniques do you use to work efficiently with very large tables (billions of rows) in SQL?",
  answer: "<strong>1. Filter early and specifically</strong> — push selective WHERE conditions to reduce scanned data.<br><strong>2. Projection</strong> — SELECT only needed columns (columnar stores benefit greatly).<br><strong>3. Partition/Cluster by filter key</strong> — ensures pruning.<br><strong>4. Avoid functions on filter columns</strong> — use sargable predicates.<br><strong>5. Pre-aggregate in CTEs</strong> — reduce cardinality before joins.<br><strong>6. Use QUALIFY for dedup</strong> — avoids materialising large intermediate sets.<br><strong>7. Incremental processing</strong> — never reprocess the whole table when only new rows changed.<br><strong>8. Sample for exploration:</strong><pre class=\"code-block\">SELECT * FROM billion_row_table SAMPLE (0.1);  -- 0.1% sample</pre>",
  tricky: "ORDER BY on a 10B-row table without LIMIT is a runaway query — always add LIMIT for ad-hoc exploration.", clientApp: "Cost and performance governance starts with efficient SQL patterns.",
  docLink: ""
},
{
  id: "SQL059", section: "SQL", topic: "Performance Benchmarking",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "How do you benchmark a SQL query fairly in Snowflake? What must you disable and what metrics do you capture?",
  answer: "<strong>Disable result cache:</strong><pre class=\"code-block\">ALTER SESSION SET USE_CACHED_RESULT = FALSE;</pre><strong>Run cold:</strong> suspend and resume warehouse to drop local cache before testing.<br><br><strong>Metrics to capture:</strong> elapsed time, bytes scanned, bytes spilled (local/remote), partitions scanned / total, warehouse size, query cost estimate (credits).<br><br><strong>Process:</strong> fix data volume, run 3+ times and take median, change one variable at a time, compare cost and latency together (a 2× faster query at 4× the warehouse is not a win).",
  tricky: "Comparing cold vs warm runs is valid only when explicitly stated; most users see warm results.", clientApp: "TCO justification for clustering, warehouse sizing and design choices.",
  docLink: "https://docs.snowflake.com/en/user-guide/querying-persisted-results"

{
  id: "SQL060", section: "SQL", topic: "Concurrency & Locking",
  type: "Conceptual", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "How does Snowflake handle concurrency? What is optimistic concurrency control and when do you get lock conflicts?",
  answer: "<strong>Snowflake uses MVCC (Multi-Version Concurrency Control):</strong> each transaction sees a consistent snapshot; readers don't block writers.<br><br><strong>Exceptions:</strong> DML on the same table rows can queue (UPDATE, DELETE, MERGE hold table-level locks). Long-running MERGE can block other DML on the same target table.<br><br><strong>Optimistic CC:</strong> proceed assuming no conflict; detect at commit time. Snowflake's approach is optimistic for reads, pessimistic for writes (row- or table-level locking depending on operation).",
  tricky: "Multiple MERGE statements against the same target table in parallel will queue, not run simultaneously.", clientApp: "Parallel task execution must be designed to avoid same-table write conflicts.",
  docLink: ""
},
{

  question: "Why use DECIMAL over FLOAT for financial data? Show the floating-point rounding problem.",
  answer: "<pre class=\"code-block\">-- Float representation issue\nSELECT 0.1 + 0.2;          -- 0.30000000000000004\nSELECT 0.1 + 0.2 = 0.3;    -- FALSE\n\n-- Fixed precision with DECIMAL/NUMBER\nSELECT TO_DECIMAL(0.1 + 0.2, 10, 2);  -- 0.30\nSELECT 0.10::DECIMAL(10,2) + 0.20::DECIMAL(10,2); -- 0.30</pre><strong>Use DECIMAL(p,s)/NUMBER(p,s)</strong> for money, tax, interest rates. Use FLOAT for scientific values where relative magnitude matters more than exact decimal representation.",
  tricky: "In Python, Decimal('0.1') + Decimal('0.2') == Decimal('0.3') is True; float(0.1)+float(0.2)==0.3 is False.", clientApp: "Financial reconciliation requires exact decimal arithmetic, not float.",

{
  id: "SQL062", section: "SQL", topic: "Analytical SQL",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "Write a cohort retention analysis: for each signup month, show what % of users were active in month 1, 2, 3 after signup.",
  answer: "<pre class=\"code-block\">WITH cohorts AS (\n  SELECT user_id,\n    DATE_TRUNC('month', signup_date) AS cohort_month\n  FROM users\n),\nactivity AS (\n  SELECT user_id,\n    DATE_TRUNC('month', activity_date) AS active_month\n  FROM user_activity\n),\njoined AS (\n  SELECT c.cohort_month,\n    DATEDIFF('month', c.cohort_month, a.active_month) AS month_offset,\n    COUNT(DISTINCT a.user_id) AS active_users\n  FROM cohorts c\n  JOIN activity a USING (user_id)\n  GROUP BY 1, 2\n),\ncohort_sizes AS (\n  SELECT cohort_month, COUNT(*) AS cohort_size FROM cohorts GROUP BY 1\n)\nSELECT j.cohort_month, j.month_offset,\n  j.active_users,\n  cs.cohort_size,\n  ROUND(j.active_users / cs.cohort_size * 100, 1) AS retention_pct\nFROM joined j\nJOIN cohort_sizes cs USING (cohort_month)\nORDER BY 1, 2;</pre>",
  tricky: "Use DATEDIFF('month',...) not day-based math to avoid month-length variation issues.", clientApp: "Retention analysis is a common ask in SaaS and e-commerce client projects.",
  docLink: ""
},
{
  id: "SQL063", section: "SQL", topic: "Analytical SQL",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "Write an RFM (Recency, Frequency, Monetary) segmentation query.",
  answer: "<pre class=\"code-block\">WITH rfm_base AS (\n  SELECT customer_id,\n    DATEDIFF('day', MAX(order_date), CURRENT_DATE()) AS recency_days,\n    COUNT(*) AS frequency,\n    SUM(amount) AS monetary\n  FROM orders\n  GROUP BY customer_id\n),\nscored AS (\n  SELECT *,\n    NTILE(5) OVER (ORDER BY recency_days ASC)  AS r_score,  -- lower=better\n    NTILE(5) OVER (ORDER BY frequency DESC)    AS f_score,\n    NTILE(5) OVER (ORDER BY monetary DESC)     AS m_score\n  FROM rfm_base\n)\nSELECT customer_id, recency_days, frequency, monetary,\n  r_score, f_score, m_score,\n  CONCAT(r_score, f_score, m_score) AS rfm_segment\nFROM scored\nORDER BY rfm_segment;</pre>",
  tricky: "NTILE score direction: lower recency_days = more recent = better score, so ORDER ASC for R.", clientApp: "RFM is a standard customer analytics framework across retail and fintech.",

  answer: "<pre class=\"code-block\">-- Run as a DQ validation batch\nSELECT 'null_customer_id'  AS check_name, COUNT(*) AS failures FROM customers WHERE customer_id IS NULL\nUNION ALL\nSELECT 'duplicate_id',   COUNT(*) - COUNT(DISTINCT customer_id) FROM customers\nUNION ALL\nSELECT 'invalid_email',  COUNT(*) FROM customers WHERE NOT REGEXP_LIKE(email, '^[\\\\w.+-]+@[\\\\w-]+\\\\.[\\\\w.]+$')\nUNION ALL\nSELECT 'future_dob',     COUNT(*) FROM customers WHERE date_of_birth > CURRENT_DATE()\nUNION ALL\nSELECT 'orphan_orders',  COUNT(*) FROM orders o WHERE NOT EXISTS (\n  SELECT 1 FROM customers c WHERE c.customer_id = o.customer_id\n);</pre>",

  question: "Write a source-to-target reconciliation query that checks row counts, total amount, min/max date and orphaned keys.",
  answer: "<pre class=\"code-block\">-- Source stats\nSELECT 'source' AS layer,\n  COUNT(*)       AS row_count,\n  SUM(amount)    AS total_amount,\n  MIN(order_date) AS min_date,\n  MAX(order_date) AS max_date\nFROM source_orders\n\nUNION ALL\n\nSELECT 'target',\n  COUNT(*), SUM(amount), MIN(order_date), MAX(order_date)\nFROM target_orders;\n\n-- Orphaned keys in target\nSELECT t.order_id\nFROM target_orders t\nLEFT JOIN source_orders s USING (order_id)\nWHERE s.order_id IS NULL;</pre>",

{
  id: "SQL068", section: "SQL", topic: "Advanced Join",
  type: "Tricky", difficulty: "Advanced", priority: "High Priority", coverage: "Beyond TOC",
  question: "A LEFT JOIN should preserve all customers, but after adding WHERE o.status='PAID', customers with no paid orders disappear. Why and how do you fix it?",
  answer: "<strong>Problem:</strong> The WHERE clause runs after the join, filtering out NULL-extended rows.<pre class=\"code-block\">-- Wrong: WHERE on right-side column eliminates unmatched left rows\nSELECT c.id, o.order_id\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.status = 'PAID';        -- drops customers with no orders!\n\n-- Fix: move filter to the ON clause\nSELECT c.id, o.order_id\nFROM customers c\nLEFT JOIN orders o\n  ON o.customer_id = c.id AND o.status = 'PAID';  -- customers kept</pre>",
  tricky: "This is the most common LEFT JOIN bug. The predicate in ON is applied during the join; in WHERE it's post-join.", clientApp: "Customer 360 and coverage reports must keep all customers regardless of transaction status.",
  docLink: ""
},
{
  id: "SQL069", section: "SQL", topic: "QUALIFY",
  type: "Coding", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "What does the QUALIFY clause do? Rewrite a ROW_NUMBER + subquery dedup using QUALIFY.",
  answer: "<strong>QUALIFY</strong> filters the output of window functions without a subquery — evaluated after SELECT and window functions but before ORDER BY and LIMIT.<pre class=\"code-block\">-- Traditional (subquery needed)\nSELECT * FROM (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) rn\n  FROM orders\n) WHERE rn = 1;\n\n-- Snowflake QUALIFY shorthand\nSELECT * FROM orders\nQUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1;</pre>",
  tricky: "QUALIFY is Snowflake/BigQuery/Teradata — not ANSI SQL. Flag this in cross-platform projects.", clientApp: "Standard dedup pattern; mention QUALIFY as a Snowflake productivity feature.",

},
{
  id: "SQL070", section: "SQL", topic: "Programming Fundamentals",
  type: "Conceptual", difficulty: "Beginner", priority: "Must Know", coverage: "Exact TOC",
  question: "What are the main types of SQL commands? Categorise: CREATE, SELECT, INSERT, GRANT, COMMIT, DROP.",
  answer: "<strong>SQL command categories:</strong><br>- <strong>DDL (Data Definition Language):</strong> CREATE, ALTER, DROP, TRUNCATE — define schema.<br>- <strong>DML (Data Manipulation Language):</strong> INSERT, UPDATE, DELETE, MERGE — modify data.<br>- <strong>DQL (Data Query Language):</strong> SELECT — query data (often folded into DML).<br>- <strong>DCL (Data Control Language):</strong> GRANT, REVOKE — control access.<br>- <strong>TCL (Transaction Control Language):</strong> COMMIT, ROLLBACK, SAVEPOINT — manage transactions.",
  tricky: "Some sources fold DQL into DML. In interviews, naming all five categories shows depth.", clientApp: "Used to classify statements in ETL audit logs and CI/CD migration scripts.",
  docLink: ""
},
{
  id: "SQL071", section: "SQL", topic: "Advanced Analytics",
  type: "Coding", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "Write a query to detect outliers: rows where the amount is more than 2 standard deviations from the mean.",
  answer: "<pre class=\"code-block\">WITH stats AS (\n  SELECT\n    AVG(amount)    AS mean_amt,\n    STDDEV(amount) AS std_amt\n  FROM transactions\n)\nSELECT t.*, s.mean_amt, s.std_amt,\n  (t.amount - s.mean_amt) / NULLIF(s.std_amt, 0) AS z_score\nFROM transactions t, stats s\nWHERE ABS((t.amount - s.mean_amt) / NULLIF(s.std_amt, 0)) > 2\nORDER BY ABS((t.amount - s.mean_amt) / NULLIF(s.std_amt, 0)) DESC;</pre>",
  tricky: "Statistical outliers may be legitimate (seasonal spikes, bulk orders); confirm with business before removing.", clientApp: "Fraud detection, anomaly alerting and data quality monitoring.",
  docLink: ""
},
{
  id: "SQL072", section: "SQL", topic: "Month-over-Month Growth",
  type: "Coding", difficulty: "Intermediate", priority: "High Priority", coverage: "Beyond TOC",
  question: "Write a query showing monthly revenue, previous month revenue, and month-over-month growth %.",
  answer: "<pre class=\"code-block\">WITH monthly AS (\n  SELECT DATE_TRUNC('month', order_date) AS month, SUM(amount) AS revenue\n  FROM orders\n  GROUP BY 1\n)\nSELECT\n  month,\n  revenue,\n  LAG(revenue) OVER (ORDER BY month) AS prev_month_revenue,\n  ROUND(\n    (revenue - LAG(revenue) OVER (ORDER BY month))\n    / NULLIF(LAG(revenue) OVER (ORDER BY month), 0) * 100,\n    1\n  ) AS mom_growth_pct\nFROM monthly\nORDER BY month;</pre>",
  tricky: "First row has NULL prev_month and NULL growth — handle in BI layer or COALESCE.", clientApp: "Standard KPI calculation in executive dashboards.",
  docLink: ""
},
{

{
  id: "SQL074", section: "SQL", topic: "Performance",
  type: "Performance", difficulty: "Advanced", priority: "High Priority", coverage: "Exact TOC",
  question: "What makes a WHERE predicate 'sargable'? Give three non-sargable rewrites and their sargable equivalents.",
  answer: "<strong>Sargable (Search ARGument ABLE):</strong> the optimizer can use pruning/index for the predicate.<br><br><strong>Non-sargable → Sargable:</strong><pre class=\"code-block\">-- Bad: function wraps the column\nWHERE YEAR(order_date) = 2025\n-- Good:\nWHERE order_date >= '2025-01-01' AND order_date < '2026-01-01'\n\n-- Bad: implicit cast\nWHERE customer_id = '123'   -- customer_id is INT\n-- Good:\nWHERE customer_id = 123\n\n-- Bad: negation on indexed column\nWHERE status != 'INACTIVE'\n-- Good (reframe positively):\nWHERE status IN ('ACTIVE','PENDING','CLOSED')</pre>",
  tricky: "Sargability matters most on high-cardinality columns used in clustering or heavy-scan tables.", clientApp: "SQL code reviews should flag non-sargable predicates as performance issues.",
  docLink: ""
},
{
  id: "SQL075", section: "SQL", topic: "Scenario",
  type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "A daily sales report doubled in row count after a new dimension join was added. Diagnose and fix.",
  answer: "<strong>Root cause:</strong> The dimension (e.g. dim_customer) has duplicate rows on the join key (customer_id), creating a many-to-many join.<br><br><strong>Diagnosis:</strong><pre class=\"code-block\">-- Check for duplicates in the dimension\nSELECT customer_id, COUNT(*) n\nFROM dim_customer\nGROUP BY customer_id HAVING COUNT(*) > 1;\n\n-- Compare counts before and after join\nSELECT COUNT(*) FROM fact_sales;          -- baseline\nSELECT COUNT(*) FROM fact_sales f         -- after join\nJOIN dim_customer d ON d.customer_id = f.customer_id;</pre><strong>Fix options:</strong> deduplicate the dimension on customer_id before joining; or join on a more granular unique key (surrogate key with effective date for SCD2).",
  tricky: "Never apply DISTINCT to hide a join explosion — fix the root cause.", clientApp: "Dimension join row explosion is the most common analytics incident.",
  docLink: ""
},
{
  id: "SQL076", section: "SQL", topic: "Scenario",
  type: "Scenario", difficulty: "Advanced", priority: "Must Know", coverage: "Beyond TOC",
  question: "You run COPY INTO and it reports success, but only 80% of rows were loaded. Investigate.",
  answer: "<strong>Step 1:</strong> Check the COPY command result — look at rows_parsed, rows_loaded, errors_seen, first_error.<pre class=\"code-block\">SELECT * FROM TABLE(INFORMATION_SCHEMA.COPY_HISTORY(\n  TABLE_NAME=>'ORDERS', START_TIME=>DATEADD(hour,-1,CURRENT_TIMESTAMP())));\n\n-- Validate for errors\nCOPY INTO orders FROM @my_stage VALIDATION_MODE = RETURN_ERRORS;</pre><strong>Step 2:</strong> Check ON_ERROR setting — CONTINUE loads valid rows and skips bad ones (reports success but reduced count).<br><strong>Step 3:</strong> Compare staged file row count vs loaded.<br><strong>Step 4:</strong> Inspect SKIP_HEADER, delimiter, file format settings.",
